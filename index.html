<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist Mantención · Jardines de Vicuña Mackenna</title>
<style>
  :root{
    --bg:#10161D; --panel:#1B2430; --panel-alt:#232F3E; --line:#2C3947;
    --text:#E8EDF2; --text-dim:#8B98A8; --accent:#E8A33D; --accent-dim:#8a6423;
    --radius:10px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent; padding-bottom:calc(70px + var(--safe-b));
  }
  .mono{font-family:ui-monospace,"SF Mono","Roboto Mono","Courier New",monospace;}
  button{font-family:inherit;}
  .hidden{display:none !important;}
  img{max-width:100%;}

  .fullscreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card-setup{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; max-width:420px; width:100%;}
  .card-setup h1{font-size:1.15rem; margin:0 0 4px;}
  .card-setup p{color:var(--text-dim); font-size:.88rem; line-height:1.5;}
  .field{margin-top:14px;}
  .field label{display:block; font-size:.78rem; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--panel-alt); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:11px 12px; font-size:.95rem; outline:none;
  }
  .field textarea{font-family:inherit; min-height:84px; resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .hint{font-size:.72rem; color:var(--text-dim); margin-top:4px;}
  .btn{border:none; border-radius:9px; padding:12px 16px; font-size:.92rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .btn-primary{background:var(--accent); color:#1a1206; width:100%; margin-top:14px;}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--line);}
  .btn-danger{background:#D6534A; color:#fff;}
  .btn-sm{padding:9px 12px; font-size:.82rem; border-radius:7px;}
  .btn-row{display:flex; gap:8px; margin-top:12px;}
  .btn-row .btn{flex:1; margin-top:0;}
  .err-msg{color:#D6534A; font-size:.82rem; margin-top:10px;}

  header.app-header{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,#141B24,#10161D); border-bottom:1px solid var(--line); padding:12px 14px 0;}
  .h-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .h-title{font-size:.98rem; font-weight:700;}
  .h-sub{font-size:.72rem; color:var(--text-dim); margin-top:1px;}
  .h-actions{display:flex; gap:6px;}
  .icon-btn{background:var(--panel-alt); border:1px solid var(--line); color:var(--text); width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:1rem; cursor:pointer;}

  .summary-row{display:flex; gap:6px; margin:10px 0 8px; overflow-x:auto;}
  .pill{flex:0 0 auto; font-size:.72rem; padding:5px 10px; border-radius:99px; border:1px solid var(--line); color:var(--text-dim); white-space:nowrap;}
  .pill b{color:var(--text);}

  .tabs{display:flex; gap:6px; margin-top:6px; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; min-width:64px; text-align:center; padding:9px 10px; border-radius:8px 8px 0 0; font-size:.85rem; font-weight:700; color:var(--text-dim); border:1px solid var(--line); border-bottom:none; background:var(--panel); cursor:pointer; white-space:nowrap;}
  .tab.active{color:var(--bg); background:var(--accent); border-color:var(--accent);}

  .toolbar{display:flex; gap:8px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); align-items:center;}
  .toolbar input[type=text]{flex:1; background:var(--panel-alt); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 10px; font-size:.88rem; outline:none;}
  .toggle-pend{display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--text-dim); white-space:nowrap;}
  .switch{position:relative; width:38px; height:22px; background:var(--panel-alt); border:1px solid var(--line); border-radius:99px; cursor:pointer;}
  .switch.on{background:var(--accent-dim); border-color:var(--accent);}
  .switch .knob{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--text-dim); transition:left .15s;}
  .switch.on .knob{left:18px; background:var(--accent);}

  .floor-dock{display:flex; gap:5px; overflow-x:auto; padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--line); scrollbar-width:none;}
  .floor-dock::-webkit-scrollbar{display:none;}
  .floor-chip{flex:0 0 auto; width:34px; height:34px; border-radius:6px; background:#0D1218; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; color:var(--text-dim); cursor:pointer; position:relative; overflow:hidden;}
  .floor-chip .led{position:absolute; bottom:2px; left:4px; right:4px; height:3px; border-radius:2px; background:#5B6675;}

  main{padding:12px 14px 24px;}
  .floor-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; scroll-margin-top:150px;}
  .floor-head{display:flex; align-items:center; justify-content:space-between; padding:11px 13px; background:var(--panel-alt); border-bottom:1px solid var(--line);}
  .floor-num{font-family:ui-monospace,"SF Mono","Roboto Mono",monospace; font-weight:800; font-size:1.05rem;}
  .floor-tag{font-size:.68rem; color:var(--text-dim); margin-left:6px;}
  .floor-count{font-size:.72rem; color:var(--text-dim);}

  .item-row{display:flex; align-items:center; gap:10px; padding:10px 13px; border-bottom:1px solid var(--line); cursor:pointer;}
  .item-row:last-of-type{border-bottom:none;}
  .dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto;}
  .item-main{flex:1; min-width:0;}
  .item-cat{font-size:.86rem; font-weight:600; display:flex; align-items:center; gap:6px;}
  .folio-tag{font-size:.63rem; color:var(--text-dim); font-family:ui-monospace,monospace; font-weight:400;}
  .stale-badge{font-size:.68rem; color:#E8A33D; display:inline-block; margin-top:2px;}
  .item-detalle{font-size:.76rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .chev{color:var(--text-dim); font-size:.9rem;}

  .add-fault-btn{display:block; width:100%; text-align:center; padding:10px; font-size:.82rem; color:var(--accent); background:transparent; border:none; border-top:1px dashed var(--line); cursor:pointer;}

  .fab-wrap{position:fixed; right:14px; bottom:calc(16px + var(--safe-b)); display:flex; flex-direction:column; gap:10px; z-index:30;}
  .fab{width:52px; height:52px; border-radius:50%; background:var(--accent); color:#1a1206; border:none; box-shadow:0 6px 16px rgba(0,0,0,.4); font-size:1.25rem; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .fab.secondary{background:var(--panel-alt); color:var(--text); border:1px solid var(--line); width:44px; height:44px; font-size:1.05rem;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); top:calc(14px + env(safe-area-inset-top, 0px)); max-width:92vw; text-align:center; background:#0D1218; color:var(--text); padding:10px 16px; border-radius:99px; font-size:.82rem; border:1px solid var(--line); z-index:70; opacity:0; transition:opacity .2s;}
  .toast.show{opacity:1;}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px 16px 0 0; padding:18px 16px calc(18px + var(--safe-b)); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;}
  .modal h2{font-size:1rem; margin:0 0 4px;}
  .modal .sub{font-size:.76rem; color:var(--text-dim); margin-bottom:10px;}

  .badge{display:inline-block; font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:99px;}
  .kv{display:flex; justify-content:space-between; font-size:.8rem; padding:6px 0; border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text-dim);}

  .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
  .chip{padding:7px 11px; border-radius:99px; font-size:.78rem; border:1px solid var(--line); color:var(--text-dim); cursor:pointer;}
  .chip.selected{color:var(--accent); border-color:var(--accent); background:#3a2c111a;}

  .photo-row{display:flex; gap:8px; margin-top:8px;}
  .photo-thumb{width:70px; height:70px; border-radius:8px; object-fit:cover; border:1px solid var(--line); cursor:pointer;}
  .photo-preview{max-width:100%; border-radius:8px; margin-top:8px; display:block;}

  .bit-entry{padding:8px 0; border-bottom:1px solid var(--line); font-size:.78rem;}
  .bit-entry:last-child{border-bottom:none;}
  .bit-date{color:var(--text-dim); font-size:.68rem;}
  .bit-transition{font-weight:600; margin:2px 0;}

  .action-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .action-list .btn{width:100%; margin-top:0;}

  .banner{padding:9px 14px; font-size:.78rem; text-align:center;}
  .banner.warn{background:#3A1E1C; color:#D6534A;}
  .empty-note{color:var(--text-dim); font-size:.82rem; text-align:center; padding:30px 10px;}
  .section-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin:16px 0 8px;}

  .dash-tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:6px 0 4px;}
  .tile{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center;}
  .tile-num{font-size:1.4rem; font-weight:800; font-family:ui-monospace,"SF Mono",monospace;}
  .tile-label{font-size:.66rem; color:var(--text-dim); margin-top:2px; text-transform:uppercase; letter-spacing:.04em;}
  .bar-row{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:.78rem;}
  .bar-label{width:118px; flex:0 0 auto; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{flex:1; height:10px; background:var(--panel-alt); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px;}
  .bar-count{width:26px; flex:0 0 auto; text-align:right; color:var(--text-dim); font-family:ui-monospace,monospace;}
  .dash-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:10px;}

  /* ===== Pantalla de inicio ===== */
  .home-greet{font-size:1.15rem; font-weight:800; margin:2px 0 2px;}
  .home-sub{font-size:.78rem; color:var(--text-dim); margin-bottom:6px;}
  .alert-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .alert-card{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--ac,#5B6675); border-radius:12px; padding:13px 12px; cursor:pointer; min-height:92px; display:flex; flex-direction:column; justify-content:space-between;}
  .alert-card:active, .mod-card:active{transform:scale(.98);}
  .alert-card .a-num{font-size:1.9rem; font-weight:800; font-family:ui-monospace,"SF Mono",monospace; line-height:1; color:var(--ac,#E8EDF2);}
  .alert-card.zero .a-num{color:var(--text-dim);}
  .alert-card.zero{opacity:.75;}
  .alert-card .a-label{font-size:.78rem; font-weight:700; margin-top:6px;}
  .alert-card .a-hint{font-size:.66rem; color:var(--text-dim); margin-top:1px;}
  .mod-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .mod-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 12px; cursor:pointer; text-align:left; color:var(--text); display:flex; flex-direction:column; gap:4px; min-height:96px;}
  .mod-card .m-ico{font-size:1.6rem; line-height:1;}
  .mod-card .m-title{font-size:.92rem; font-weight:700; margin-top:4px;}
  .mod-card .m-meta{font-size:.7rem; color:var(--text-dim);}
  .mod-card .m-meta b{color:var(--accent);}
  .mod-card.wide{grid-column:span 2; flex-direction:row; align-items:center; gap:12px; min-height:0;}
  .mod-card.wide .m-ico{font-size:1.5rem;}
  .alert-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .alert-head .back{background:var(--panel-alt); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:8px 12px; font-size:.82rem; cursor:pointer;}
  .alert-head .a-title{font-size:1rem; font-weight:800;}
  .alert-head .a-count{font-size:.72rem; color:var(--text-dim);}

  /* ===== Asistente de reporte ===== */
  .wz-prog{display:flex; gap:6px; margin:4px 0 14px;}
  .wz-prog i{flex:1; height:4px; border-radius:2px; background:var(--line);}
  .wz-prog i.on{background:var(--accent);}
  .wz-q{font-size:1.05rem; font-weight:800; margin:2px 0 10px;}
  .wz-q2{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin:14px 0 6px;}
  .wz-hint{font-size:.76rem; color:var(--text-dim); margin:-4px 0 10px;}
  .wz-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .wz-grid.four{grid-template-columns:repeat(4,1fr);}
  .wz-grid.three{grid-template-columns:repeat(3,1fr);}
  .wz-btn{background:var(--panel-alt); border:1px solid var(--line); color:var(--text); border-radius:11px; padding:14px 8px; font-size:.88rem; font-weight:600; cursor:pointer; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:58px;}
  .wz-btn.sm{padding:11px 6px; font-size:.8rem; min-height:52px;}
  .wz-btn .ico{font-size:1.3rem; line-height:1;}
  .wz-btn.sel{border-color:var(--accent); background:#3a2c111a; color:var(--accent);}
  .wz-two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .wz-link{background:none; border:none; color:var(--accent); font-size:.82rem; margin-top:10px; padding:6px 0; cursor:pointer;}
  .wz-urg{display:flex; align-items:center; gap:10px; margin:12px 0 2px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--panel-alt); font-size:.9rem; font-weight:600; cursor:pointer;}
  .wz-urg input{width:20px; height:20px; accent-color:#D6534A;}
  .wz-summary{margin-top:14px; padding:10px 12px; border-radius:10px; background:var(--panel-alt); border:1px dashed var(--line); font-size:.8rem; line-height:1.6;}
  .wz-done{text-align:center; padding:8px 0 4px;}
  .wz-check{width:58px; height:58px; margin:0 auto; border-radius:50%; background:#2FA86B22; color:#2FA86B; display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:800;}
  .wz-folio{font-family:ui-monospace,"SF Mono",monospace; font-size:1.3rem; font-weight:800; color:var(--accent);}

  /* ===== Niveles y prioridad ===== */
  .prio-chip{display:inline-block; font-size:.62rem; font-weight:700; padding:1px 7px; border-radius:99px; border:1px solid var(--pc); color:var(--pc); margin-left:4px; vertical-align:middle; white-space:nowrap;}
  .prio-box{border:1px solid var(--pc); border-left-width:5px; border-radius:10px; padding:10px 12px; background:color-mix(in srgb, var(--pc) 10%, transparent); margin-bottom:8px;}
  .prio-big{font-size:1.05rem; font-weight:800; color:var(--pc);}
  .prio-sub{font-size:.72rem; color:var(--text-dim); margin-top:2px;}
  .niv-row{margin:10px 0;}
  .niv-k{font-size:.8rem; font-weight:700; margin-bottom:5px;}
  .niv-k span{font-weight:400; color:var(--text-dim); font-size:.68rem; margin-left:4px;}
  .seg{display:flex; gap:6px;}
  .seg button{flex:1; padding:10px 4px; border-radius:9px; border:1px solid var(--line); background:var(--panel-alt); color:var(--text-dim); font-size:.8rem; font-weight:600; cursor:pointer;}
  .seg button.on{border-color:var(--accent); color:var(--accent); background:#3a2c111a;}
  .seg button.on.danger{border-color:#D6534A; color:#D6534A; background:#D6534A18;}
  .seg-sug{font-size:.64rem; color:var(--text-dim); margin-top:3px; font-style:italic;}
  .prio-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px;}
  .prio-tile{border:1px solid var(--pc); border-radius:10px; padding:8px 4px; text-align:center; cursor:pointer; background:color-mix(in srgb, var(--pc) 8%, transparent);}
  .prio-tile .n{font-size:1.3rem; font-weight:800; color:var(--pc); font-family:ui-monospace,"SF Mono",monospace; line-height:1.1;}
  .prio-tile .l{font-size:.62rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}

  /* ===== Plan de trabajo ===== */
  .plan-win{margin:14px 0 6px; border-left:4px solid var(--pc); padding-left:8px;}
  .plan-win-head{display:flex; flex-direction:column; font-size:1rem; font-weight:800; color:var(--pc); margin-bottom:4px;}
  .plan-win-sub{font-size:.7rem; font-weight:400; color:var(--text-dim);}
  .plan-grp{font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); margin:8px 0 4px;}
  .plan-grp span{font-weight:400;}
  .plan-banner{background:var(--panel-alt); border:1px dashed var(--line); border-radius:10px; padding:9px 12px; font-size:.78rem; color:var(--text-dim); margin:8px 0;}
  .plan-table{width:100%; border-collapse:collapse; margin-top:8px; font-size:.78rem;}
  .plan-table th{text-align:left; color:var(--text-dim); font-weight:600; font-size:.68rem; text-transform:uppercase; padding:4px 6px; border-bottom:1px solid var(--line);}
  .plan-table td{padding:6px; border-bottom:1px solid var(--line);}
  details.dash-card summary::-webkit-details-marker{display:none;}

  /* ===== Torres: hero y mapa de pisos ===== */
  .tw-hero{background:linear-gradient(135deg,#1f2d40 0%,#16202c 100%); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .tw-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .tw-name{font-size:1.3rem; font-weight:800;}
  .tw-sub{font-size:.76rem; color:var(--text-dim); margin-top:2px;}
  .tw-pct{text-align:right;}
  .tw-pct b{font-size:1.6rem; font-family:ui-monospace,"SF Mono",monospace; color:var(--accent); display:block; line-height:1;}
  .tw-pct span{font-size:.66rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
  .tw-bar{height:8px; border-radius:6px; background:#0D1218; overflow:hidden; margin-top:10px;}
  .tw-bar i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,#2FA86B,#7ed3a3);}
  .fl-map{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px;}
  .fl-row{display:grid; grid-template-columns:repeat(6,1fr); gap:7px; margin-bottom:7px;}
  .fl-sub-title{font-size:.66rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin:6px 2px 6px;}
  .fl-tile{position:relative; aspect-ratio:1/1; border-radius:11px; border:1px solid var(--line); background:#2a3442; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .08s, opacity .15s;}
  .fl-tile:active{transform:scale(.94);}
  .fl-tile.dim{opacity:.22;}
  .fl-num{font-weight:800; font-size:.95rem; font-family:ui-monospace,"SF Mono",monospace;}
  .fl-tile.st-sin, .lg.st-sin{background:#2a3442; border-color:#3a4658; color:var(--text-dim);}
  .fl-tile.st-vacio{background:transparent; border-style:dashed; color:var(--text-dim); opacity:.5;}
  .fl-tile.st-parcial, .lg.st-parcial{background:#3a3a24; border-color:#6b6a35; color:#e6dc8f;}
  .fl-tile.st-ok, .lg.st-ok{background:#16402b; border-color:#2FA86B; color:#7ed3a3;}
  .fl-tile.st-fallas, .lg.st-fallas{background:color-mix(in srgb, var(--pc,#D6534A) 28%, #1B2430); border-color:var(--pc,#D6534A); color:#fff;}
  .fl-badge{position:absolute; top:-6px; right:-6px; min-width:19px; height:19px; padding:0 5px; border-radius:99px; background:var(--pc,#D6534A); color:#fff; font-size:.7rem; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.4);}
  .fl-check{position:absolute; bottom:2px; right:5px; font-size:.62rem; color:#7ed3a3;}
  .fl-legend{display:flex; gap:12px; flex-wrap:wrap; font-size:.68rem; color:var(--text-dim); margin:8px 2px 0;}
  .fl-legend .lg{display:inline-block; width:11px; height:11px; border-radius:3px; border:1px solid; vertical-align:-1px; margin-right:4px;}
  .fl-item{display:flex; align-items:center; gap:10px; padding:10px; margin-bottom:8px; background:var(--panel-alt); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:11px; cursor:pointer;}
  .fl-ico{font-size:1.4rem; width:34px; text-align:center; flex:0 0 auto;}
  .fl-main{flex:1; min-width:0;}
  .fl-cat{font-size:.88rem; font-weight:700;}
  .fl-sub{font-size:.72rem; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fl-acts{display:flex; gap:6px; flex:0 0 auto;}
  .fl-acts button{border-radius:9px; padding:9px 10px; font-size:.78rem; font-weight:700; cursor:pointer; border:1px solid;}
  .fl-ok{background:#2FA86B; border-color:#2FA86B; color:#06210f;}
  .fl-bad{background:transparent; border-color:#D6534A; color:#D6534A;}

  /* ===== Semáforo ===== */
  .sem-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .sem-card{display:flex; align-items:center; gap:10px; background:linear-gradient(135deg,color-mix(in srgb,var(--sc) 16%,var(--panel)),var(--panel)); border:1px solid var(--sc); border-radius:14px; padding:11px 10px; cursor:pointer;}
  .sem-card.wide{grid-column:span 2;}
  .sem-card:active{transform:scale(.98);}
  .sem-dot{font-size:1.9rem; line-height:1;}
  .sem-main{flex:1; min-width:0;}
  .sem-name{font-size:.88rem; font-weight:800;}
  .sem-state{font-size:.72rem; font-weight:700; color:var(--sc);}
  .sem-why{font-size:.66rem; color:var(--text-dim); margin-top:1px;}
  .sem-meta{text-align:center; flex:0 0 auto;}
  .sem-meta b{display:block; font-size:1.05rem; font-family:ui-monospace,"SF Mono",monospace;}
  .sem-meta span{font-size:.56rem; color:var(--text-dim); line-height:1.1; display:block;}
  .sem-help{margin-top:8px; font-size:.72rem; color:var(--text-dim);}
  .sem-help summary{cursor:pointer;}
  .sem-help div{margin-top:6px; line-height:1.6;}
  .tw-light{display:inline-flex; align-items:center; gap:5px; margin-top:6px; font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:99px; border:1px solid var(--sc); color:var(--sc);}
</style>
</head>
<body>

<div id="loginScreen" class="fullscreen hidden">
  <div class="card-setup">
    <h1>🔒 Iniciar sesión</h1>
    <p>Ingresa tus datos y el código de acceso. Queda registrado quién entra, cuándo y desde dónde.</p>
    <div class="field"><label>Nombre</label><input type="text" id="loginNombre" name="mant_nombre_field" placeholder="Ej: Patricio" autocomplete="off" autocapitalize="words"></div>
    <div class="field"><label>Correo (recomendado)</label><input type="email" id="loginEmail" name="mant_email_field" placeholder="tucorreo@ejemplo.com" autocomplete="off"></div>
    <div class="field"><label>Código de acceso</label><input type="password" id="loginCodigo" name="mant_codigo_field" placeholder="Código" inputmode="text" autocomplete="new-password"></div>
    <div class="field" style="display:flex; align-items:center; gap:8px; margin-top:10px;">
      <input type="checkbox" id="loginRemember" style="width:auto;">
      <label style="margin:0; text-transform:none; font-size:.82rem; color:var(--text-dim);" for="loginRemember">Recordar mis datos en este dispositivo (solo si es tu celular personal)</label>
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="submitLogin()">Ingresar</button>
    <div class="err-msg hidden" id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="app-header">
    <div class="h-top">
      <div><div class="h-title">Checklist de Mantención</div><div class="h-sub">Jardines de Vicuña Mackenna</div></div>
      <div class="h-actions">
        <button class="icon-btn" id="btnGestion" onclick="openReportModal()" title="Reporte de gestión">📊</button>
        <button class="icon-btn" id="btnImprimir" onclick="openPdfActivasModal()" title="Imprimir fallas">🖨️</button>
        <button class="icon-btn" onclick="manualSync()" title="Sincronizar"><span id="syncIcon">⟳</span></button>
        <button class="icon-btn" onclick="confirmLogout()" title="Cerrar sesión">🚪</button>
      </div>
    </div>
    <div class="summary-row" id="summaryRow"></div>
    <div class="tabs" id="tabsRow"></div>
  </header>

  <div id="offlineBanner" class="banner warn hidden">Sin conexión — mostrando datos guardados. Tus cambios se enviarán al recuperar señal. <span style="text-decoration:underline;cursor:pointer" onclick="manualSync()">Reintentar</span></div>
  <main id="mainList"></main>
</div>

<div id="toast" class="toast"></div>

<script>
/* ================= CONFIG / ESTADO ================= */
const CATS_FIJAS = ['LUCES','MANILLAS','PUERTAS','CARTEL S. EMERGENCIA'];
const TORRES = ['Torre A','Torre B','Torre C','Torre D'];
const TORRES_ALL = [...TORRES, 'Común'];
const CATEGORIA_FUGA = 'FILTRACIONES';
const CATEGORIA_FUGA_LEGACY = 'FUGAS/FILTRACIONES'; // compatibilidad con reportes ya creados antes del cambio de nombre
const CATEGORIAS_NUEVAS = ['FILTRACIÓN ESTACIONAMIENTO','FILTRACIÓN VERTICAL SUBTERRÁNEO','FILTRACIÓN HORIZONTAL SUBTERRÁNEO',
  'BODEGA: PINTURA','BODEGA: FILTRACIÓN','BODEGA: OTRO DAÑO','CÁMARAS DE SEGURIDAD','MONITORES CONSERJERÍA',
  'JARDINES','JUEGOS','QUINCHOS','PASTO','BASUREROS'];
function esFiltracionCat(c){ return /filtraci|fuga/i.test(String(c||'')); }
function mergeCategorias(list){ const out = [...(list||[])]; CATEGORIAS_NUEVAS.forEach(c=>{ if(!out.includes(c)) out.push(c); }); return out; }
const ACTIVE_STATES = ['Nuevo','Pendiente','Derivado','En proceso'];
const COMUNIDAD = 'Jardines de Vicuña Mackenna';

const ESTADO_COLORS = {
  'Sin revisar':'#5B6675', 'Nuevo':'#2FB6A3', 'Pendiente':'#D6534A', 'Derivado':'#9B7FE0',
  'En proceso':'#E8A33D', 'Resuelto':'#3B82C4', 'OK':'#2FA86B', 'Descartado':'#8A7A68'
};

const TRANSICIONES = {
  'Sin revisar': [
    { label:'Marcar OK', to:'OK', code:'SINREVISAR_A_OK' },
    { label:'Reportar falla', to:'Nuevo', code:'REPORTAR', needsDetalle:true }
  ],
  'Nuevo': [
    { label:'Confirmar pendiente', to:'Pendiente', code:'NUEVO_A_PENDIENTE' },
    { label:'Descartar', to:'Descartado', code:'NUEVO_A_DESCARTADO', requiereMotivo:true }
  ],
  'Pendiente': [
    { label:'Derivar a un área', to:'Derivado', code:'PENDIENTE_A_DERIVADO', needsArea:true },
    { label:'Cerrar (sin falla)', to:'Descartado', code:'PENDIENTE_A_DESCARTADO', requiereMotivo:true }
  ],
  'Derivado': [
    { label:'Marcar en proceso', to:'En proceso', code:'DERIVADO_A_PROCESO' },
    { label:'Devolver a pendiente', to:'Pendiente', code:'DERIVADO_A_PENDIENTE' }
  ],
  'En proceso': [
    { label:'Marcar resuelto', to:'Resuelto', code:'PROCESO_A_RESUELTO', fotoRecomendada:true, requiereMotivo:true }
  ],
  'Resuelto': [ { label:'Reabrir', to:'Pendiente', code:'REABRIR' } ],
  'OK': [ { label:'Reabrir (reportar falla)', to:'Pendiente', code:'REABRIR' } ],
  'Descartado': [ { label:'Reabrir', to:'Pendiente', code:'REABRIR' } ]
};

const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyx_scztWVMGLkrFMka3D4-2Ya7JVkWyOZPLaOQY_1s8Q4PcuRBTgdkyJz4JpP5pMXl/exec';

let CFG = { apiUrl: DEFAULT_API_URL };
let CURRENT_USER = null; // { nombre, email, rol: 'Admin' | 'Volante' }
let STATE = {
  items:[], bitacora:[], categorias:[], derivaciones:[], motivos:[], ubicaciones:[],
  currentTorre:'Torre A', view:'checklist', pendOnly:false, search:'', online:true, syncing:false,
  dash:null, fugas:null, deptos:null, simple:null
};
let activeModalBg = null;
let pendingPhoto = { base64:null, mime:null };

function floorsList(){
  const arr=[]; for(let p=24;p>=1;p--) arr.push(p); for(let p=-1;p>=-3;p--) arr.push(p); return arr;
}
function catOrder(c){ const i = CATS_FIJAS.indexOf(c); return i===-1 ? 100 : i; }
function parseFH(str){ if(!str) return null; return new Date(String(str).replace(' ','T')); }
function diasEntre(a,b){ if(!a) return null; const d2=b?parseFH(b):new Date(); const d1=parseFH(a); if(!d1) return null; return Math.max(0, Math.round((d2-d1)/86400000)); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }
function userTag(){
  return {
    usuario: CURRENT_USER ? CURRENT_USER.nombre : '',
    email: CURRENT_USER ? CURRENT_USER.email : '',
    rol: CURRENT_USER ? CURRENT_USER.rol : '',
    autor: CURRENT_USER ? CURRENT_USER.nombre : '',
    userAgent: navigator.userAgent
  };
}

/* ================= ARRANQUE / LOGIN ================= */
window.addEventListener('load', init);
window.addEventListener('online', ()=>{ STATE.online=true; flushQueue(); });
window.addEventListener('offline', ()=>{ STATE.online=false; updateSyncIcon(); });

function init(){
  CFG = { apiUrl: DEFAULT_API_URL };
  localStorage.setItem('mant_cfg', JSON.stringify(CFG));

  const sessionUser = sessionStorage.getItem('mant_session_user');
  if(sessionUser){
    CURRENT_USER = JSON.parse(sessionUser);
    startApp();
    return;
  }

  const remembered = localStorage.getItem('mant_remember');
  if(remembered){
    const r = JSON.parse(remembered);
    doLogin(r.nombre, r.email, r.codigo, true, true);
    return;
  }

  showLoginScreen();
}

function showLoginScreen(prefill){
  document.getElementById('loginScreen').classList.remove('hidden');
  if(prefill){
    document.getElementById('loginNombre').value = prefill.nombre || '';
    document.getElementById('loginEmail').value = prefill.email || '';
  }
}

function getLocationString(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve('No disponible (sin soporte)'); return; }
    const timer = setTimeout(()=>resolve('No disponible (sin permiso o tiempo agotado)'), 6000);
    navigator.geolocation.getCurrentPosition(
      pos=>{ clearTimeout(timer); resolve(pos.coords.latitude.toFixed(5)+', '+pos.coords.longitude.toFixed(5)); },
      ()=>{ clearTimeout(timer); resolve('No disponible (permiso denegado)'); },
      { timeout:5000 }
    );
  });
}

function submitLogin(){
  const nombre = document.getElementById('loginNombre').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  const codigo = document.getElementById('loginCodigo').value.trim();
  const remember = document.getElementById('loginRemember').checked;
  if(!nombre){ showLoginError('Ingresa tu nombre'); return; }
  if(!codigo){ showLoginError('Ingresa el código de acceso'); return; }
  doLogin(nombre, email, codigo, remember, false);
}

function showLoginError(msg){
  const e = document.getElementById('loginErr');
  e.textContent = msg; e.classList.remove('hidden');
}

async function doLogin(nombre, email, codigo, remember, silent){
  const btn = document.getElementById('loginBtn');
  if(btn && !silent){ btn.textContent = 'Verificando...'; btn.disabled = true; }
  const ubicacion = await getLocationString();
  const payload = { action:'login', nombre, email, codigo, userAgent: navigator.userAgent, ubicacion };
  try {
    const res = await apiPost(payload);
    if(res.success){
      CURRENT_USER = { nombre, email, rol: res.rol };
      sessionStorage.setItem('mant_session_user', JSON.stringify(CURRENT_USER));
      if(remember){ localStorage.setItem('mant_remember', JSON.stringify({nombre, email, codigo})); }
      else { localStorage.removeItem('mant_remember'); }
      document.getElementById('loginScreen').classList.add('hidden');
      startApp();
    } else {
      showLoginScreen({nombre, email});
      showLoginError(res.error || 'Código de acceso incorrecto');
    }
  } catch(err){
    showLoginScreen({nombre, email});
    showLoginError('No se pudo verificar el acceso. Revisa tu conexión e intenta de nuevo.');
  } finally {
    if(btn){ btn.textContent = 'Ingresar'; btn.disabled = false; }
  }
}

function logout(){
  sessionStorage.removeItem('mant_session_user');
  localStorage.removeItem('mant_remember');
  location.reload();
}

function startApp(){
  document.getElementById('app').classList.remove('hidden');
  STATE.view = 'home';
  document.getElementById('btnGestion').style.display = (CURRENT_USER.rol === 'Admin') ? 'flex' : 'none';
  document.getElementById('btnImprimir').style.display = (CURRENT_USER.rol === 'Admin') ? 'flex' : 'none';
  renderTabs(); loadData(); setInterval(flushQueue, 25000);
  setInterval(loadData, 90000); // auto-refresh cada 90s para detectar registros nuevos
}

/* ================= CARGA / SYNC ================= */
function updateSyncIcon(){
  document.getElementById('syncIcon').textContent = STATE.syncing ? '⏳' : (STATE.online ? '⟳' : '⚠');
}
let previousFolios = null;
function checkNewRecords(items){
  const currentFolios = new Set(items.map(i=>i.Folio));
  if(previousFolios){
    let newCount = 0;
    currentFolios.forEach(f=>{ if(!previousFolios.has(f)) newCount++; });
    if(newCount > 0){
      showToast('🆕 ' + newCount + ' nuevo' + (newCount>1?'s registros':' registro') + ' desde tu última revisión');
    }
  }
  previousFolios = currentFolios;
}
function loadData(){
  STATE.syncing = true; updateSyncIcon();
  fetch(CFG.apiUrl + '?action=list')
    .then(r=>r.text().then(text=>{
      try { return JSON.parse(text); }
      catch(e){ const err = new Error('RESPUESTA_NO_JSON'); err.raw = text; throw err; }
    }))
    .then(res=>{
      if(res.success){
        STATE.items = res.data.checklist.map(normalizeItem);
        STATE.bitacora = res.data.bitacora;
        STATE.categorias = mergeCategorias(res.data.categorias);
        STATE.derivaciones = res.data.derivaciones;
        STATE.motivos = res.data.motivos;
        STATE.ubicaciones = res.data.ubicaciones || [];
        localStorage.setItem('mant_cache', JSON.stringify(res.data));
        STATE.online = true;
        document.getElementById('offlineBanner').classList.add('hidden');
        checkNewRecords(STATE.items);
        flushQueue();
      } else {
        showToast('Error del servidor: ' + (res.error||''));
        loadFromCache();
      }
      STATE.syncing = false; updateSyncIcon(); renderAll();
    })
    .catch((err)=>{
      STATE.online = false; STATE.syncing = false; updateSyncIcon();
      loadFromCache();
      const banner = document.getElementById('offlineBanner');
      if(err && err.message === 'RESPUESTA_NO_JSON'){
        banner.innerHTML = '⚠ La API respondió algo que no es válido (probablemente un bloqueador de contenido o un problema de permisos en Apps Script — revisa que la implementación esté como "Cualquier usuario"). <span style="text-decoration:underline;cursor:pointer" onclick="manualSync()">Reintentar</span>';
      } else {
        banner.innerHTML = 'Sin conexión — mostrando datos guardados. Tus cambios se enviarán al recuperar señal. <span style="text-decoration:underline;cursor:pointer" onclick="manualSync()">Reintentar</span>';
      }
      banner.classList.remove('hidden');
      renderAll();
    });
}
function loadFromCache(){
  const c = localStorage.getItem('mant_cache');
  if(c){
    const d = JSON.parse(c);
    STATE.items = d.checklist.map(normalizeItem);
    STATE.bitacora = d.bitacora; STATE.categorias = mergeCategorias(d.categorias);
    STATE.derivaciones = d.derivaciones; STATE.motivos = d.motivos;
    STATE.ubicaciones = d.ubicaciones || [];
  }
}
function normalizeItem(it){ it.Piso = typeof it.Piso === 'string' ? parseInt(it.Piso,10) : it.Piso; return it; }
function manualSync(){ loadData(); showToast('Sincronizando...'); }

function queueAdd(op){
  const q = JSON.parse(localStorage.getItem('mant_queue') || '[]');
  q.push(op); localStorage.setItem('mant_queue', JSON.stringify(q));
}
function flushQueue(){
  let q = JSON.parse(localStorage.getItem('mant_queue') || '[]');
  if(q.length === 0 || !navigator.onLine) return;
  const next = q.shift();
  localStorage.setItem('mant_queue', JSON.stringify(q));
  apiPost(next).then(()=>{ flushQueue(); }).catch(()=>{
    q.unshift(next); localStorage.setItem('mant_queue', JSON.stringify(q));
  });
}
function apiPost(payload){
  return fetch(CFG.apiUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) })
    .then(r=>r.json());
}

/* ================= HEADER / TABS / RESUMEN ================= */
function renderTabs(){
  const isAdmin = CURRENT_USER && CURRENT_USER.rol === 'Admin';
  const homeOn = (STATE.view==='home' || STATE.view==='alerta');
  const homeTab = `<div class="tab ${homeOn?'active':''}" onclick="selectHome()">🏠 Inicio</div>`;
  const fugasTab = `<div class="tab ${STATE.view==='fugas'?'active':''}" onclick="selectFugas()">💧 Filtraciones</div>`;
  const deptosTab = `<div class="tab ${STATE.view==='deptos'?'active':''}" onclick="selectDeptos()">🔧 Deptos y Comunes</div>`;
  if(!isAdmin){
    document.getElementById('tabsRow').innerHTML = homeTab + fugasTab + deptosTab;
    return;
  }
  const torreTabs = TORRES.map(t=>
    `<div class="tab ${STATE.view==='checklist' && t===STATE.currentTorre?'active':''}" onclick="selectTorre('${t}')">${t.replace('Torre ','T. ')}</div>`
  ).join('');
  const dashTab = `<div class="tab ${STATE.view==='dashboard'?'active':''}" onclick="selectDashboard()">📊 Panel</div>`;
  const planTab = `<div class="tab ${STATE.view==='plan'?'active':''}" onclick="selectPlan()">📅 Plan</div>`;
  document.getElementById('tabsRow').innerHTML = homeTab + torreTabs + dashTab + planTab + fugasTab + deptosTab;
}
function selectHome(){ STATE.view='home'; if(STATE.home) STATE.home.alerta=null; renderTabs(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function selectAlerta(key){ ensureHomeState(); STATE.home.alerta=key; STATE.view='alerta'; renderTabs(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function selectTorre(t){ STATE.view='checklist'; STATE.currentTorre=t; renderTabs(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function selectDashboard(){ STATE.view='dashboard'; renderTabs(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function selectSimple(){ STATE.view='simple'; renderTabs(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function selectFugas(){ STATE.view='fugas'; renderTabs(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function selectDeptos(){ STATE.view='deptos'; renderTabs(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }

function renderSummary(){
  const isAdmin = CURRENT_USER && CURRENT_USER.rol === 'Admin';
  const items = isAdmin ? STATE.items : [...fugaItems(), ...deptoItems()];
  const activos = items.filter(i=>ACTIVE_STATES.includes(i.Estado)).length;
  const count = est => items.filter(i=>i.Estado===est).length;
  document.getElementById('summaryRow').innerHTML = `
    <div class="pill" style="border-color:#D6534A;color:#D6534A">Activos <b>${activos}</b></div>
    <div class="pill" style="border-color:#2FA86B;color:#2FA86B">OK <b>${count('OK')}</b></div>
    <div class="pill" style="border-color:#3B82C4;color:#3B82C4">Resueltos <b>${count('Resuelto')}</b></div>
    <div class="pill" style="border-color:#8A7A68;color:#8A7A68">Descartados <b>${count('Descartado')}</b></div>
    <div class="pill">Sin revisar <b>${count('Sin revisar')}</b></div>
  `;
}
/* ================= FLOOR DOCK ================= */
/* ================= RENDER PRINCIPAL ================= */
function renderAll(){
  renderSummary();
  const onHome = (STATE.view === 'home' || STATE.view === 'alerta');
  document.getElementById('summaryRow').style.display = onHome ? 'none' : 'flex';
  if(STATE.view === 'home'){
    renderHome();
  } else if(STATE.view === 'alerta'){
    renderAlerta();
  } else if(STATE.view === 'plan'){
    renderPlan();
  } else if(STATE.view === 'dashboard'){
    renderDashboard();
  } else if(STATE.view === 'fugas'){
    renderFugas();
  } else if(STATE.view === 'deptos'){
    renderDeptos();
  } else if(STATE.view === 'simple'){
    renderSimple();
  } else {
    renderTorre();
  }
}

function renderItemRow(i){
  const est = i.Estado || 'Sin revisar';
  const color = ESTADO_COLORS[est] || '#5B6675';
  const staleBadge = isStale(i) ? ` <span class="stale-badge">⏰ Sin movimiento ${diasEntre(i.Fecha_Ultima_Actualizacion||i.Fecha_Deteccion)}d</span>` : '';
  const urgentPrefix = esUrgente(i) ? '🚨 ' : '';
  const seguimientoTag = esSeguimiento(i) ? ' <span class="stale-badge" style="color:#3B82C4">📌 Seguimiento</span>' : '';
  return `<div class="item-row" onclick="openItemModal('${i.Folio}')" style="${esUrgente(i)?'background:#D6534A14':''}">
      <div class="dot" style="background:${color}"></div>
      <div class="item-main">
        <div class="item-cat">${urgentPrefix}${i.Categoria} <span class="folio-tag">${i.Folio}</span>${prioChip(i)}</div>
        <div class="item-detalle">${i.Detalle ? i.Detalle : est}</div>
        ${staleBadge}${seguimientoTag}
      </div>
      <div class="chev">›</div>
    </div>`;
}

/* ================= PANEL / DASHBOARD ================= */
const ALL_ESTADOS = Object.keys(ESTADO_COLORS);

function ensureDashState(){
  if(!STATE.dash){
    STATE.dash = { torres:[...TORRES_ALL], estados:[...ALL_ESTADOS], categoria:'', area:'', grupo:'', piso:'', soloSeguimiento:false };
  }
}
function dashFilteredItems(){
  const d = STATE.dash;
  return STATE.items.filter(i=>
    d.torres.includes(i.Torre) &&
    d.estados.includes(i.Estado || 'Sin revisar') &&
    (!d.categoria || i.Categoria === d.categoria) &&
    (!d.area || i.Area_Derivacion === d.area) &&
    (!d.grupo || String(i.Grupo||'').toLowerCase().includes(d.grupo.toLowerCase())) &&
    (!d.piso || String(i.Piso) === String(d.piso)) &&
    (!d.soloSeguimiento || esSeguimiento(i))
  );
}
function countBy(items, keyFn){
  const map = {};
  items.forEach(i=>{ const k = keyFn(i) || 'Sin asignar'; map[k] = (map[k]||0)+1; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function barRow(label, count, max, color){
  const pct = max>0 ? Math.round(count/max*100) : 0;
  return `<div class="bar-row">

function buildPdfDashboard(){

    const promDias = diasArr.length ? (diasArr.reduce((s,x)=>s+x,0)/diasArr.length).toFixed(1) : '—';

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const marginX = 40; let y = 50;
    const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();
    function ensure(h){ if(y+h > pageH-60){ doc.addPage(); y=50; } }

    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text('Panel de Mantención — Resumen', marginX, y); y+=20;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
    doc.text(COMUNIDAD, marginX, y); y+=14;
    doc.text('Generado: ' + new Date().toLocaleString('es-CL'), marginX, y); y+=14;
    const filtrosTxt = 'Torres: ' + (d.torres.length===TORRES_ALL.length?'Todas':d.torres.join(', ')) +
      ' · Estados: ' + (d.estados.length===ALL_ESTADOS.length?'Todos':d.estados.join(', ')) +
      (d.categoria?(' · Falla: '+d.categoria):'') + (d.area?(' · Área: '+d.area):'') + (d.grupo?(' · Grupo: '+d.grupo):'') +
      (d.piso?(' · Piso: '+d.piso):'') + (d.soloSeguimiento?' · Solo con seguimiento pendiente':'');
    doc.splitTextToSize(filtrosTxt, pageW-marginX*2).forEach(l=>{ doc.text(l, marginX, y); y+=12; });
    doc.setDrawColor(200); y+=6; doc.line(marginX, y, pageW-marginX, y); y+=20;
    doc.setTextColor(0);

    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Total: ' + items.length + '   ·   Activos: ' + items.filter(i=>ACTIVE_STATES.includes(i.Estado)).length +
      '   ·   Resueltos: ' + resueltos.length + '   ·   Prom. días resolución: ' + promDias, marginX, y);
    y += 26;

    function table(titulo, rows){
      ensure(24);
      doc.setFont('helvetica','bold'); doc.setFontSize(12);
      doc.text(titulo, marginX, y); y+=16;
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      rows.forEach(([k,v])=>{
        ensure(13);
        doc.text(String(k), marginX+8, y);
        doc.text(String(v), marginX+320, y);
        y+=13;
      });
      y+=12;
    }
    table('Por estado', byEstado);
    table('Por torre', byTorre.map(([k,v])=>[k,v]));
    table('Por tipo de falla', byCategoria);
    table('Por área de derivación', byArea.length ? byArea : [['Sin fallas derivadas en este filtro','']]);

    doc.save('Panel_Mantencion_' + new Date().toISOString().slice(0,10) + '.pdf');
    showToast('PDF generado ✓');
  });
}

/* ================= NIVELES: GRAVEDAD / IMPORTANCIA / URGENCIA → PRIORIDAD ================= */
const NIV_OPTS = {
  gravedad:    ['Leve','Moderada','Grave'],
  importancia: ['Baja','Media','Alta'],
  urgencia:    ['Programable','Pronto','Inmediata']
};
const NIV_LABEL = { gravedad:'Gravedad', importancia:'Importancia', urgencia:'Urgencia' };
const NIV_HELP = {
  gravedad:'Qué tan grave es el daño o el riesgo',
  importancia:'A cuántos residentes afecta / qué tan sensible es la zona',
  urgencia:'Qué tan rápido hay que actuar'
};
const PRIORIDADES = {
  critica:{ label:'Crítica', ico:'🔴', color:'#D6534A', ord:0 },
  alta:   { label:'Alta',    ico:'🟠', color:'#E8803D', ord:1 },
  media:  { label:'Media',   ico:'🟡', color:'#D9B72E', ord:2 },
  baja:   { label:'Baja',    ico:'🟢', color:'#2FA86B', ord:3 }
};
const PRIO_VENTANA = { critica:'Hoy', alta:'Esta semana', media:'Próximas 2 semanas', baja:'Programable' };

function nivIdx(campo, valor){ const i = NIV_OPTS[campo].indexOf(valor); return i === -1 ? null : i; }

// Sugerencia según tipo de falla y lugar. Devuelve {gravedad, importancia, urgencia}
function sugerirNiveles(cat, origen, torre){
  const c = String(cat||'').toLowerCase();
  const o = String(origen||'').toLowerCase();
  let g = 1, imp = 1, u = 0; // índices 0..2
  if(/filtr|fuga|gotera/.test(c))            { g = 2; imp = 2; u = 1; }
  else if(/el[eé]ctric|cortocirc|tablero/.test(c)) { g = 2; imp = 2; u = 1; }
  else if(/ascens/.test(c))                  { g = 2; imp = 2; u = 1; }
  else if(/emerg|cartel/.test(c))            { g = 1; imp = 2; u = 1; }
  else if(/c[aá]mar|seguridad|citof|port[oó]n/.test(c)) { g = 1; imp = 2; u = 1; }
  else if(/techo|cielo/.test(c))             { g = 1; imp = 1; u = 1; }
  else if(/monitor/.test(c))                 { g = 1; imp = 2; u = 1; }
  else if(/juego/.test(c))                   { g = 1; imp = 1; u = 1; }
  else if(/basurero/.test(c))                { g = 1; imp = 1; u = 1; }
  else if(/jard|pasto|quincho/.test(c))      { g = 0; imp = 0; u = 0; }
  else if(/bodega/.test(c))                  { g = 0; imp = 0; u = 0; }
  else if(/luz|luces|ilumin/.test(c))        { g = 0; imp = 1; u = 0; }
  else if(/puert|manilla|cerradura|ventan|vidrio/.test(c)) { g = 1; imp = 1; u = 0; }
  else if(/pintur|sucied|limpi|aseo|piso|suelo|baldos/.test(c)) { g = 0; imp = 0; u = 0; }
  else { g = 1; imp = 1; u = 0; }
  const zonaCritica = /pasillo|escalera|shaft/.test(o);
  const zonaComun = zonaCritica || /ascensor|acceso|piscina|gimnasio|sal[oó]n|quincho|conserj|lavander|ba[ñn]o/.test(o) || torre === 'Común';
  if(zonaComun) imp = Math.min(2, imp + 1);
  if(zonaCritica && /luz|luces|ilumin|emerg|cartel/.test(c)){ g = Math.max(g, 1); u = Math.max(u, 1); }
  return { gravedad: NIV_OPTS.gravedad[g], importancia: NIV_OPTS.importancia[imp], urgencia: NIV_OPTS.urgencia[u] };
}

// Niveles efectivos de un ítem: lo guardado, o la sugerencia. Urgente ≡ Inmediata.
function nivelesDe(item){
  const sug = sugerirNiveles(item.Categoria, item.Origen, item.Torre);
  const guardadoUrg = NIV_OPTS.urgencia.includes(item.Urgencia) ? item.Urgencia : '';
  return {
    gravedad:    NIV_OPTS.gravedad.includes(item.Gravedad) ? item.Gravedad : sug.gravedad,
    importancia: NIV_OPTS.importancia.includes(item.Importancia) ? item.Importancia : sug.importancia,
    urgencia:    esUrgente(item) ? 'Inmediata' : (guardadoUrg && guardadoUrg !== 'Inmediata' ? guardadoUrg : sug.urgencia),
    sugerido: {
      gravedad: !NIV_OPTS.gravedad.includes(item.Gravedad),
      importancia: !NIV_OPTS.importancia.includes(item.Importancia),
      urgencia: !esUrgente(item) && !(guardadoUrg && guardadoUrg !== 'Inmediata')
    }
  };
}
function calcPrioridad(n){
  const g = nivIdx('gravedad', n.gravedad) + 1;
  const i = nivIdx('importancia', n.importancia) + 1;
  const u = nivIdx('urgencia', n.urgencia) + 1;
  const score = g + i + 2*u;
  if(u === 3 && (g + i) >= 4) return 'critica';
  if(u === 3) return 'alta';
  if(score >= 11) return 'critica';
  if(score >= 9) return 'alta';
  if(score >= 6) return 'media';
  return 'baja';
}
// Prioridad de un ítem; null si ya está cerrado (OK/Resuelto/Descartado) o sin revisar sin urgencia
function prioridadDe(item){
  const est = item.Estado || 'Sin revisar';
  if(['OK','Resuelto','Descartado'].includes(est)) return null;
  if(est === 'Sin revisar' && !esUrgente(item)) return null;
  return calcPrioridad(nivelesDe(item));
}
function prioOrd(item){ const p = prioridadDe(item); return p ? PRIORIDADES[p].ord : 9; }
function cmpPrioridad(a, b){
  return (prioOrd(a) - prioOrd(b)) || (esUrgente(b) - esUrgente(a)) || recencyStr(b).localeCompare(recencyStr(a));
}
function prioChip(item){
  const p = prioridadDe(item);
  if(!p) return '';
  const P = PRIORIDADES[p];
  return ` <span class="prio-chip" style="--pc:${P.color}">${P.ico} ${P.label}</span>`;
}

function segHtml(campo, valor, onclickFn, sugerido){
  return `<div class="seg">${NIV_OPTS[campo].map(v=>
    `<button class="${v===valor?'on':''} ${(campo==='urgencia'&&v==='Inmediata'&&v===valor)?'danger':''}" onclick="${onclickFn(campo, v)}">${v}</button>`
  ).join('')}</div>${sugerido ? '<div class="seg-sug">sugerido automáticamente — toca para confirmar o cambiar</div>' : ''}`;
}

function setNivel(folio, campo, valor){
  const item = STATE.items.find(x=>x.Folio===folio);
  if(!item) return;
  const n = nivelesDe(item);
  n[campo] = valor;
  item.Gravedad = n.gravedad; item.Importancia = n.importancia;
  item.Urgencia = n.urgencia;
  item.Urgente = n.urgencia === 'Inmediata' ? 'Sí' : '';
  item.Fecha_Ultima_Actualizacion = new Date().toISOString().slice(0,16).replace('T',' ');
  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));
  const payload = { action:'updateFields', folio, gravedad:n.gravedad, importancia:n.importancia, urgencia:n.urgencia, soloNiveles:true, ...userTag() };
  if(navigator.onLine){ apiPost(payload).then(res=>{ if(!res.success) showToast('No se pudo guardar en el servidor'); }).catch(()=>queueAdd(payload)); }
  else { queueAdd(payload); showToast('Sin conexión: guardado localmente'); }
  openItemModal(folio);
  renderAll();
}
function nivelesBlockHtml(item){
  const n = nivelesDe(item);
  const p = prioridadDe(item) || calcPrioridad(n);
  const P = PRIORIDADES[p];
  const cerrado = ['OK','Resuelto','Descartado'].includes(item.Estado||'');
  return `
    <div class="section-label">Prioridad ${cerrado ? '<span style="text-transform:none;letter-spacing:0">(referencial: ya está cerrada)</span>' : ''}</div>
    <div class="prio-box" style="--pc:${P.color}">
      <div class="prio-big">${P.ico} ${P.label}</div>
      <div class="prio-sub">${PRIO_VENTANA[p]} · calculada con los tres niveles</div>
    </div>
    ${['gravedad','importancia','urgencia'].map(c=>`
      <div class="niv-row"><div class="niv-k">${NIV_LABEL[c]} <span>${NIV_HELP[c]}</span></div>${segHtml(c, n[c], (cc,v)=>`setNivel('${item.Folio}','${cc}','${v}')`, false)}</div>`).join('')}
    ${(n.sugerido.gravedad||n.sugerido.importancia||n.sugerido.urgencia) ? '<div class="seg-sug">Niveles sugeridos automáticamente según tipo de falla y lugar. Toca uno para confirmarlo o cambiarlo.</div>' : ''}
  `;
}

/* ================= PLAN DE TRABAJO (vivo y automático) ================= */
const PLAZOS_DEF = { critica:1, alta:7, media:14, baja:30 }; // días desde la detección
function getPlazos(){
  try{ const o = JSON.parse(localStorage.getItem('mant_plazos')||'null'); if(o) return { ...PLAZOS_DEF, ...o }; }catch(e){}
  return { ...PLAZOS_DEF };
}
function ensurePlanState(){ if(!STATE.plan){ STATE.plan = { torre:'', group:'torre' }; } }
function fechaObjetivo(i, prio){
  const base = parseFH(i.Fecha_Deteccion) || new Date();
  return new Date(base.getTime() + getPlazos()[prio]*86400000);
}
function fmtDM(d){ return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); }
function planLast(){ try{ return JSON.parse(localStorage.getItem('mant_plan_last')||'null'); }catch(e){ return null; } }
function planEntries(){
  ensurePlanState();
  const last = planLast();
  const lastSet = last ? new Set(last.folios) : null;
  const now = new Date();
  return STATE.items
    .filter(i=>prioridadDe(i)!==null && (!STATE.plan.torre || i.Torre===STATE.plan.torre))
    .map(i=>{
      const prio = prioridadDe(i);
      const obj = fechaObjetivo(i, prio);
      const atraso = now > obj ? Math.max(1, Math.floor((now-obj)/86400000)) : 0;
      return { i, prio, obj, atraso, nueva: !!(lastSet && !lastSet.has(i.Folio)) };
    });
}
function planSort(a, b){
  const to = t => { const k = TORRES_ALL.indexOf(t); return k===-1 ? 99 : k; };
  return (to(a.i.Torre)-to(b.i.Torre)) || ((b.i.Piso||0)-(a.i.Piso||0)) || (esUrgente(b.i)-esUrgente(a.i)) || a.i.Folio.localeCompare(b.i.Folio);
}
function planGroupKey(e){
  return STATE.plan.group === 'area' ? (e.i.Area_Derivacion || 'Sin área asignada') : (e.i.Torre || 'Común');
}
function planLugar(i){
  const pisoTxt = (i.Piso===0 || i.Piso===undefined || i.Piso==='' || isNaN(i.Piso)) ? '' : (i.Piso<=-1 ? 'Subt. '+i.Piso : 'P'+i.Piso);
  return [i.Torre, pisoTxt, i.Origen].filter(Boolean).join(' · ');
}
// tipo de falla × torre
function planCantidades(entries){
  const map = {};
  entries.forEach(e=>{
    const c = e.i.Categoria || 'OTROS';
    if(!map[c]) map[c] = { total:0, porTorre:{} };
    map[c].total++;
    const t = e.i.Torre || 'Común';
    map[c].porTorre[t] = (map[c].porTorre[t]||0) + 1;
  });
  return Object.entries(map).sort((a,b)=>b[1].total-a[1].total);
}
function planClosedSinceLast(){
  const last = planLast(); if(!last) return 0;
  const cerrados = new Set(STATE.items.filter(i=>['Resuelto','OK','Descartado'].includes(i.Estado)).map(i=>i.Folio));
  return last.folios.filter(f=>cerrados.has(f) || !STATE.items.some(i=>i.Folio===f)).length;
}
function selectPlan(){ STATE.view='plan'; renderTabs(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function setPlanField(k, v){ ensurePlanState(); STATE.plan[k] = v; renderPlan(); }

function planRowHtml(e){
  const i = e.i; const est = i.Estado || 'Sin revisar';
  const color = ESTADO_COLORS[est] || '#5B6675';
  const venc = e.atraso
    ? `<span class="stale-badge" style="color:#D6534A;font-weight:700">⚠ atrasada ${e.atraso}d</span>`
    : `<span class="stale-badge" style="color:var(--text-dim)">vence ${fmtDM(e.obj)}</span>`;
  return `<div class="item-row" onclick="openItemModal('${i.Folio}')">
    <div class="dot" style="background:${color}"></div>
    <div class="item-main">

  const last = planLast();
  const lastTxt = last ? new Date(last.fecha).toLocaleDateString('es-CL') : '';
  const cerradas = planClosedSinceLast();

  const cant = planCantidades(entries);

      if(STATE.plan.group==='torre'){ const f = t=>{ const x = TORRES_ALL.indexOf(t); return x===-1?99:x; }; return f(a)-f(b); }

      ${keys.map(key=>`<div class="plan-grp">${key} <span>(${groups[key].length})</span></div>

    </div>`;
  });
  if(!ventanas) ventanas = '<div class="empty-note">No hay fallas activas con prioridad. ✅</div>';

  main.innerHTML = `
    <div class="home-greet">📅 Plan de trabajo</div>
    <div class="home-sub">Se actualiza solo con cada falla nueva o cerrada · ${new Date().toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'})}</div>
    <div class="dash-tiles" style="grid-template-columns:repeat(4,1fr)">

      <div class="tile"><div class="tile-num" style="color:#E8A33D">${atrasadas}</div><div class="tile-label">Atrasadas</div></div>
      <div class="tile"><div class="tile-num" style="color:#3B82C4">${nuevas}</div><div class="tile-label">Nuevas</div></div>

/* ---- PDF del plan ---- */
function generarPdfPlan(){
  const entries = planEntries();

function buildPdfPlan(entries){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const marginX = 36;
  const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();
  const hexRgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];

  pdfHeaderBand(doc, 'Plan de Trabajo de Mantención', marginX, pageW);
  const pl = getPlazos();
  const lines = [
    (STATE.plan.torre ? 'Torre: '+STATE.plan.torre : 'Todas las torres y áreas') + ' · Agrupado por ' + (STATE.plan.group==='area' ? 'área responsable' : 'torre y piso'),
    'Plazos desde detección: Crítica ' + pl.critica + 'd · Alta ' + pl.alta + 'd · Media ' + pl.media + 'd · Baja ' + pl.baja + 'd'
  ];
  let y = pdfMeta(doc, marginX, 78, pageW, lines);
  const atrasadas = entries.filter(e=>e.atraso).length;
  y = pdfKpiRow(doc, marginX, y+4, pageW, [
    { label:'Fallas en plan', value: entries.length },
    { label:'Críticas (hoy)', value: entries.filter(e=>e.prio==='critica').length, color:hexRgb(PRIORIDADES.critica.color) },
    { label:'Altas (semana)', value: entries.filter(e=>e.prio==='alta').length, color:hexRgb(PRIORIDADES.alta.color) },
    { label:'Atrasadas', value: atrasadas, color:[214,83,74] },
    { label:'Nuevas', value: entries.filter(e=>e.nueva).length, color:[59,130,196] }
  ]);

  // Resumen de cantidades
  const cant = planCantidades(entries);
  const torresCols = TORRES_ALL.filter(t=>entries.some(e=>(e.i.Torre||'Común')===t));
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...PDF_NAVY);
  doc.text('Qué hay que atender', marginX, y); doc.setTextColor(0); y += 6;
  doc.autoTable({
    startY: y, margin:{ left:marginX, right:marginX, bottom:40 },
    head: [['Tipo de falla','Total', ...torresCols.map(t=>t.replace('Torre ','T. '))]],
    body: cant.map(([c,v])=>[c, v.total, ...torresCols.map(t=>v.porTorre[t]||'')]),
    theme:'grid', styles:{ font:'helvetica', fontSize:8, cellPadding:4, halign:'center' },
    headStyles:{ fillColor:PDF_NAVY, textColor:255, fontStyle:'bold' },
    columnStyles:{ 0:{halign:'left', cellWidth:150}, 1:{fontStyle:'bold'} }
  });
  y = doc.lastAutoTable.finalY + 18;

  // Plan por ventanas
  const body = [];
  Object.keys(PRIORIDADES).forEach(k=>{
    const P = PRIORIDADES[k];
    const grp = entries.filter(e=>e.prio===k);
    if(!grp.length) return;
    body.push([{ content: PRIO_VENTANA[k].toUpperCase() + '  ·  Prioridad ' + P.label + '  ·  ' + grp.length + ' falla' + (grp.length===1?'':'s') + '  ·  plazo ' + pl[k] + ' día' + (pl[k]===1?'':'s'),
      colSpan:8, styles:{ fillColor:hexRgb(P.color), textColor:255, fontStyle:'bold', fontSize:9 } }]);
    const groups = {};
    grp.forEach(e=>{ const key = planGroupKey(e); (groups[key] = groups[key]||[]).push(e); });
    const keys = Object.keys(groups).sort((a,b)=>{
      if(STATE.plan.group==='torre'){ const f=t=>{ const x=TORRES_ALL.indexOf(t); return x===-1?99:x; }; return f(a)-f(b); }
      return a.localeCompare(b);
    });
    keys.forEach(key=>{
      body.push([{ content: key + '  (' + groups[key].length + ')', colSpan:8, styles:{ fillColor:[232,236,240], textColor:PDF_NAVY, fontStyle:'bold', fontSize:8.5 } }]);
      groups[key].sort(planSort).forEach(e=>{
        const i = e.i;
        body.push([
          (esUrgente(i)?'URG ':'') + i.Folio + (e.nueva?' *':''),
          planLugar(i), i.Categoria, i.Detalle || '—', i.Area_Derivacion || '—', i.Estado || 'Sin revisar',
          fmtDM(e.obj) + (e.atraso ? ' (atr. '+e.atraso+'d)' : ''), ''
        ]);
      });
    });
  });
  doc.autoTable({
    startY: y, margin:{ left:marginX, right:marginX, bottom:40 },
    head: [['Folio','Lugar','Tipo','Detalle','Área','Estado','Vence','Hecho']],
    body, theme:'plain',
    styles:{ font:'helvetica', fontSize:7.5, cellPadding:4, overflow:'linebreak', valign:'middle', lineColor:PDF_LINE, lineWidth:0.3 },
    headStyles:{ fillColor:PDF_NAVY, textColor:255, fontStyle:'bold', fontSize:8 },
    columnStyles:{ 0:{cellWidth:54}, 1:{cellWidth:88}, 2:{cellWidth:68}, 3:{cellWidth:'auto'}, 4:{cellWidth:52}, 5:{cellWidth:48}, 6:{cellWidth:52}, 7:{cellWidth:36, halign:'center'} },
    didParseCell:(data)=>{
      if(data.section==='body' && data.column.index===5 && typeof data.cell.raw==='string'){
        data.cell.styles.textColor = ESTADO_RGB[data.cell.raw] || [0,0,0]; data.cell.styles.fontStyle='bold';
      }
      if(data.section==='body' && data.column.index===6 && typeof data.cell.raw==='string' && data.cell.raw.indexOf('atr.')>-1){
        data.cell.styles.textColor = [214,83,74]; data.cell.styles.fontStyle='bold';
      }
    },
    didDrawCell:(data)=>{
      if(data.section==='body' && data.column.index===7 && data.row.raw && data.row.raw.length===8 && typeof data.row.raw[0]==='string'){
        const s = 9, cx = data.cell.x + data.cell.width/2 - s/2, cy = data.cell.y + data.cell.height/2 - s/2;
        doc.setDrawColor(120); doc.rect(cx, cy, s, s);
      }
    }
  });
  y = doc.lastAutoTable.finalY + 22;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...PDF_GRAY);
  doc.text('* = falla nueva desde el último plan guardado.   URG = urgencia inmediata.', marginX, y); doc.setTextColor(0); y += 24;
  if(y > pageH - 90){ doc.addPage(); y = 60; }
  doc.setDrawColor(...PDF_LINE); doc.line(marginX, y, pageW-marginX, y); y += 24;
  doc.setFontSize(9.5);
  doc.text('Entregado por (Administración): _____________________________     Fecha: __________', marginX, y); y += 30;
  doc.text('Recibido por (Mantención): _____________________________     Fecha: __________', marginX, y);

  pdfFooterPages(doc, marginX, pageW, pageH);
  doc.save('Plan_de_Trabajo_' + new Date().toISOString().slice(0,10) + '.pdf');
  planMarcarVistoSilencioso(entries);
  showToast('PDF generado ✓ · plan guardado como referencia');
}
function planMarcarVistoSilencioso(entries){
  // Guarda como referencia TODO el plan vigente (sin filtro de torre), para comparar la próxima vez
  const prevTorre = STATE.plan.torre; STATE.plan.torre = '';
  const all = planEntries().map(e=>e.i.Folio);
  STATE.plan.torre = prevTorre;
  localStorage.setItem('mant_plan_last', JSON.stringify({ fecha:new Date().toISOString(), folios: all }));
}

function generarExcelPlan(){
  const entries = planEntries();
  if(!entries.length){ showToast('No hay fallas en el plan para exportar'); return; }
  showToast('Generando Excel...');
  loadXlsxLib(()=>buildExcelPlan(entries));

function buildExcelPlan(entries){
  const ordenPrio = Object.keys(PRIORIDADES);
  const sorted = entries.slice().sort((a,b)=> (ordenPrio.indexOf(a.prio)-ordenPrio.indexOf(b.prio)) || planSort(a,b));
  const rows = sorted.map(e=>{
    const i = e.i, n = nivelesDe(i);
    return {
      'Ventana': PRIO_VENTANA[e.prio], 'Prioridad': PRIORIDADES[e.prio].label, 'Folio': i.Folio,
      'Torre': i.Torre, 'Piso': i.Piso, 'Lugar': i.Origen||'', 'Tipo de falla': i.Categoria, 'Detalle': i.Detalle||'',
      'Gravedad': n.gravedad, 'Importancia': n.importancia, 'Urgencia': n.urgencia,
      'Área responsable': i.Area_Derivacion||'', 'Estado': i.Estado||'Sin revisar',
      'Fecha detección': i.Fecha_Deteccion||'', 'Fecha objetivo': e.obj.toISOString().slice(0,10),
      'Días de atraso': e.atraso || 0, 'Nueva desde último plan': e.nueva ? 'Sí' : '',
      'Seguimiento': esSeguimiento(i) ? 'Sí' : ''
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:10},{wch:10},{wch:9},{wch:6},{wch:18},{wch:16},{wch:40},{wch:10},{wch:11},{wch:11},{wch:18},{wch:12},{wch:16},{wch:12},{wch:8},{wch:10},{wch:10}];
  const torresCols = TORRES_ALL;
  const resumen = planCantidades(entries).map(([c,v])=>{
    const r = { 'Tipo de falla': c, 'Total': v.total };
    torresCols.forEach(t=>{ r[t] = v.porTorre[t] || 0; });
    return r;
  });
  const ws2 = XLSX.utils.json_to_sheet(resumen);
  ws2['!cols'] = [{wch:20},{wch:8},...torresCols.map(()=>({wch:9}))];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Plan');
  XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');
  XLSX.writeFile(wb, 'Plan_de_Trabajo_' + new Date().toISOString().slice(0,10) + '.xlsx');
  planMarcarVistoSilencioso(entries);
  showToast('Excel generado ✓ · plan guardado como referencia');
}

/* ================= TORRES: MAPA DE PISOS ================= */
function ensureTorreUi(){ if(!STATE.torreUi){ STATE.torreUi = { filtro:'todos', verTodas:false }; } }
function setTorreFiltro(f){ ensureTorreUi(); STATE.torreUi.filtro = f; renderTorre(); }
function toggleVerTodasTorre(){ ensureTorreUi(); STATE.torreUi.verTodas = !STATE.torreUi.verTodas; renderTorre(); }

const CERRADOS = ['OK','Resuelto','Descartado'];
function floorStats(torre, piso){
  const items = STATE.items.filter(i=>i.Torre===torre && i.Piso===piso);
  const fallas = items.filter(i=>prioridadDe(i)!==null);
  const sinRev = items.filter(i=>(i.Estado||'Sin revisar')==='Sin revisar' && !esUrgente(i)).length;
  const cerrados = items.filter(i=>CERRADOS.includes(i.Estado)).length;
  let peor = null;
  fallas.forEach(i=>{ const p = prioridadDe(i); if(peor===null || PRIORIDADES[p].ord < PRIORIDADES[peor].ord) peor = p; });
  let estado = 'vacio';
  if(items.length){
    if(fallas.length) estado = 'fallas';
    else if(sinRev === 0) estado = 'ok';
    else if(cerrados > 0) estado = 'parcial';
    else estado = 'sin';
  }
  return { items, fallas: fallas.length, peor, sinRev, cerrados, estado, total: items.length };
}
function torreStats(torre){
  const items = STATE.items.filter(i=>i.Torre===torre);
  const revisados = items.filter(i=>(i.Estado||'Sin revisar')!=='Sin revisar' || esUrgente(i)).length;
  const porPrio = {};
  Object.keys(PRIORIDADES).forEach(k=>{ porPrio[k] = items.filter(i=>prioridadDe(i)===k).length; });
  return { total: items.length, revisados, pct: items.length ? Math.round(revisados*100/items.length) : 0, porPrio, activas: items.filter(i=>prioridadDe(i)!==null).length };
}

function renderTorre(){
  ensureTorreUi();
  const t = STATE.currentTorre;
  const ui = STATE.torreUi;
  const st = torreStats(t);
  const main = document.getElementById('mainList');

  const prioStrip = Object.keys(PRIORIDADES).map(k=>
    `<div class="prio-tile" style="--pc:${PRIORIDADES[k].color}"><div class="n">${st.porPrio[k]}</div><div class="l">${PRIORIDADES[k].ico} ${PRIORIDADES[k].label}</div></div>`).join('');

  const filtros = [['todos','Todos'],['fallas','Con fallas'],['sin','Sin revisar']]
    .map(([k,l])=>`<button class="${ui.filtro===k?'on':''}" onclick="setTorreFiltro('${k}')">${l}</button>`).join('');

  const tile = p=>{
    const s = floorStats(t, p);
    const match = ui.filtro==='todos' || (ui.filtro==='fallas' && s.estado==='fallas') || (ui.filtro==='sin' && (s.estado==='sin' || s.estado==='parcial'));
    const pc = s.peor ? PRIORIDADES[s.peor].color : '';
    return `<div class="fl-tile st-${s.estado} ${match?'':'dim'}" ${pc?`style="--pc:${pc}"`:''} onclick="openFloorSheet('${t}',${p})">
      <div class="fl-num">${p}</div>
      ${s.estado==='fallas' ? `<div class="fl-badge">${s.fallas}</div>` : (s.estado==='ok' ? '<div class="fl-check">✓</div>' : '')}
    </div>`;
  };
  const sobre = floorsList().filter(p=>p>=1);
  const subt = floorsList().filter(p=>p<=-1);
  // filas de 6 pisos, de arriba hacia abajo
  let rows = '';
  for(let k=0;k<sobre.length;k+=6){ rows += `<div class="fl-row">${sobre.slice(k,k+6).map(tile).join('')}</div>`; }

  // Fallas activas de la torre
  const activas = STATE.items.filter(i=>i.Torre===t && prioridadDe(i)!==null).sort(cmpPrioridad);
  const shown = ui.verTodas ? activas : activas.slice(0,6);

  main.innerHTML = `
    <div class="tw-hero">
      <div class="tw-top">
        <div><div class="tw-name">🏢 ${t}</div><div class="tw-sub">${st.activas} falla${st.activas===1?'':'s'} activa${st.activas===1?'':'s'} · ${st.total} ítems</div>
          ${(()=>{ const sm = semaforoUnidad(t), S = SEMAFORO[sm.nivel]; return `<div class="tw-light" style="--sc:${S.color}">${S.ico} Semáforo ${S.label} · ${sm.motivo}</div>`; })()}</div>
        <div class="tw-pct"><b>${st.pct}%</b><span>revisado</span></div>
      </div>
      <div class="tw-bar"><i style="width:${st.pct}%"></i></div>
    </div>
    <div class="prio-strip" style="margin:10px 0 4px">${prioStrip}</div>

    <div class="section-label">Mapa de pisos <span style="text-transform:none;letter-spacing:0">· toca un piso para revisarlo</span></div>
    <div class="seg" style="margin-bottom:10px">${filtros}</div>
    <div class="fl-map">${rows}
      <div class="fl-sub-title">Subterráneos</div>
      <div class="fl-row">${subt.map(tile).join('')}</div>
    </div>
    <div class="fl-legend"><span><i class="lg st-fallas"></i> con fallas (el color indica la prioridad)</span><span><i class="lg st-ok"></i> todo OK</span><span><i class="lg st-parcial"></i> en revisión</span><span><i class="lg st-sin"></i> sin revisar</span></div>

    <div class="section-label">Fallas activas en ${t}</div>
    ${activas.length ? `<div class="floor-card">${shown.map(renderAlertaRow).join('')}</div>
      ${activas.length>6 ? `<button class="btn btn-ghost btn-sm" style="width:100%" onclick="toggleVerTodasTorre()">${ui.verTodas ? 'Ver menos ▴' : `Ver las ${activas.length} fallas ▾`}</button>` : ''}`
      : `<div class="empty-note">✅ Sin fallas activas en esta torre.<br>Si ves algo, toca un piso y elige <b>⚠ Falla</b>.</div>`}
  `;
}

/* ---- Hoja de un piso ---- */
function floorItemHtml(i){
  const est = i.Estado || 'Sin revisar';
  const color = ESTADO_COLORS[est] || '#5B6675';
  const sinRev = est === 'Sin revisar' && !esUrgente(i);
  const acts = sinRev ? `<div class="fl-acts">

/* ================= SEMÁFORO DE GESTIÓN (por torre y áreas comunes) ================= */
const SEMAFORO = {
  rojo:     { ico:'🔴', label:'Rojo',     color:'#D6534A' },
  naranja:  { ico:'🟠', label:'Naranja',  color:'#E8803D' },
  amarillo: { ico:'🟡', label:'Amarillo', color:'#D9B72E' },
  verde:    { ico:'🟢', label:'Verde',    color:'#2FA86B' }
};
const SEMAFORO_UNIDADES = ['Torre A','Torre B','Torre C','Torre D','Común'];
function semaforoDe(items){
  const now = new Date();
  const act = items.filter(i=>prioridadDe(i)!==null);
  let crit = 0, alta = 0, atras = 0;
  act.forEach(i=>{
    const p = prioridadDe(i);
    if(p==='critica') crit++;
    if(p==='alta') alta++;
    if(now > fechaObjetivo(i, p)) atras++;
  });
  const hace30 = new Date(now.getTime() - 30*86400000);
  const resueltas30 = items.filter(i=>i.Estado==='Resuelto' && i.Fecha_Resolucion && parseFH(i.Fecha_Resolucion) >= hace30).length;
  let nivel = 'verde';
  if(crit > 0 || (atras >= 3 && act.length && atras/act.length >= 0.3)) nivel = 'rojo';
  else if(alta > 0 || atras > 0) nivel = 'naranja';
  else if(act.length > 0) nivel = 'amarillo';
  const partes = [];
  if(crit) partes.push(crit + ' crítica' + (crit===1?'':'s'));
  if(alta) partes.push(alta + ' alta' + (alta===1?'':'s'));
  if(atras) partes.push(atras + ' atrasada' + (atras===1?'':'s'));
  let motivo = partes.join(' · ');
  if(!motivo) motivo = act.length ? 'En gestión, a tiempo' : 'Al día, sin fallas activas';
  return { nivel, activas: act.length, crit, alta, atras, resueltas30, motivo };
}
function semaforoUnidad(u){ return semaforoDe(STATE.items.filter(i=>i.Torre===u)); }
function irAUnidad(u){
  if(u === 'Común'){ ensureDeptosState(); STATE.deptos.torre = 'Común'; selectDeptos(); }
  else { selectTorre(u); }
}
function semaforoGridHtml(){
  const cards = SEMAFORO_UNIDADES.map((u,idx)=>{
    const s = semaforoUnidad(u); const S = SEMAFORO[s.nivel];
    return `<div class="sem-card ${idx===4?'wide':''}" style="--sc:${S.color}" onclick="irAUnidad('${u}')">
      <div class="sem-dot">${S.ico}</div>
      <div class="sem-main">
        <div class="sem-name">${u==='Común' ? 'Áreas comunes' : u}</div>
        <div class="sem-state">${S.label} · ${s.activas} activa${s.activas===1?'':'s'}</div>
        <div class="sem-why">${s.motivo}</div>
      </div>
      <div class="sem-meta"><b>${s.resueltas30}</b><span>resueltas<br>30 días</span></div>
    </div>`;
  }).join('');
  return `<div class="sem-grid">${cards}</div>
    <details class="sem-help"><summary>¿Cómo se calcula el semáforo?</summary>
      <div>🔴 <b>Rojo:</b> hay fallas críticas, o muchas atrasadas (3 o más y al menos el 30%).<br>
      🟠 <b>Naranja:</b> hay fallas de prioridad alta o alguna atrasada.<br>
      🟡 <b>Amarillo:</b> hay fallas activas pero en gestión y a tiempo.<br>
      🟢 <b>Verde:</b> sin fallas activas.<br>
      “Atrasada” = pasó el plazo de su prioridad (ver ⚙ Plazos en el Plan de trabajo).</div></details>`;
}
function semaforoSectionHtml(){
  return `<div class="section-label">🚦 Semáforo de gestión <span style="text-transform:none;letter-spacing:0">· toca para entrar</span></div>${semaforoGridHtml()}`;
}
