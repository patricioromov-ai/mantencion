      <button class="btn ${seguimiento?'btn-danger':'btn-ghost'} btn-sm" onclick="toggleSeguimiento('${item.Folio}')">${seguimiento ? '✓ Seguimiento hecho' : '📌 Seguimiento'}</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost btn-sm" onclick="showEditFieldsForm('${item.Folio}')">Editar datos</button>
      <button class="btn btn-ghost btn-sm" onclick="showBitacora('${item.Folio}')">Ver historial completo</button>
    </div>
    <button class="btn btn-danger btn-sm" style="width:100%;margin-top:8px" onclick="deleteItemUI('${item.Folio}')">Eliminar ítem</button>
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="closeModal()">Cerrar</button>
  `;
}

function toggleUrgente(folio){
  const item = STATE.items.find(x=>x.Folio===folio);
  if(!item) return;
  const nuevo = !esUrgente(item);
  item.Urgente = nuevo ? 'Sí' : '';
  item.Fecha_Ultima_Actualizacion = new Date().toISOString().slice(0,16).replace('T',' ');
  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));

  const payload = { action:'updateFields', folio, urgente: nuevo, soloUrgente:true, ...userTag() };
  if(navigator.onLine){
    apiPost(payload).then(res=>{ showToast(res.success ? (nuevo?'Marcado como urgente':'Urgencia quitada') : 'No se pudo guardar en el servidor'); });
  } else {
    queueAdd(payload); showToast('Sin conexión: guardado localmente');
  }
  openItemModal(folio);
  renderAll();
}

function toggleSeguimiento(folio){
  const item = STATE.items.find(x=>x.Folio===folio);
  if(!item) return;
  const nuevo = !esSeguimiento(item);
  item.Seguimiento = nuevo ? 'Sí' : '';
  item.Fecha_Ultima_Actualizacion = new Date().toISOString().slice(0,16).replace('T',' ');

  const payload = { action:'updateFields', folio, seguimiento: nuevo, soloSeguimiento:true, ...userTag() };
  if(navigator.onLine){
    apiPost(payload).then(res=>{ showToast(res.success ? (nuevo?'Marcado para seguimiento':'Seguimiento quitado') : 'No se pudo guardar en el servidor'); });

    queueAdd(payload); showToast('Sin conexión: guardado localmente');
  }
  openItemModal(folio);
  renderAll();
}

/* ================= FORMULARIO DE TRANSICIÓN ================= */
function showTransitionForm(folio, label, to, code, needsArea, needsDetalle, requiereMotivo){
  const item = STATE.items.find(x=>x.Folio===folio);
  const motivos = STATE.motivos.filter(m=>m.Transicion===code);
  pendingPhoto = { base64:null, mime:null };

  const areaOptions = needsArea ? STATE.derivaciones.map(d=>`<option value="${esc(d)}">${d}</option>`).join('') : '';

  showModal(`
    <h2>${label}</h2>
    <div class="sub">${item.Folio} · ${item.Categoria}</div>
    ${needsDetalle ? `<div class="field"><label>Detalle de la falla</label><textarea id="tDetalle">${item.Detalle||''}</textarea></div>` : ''}
    ${needsArea ? `<div class="field"><label>Área de derivación</label><select id="tArea"><option value="">Selecciona...</option>${areaOptions}</select>
      <div class="hint" onclick="promptNewArea()" style="color:var(--accent);cursor:pointer;margin-top:6px;">+ Agregar nueva área</div></div>` : ''}
    <div class="field">
      <label>Motivo${requiereMotivo ? ' (obligatorio)' : ''}</label>
      <div class="chip-row" id="motivoChips">
        ${motivos.map(m=>`<div class="chip" onclick="selectMotivoChip(this,'${esc(m.Motivo)}')">${m.Motivo}</div>`).join('')}
        <div class="chip" onclick="selectMotivoChip(this,'__otro__')">Otro...</div>
      </div>
      <input type="text" id="tMotivoCustom" placeholder="Escribe el motivo" class="hidden">
    </div>
    <div class="field"><label>Nota (opcional)</label><textarea id="tNota"></textarea></div>
    ${requiereMotivo ? `<div class="field" style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="tSeguimiento" style="width:auto;">
      <label style="margin:0;text-transform:none;font-size:.82rem;color:var(--text-dim);" for="tSeguimiento">📌 Requiere seguimiento (ej. verificar que el residente resuelva por su cuenta)</label>
    </div>` : ''}
    <div class="field">
      <label>Foto (opcional)</label>
      <input type="file" accept="image/*" capture="environment" onchange="handlePhotoSelect(event)">
      <img id="photoPreview" class="photo-preview hidden">
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="openItemModal('${folio}')">Cancelar</button>
      <button class="btn btn-primary" style="margin-top:0" onclick="confirmTransition('${folio}','${to}','${code}',${needsArea?1:0},${needsDetalle?1:0},${requiereMotivo?1:0})">Confirmar</button>
    </div>
  `);
}

let selectedMotivo = '';
function selectMotivoChip(el, val){
  document.querySelectorAll('#motivoChips .chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  const customInput = document.getElementById('tMotivoCustom');
  if(val === '__otro__'){ customInput.classList.remove('hidden'); customInput.focus(); selectedMotivo = '__otro__'; }
  else { customInput.classList.add('hidden'); selectedMotivo = val; }
}
function promptNewArea(){
  const val = prompt('Nombre de la nueva área de derivación:');
  if(!val) return;
  STATE.derivaciones.push(val);
  const payload = { action:'addConfig', tipo:'derivacion', valor: val, ...userTag() };
  if(navigator.onLine){ apiPost(payload); } else { queueAdd(payload); }
  const sel = document.getElementById('tArea');
  const opt = document.createElement('option'); opt.value = val; opt.textContent = val;
  sel.appendChild(opt); sel.value = val;
}

function handlePhotoSelect(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 1280;
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      pendingPhoto.base64 = dataUrl.split(',')[1];
      pendingPhoto.mime = 'image/jpeg';
      const prev = document.getElementById('photoPreview');
      if(prev){ prev.src = dataUrl; prev.classList.remove('hidden'); }
      if(typeof wizPhotoDone==='function') wizPhotoDone();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function confirmTransition(folio, to, code, needsArea, needsDetalle, requiereMotivo){
  const item = STATE.items.find(x=>x.Folio===folio);
  let motivo = selectedMotivo === '__otro__' ? (document.getElementById('tMotivoCustom').value.trim()) : selectedMotivo;
  const nota = document.getElementById('tNota').value.trim();
  const detalle = needsDetalle ? document.getElementById('tDetalle').value.trim() : undefined;
  const area = needsArea ? document.getElementById('tArea').value : undefined;

  if(needsDetalle && !detalle){ showToast('Escribe el detalle de la falla'); return; }
  if(needsArea && !area){ showToast('Selecciona un área de derivación'); return; }
  if(requiereMotivo && !motivo){ showToast('Debes indicar un motivo para cerrar este reporte'); return; }
  const seguimientoEl = document.getElementById('tSeguimiento');
  const seguimiento = seguimientoEl ? seguimientoEl.checked : false;

  const ts = new Date().toISOString().slice(0,16).replace('T',' ');
  item.Estado = to;
  if(detalle) item.Detalle = detalle;
  if(area !== undefined) item.Area_Derivacion = area;
  if(seguimiento) item.Seguimiento = 'Sí';
  item.Fecha_Ultima_Actualizacion = ts;
  item.Actualizado_Por = CURRENT_USER.nombre || item.Actualizado_Por;
  if(to === 'Resuelto') item.Fecha_Resolucion = ts;
  if(to === 'Pendiente' || to === 'Nuevo') item.Fecha_Resolucion = '';
  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));

  // Feedback inmediato: reabre el detalle del ítem ya en su nuevo estado,
  // para poder seguir encadenando la siguiente acción sin volver a la lista.
  renderAll();
  openItemModal(folio);

  const payload = { action:'transition', folio, estado_nuevo:to, motivo, nota, ...userTag() };
  if(area !== undefined) payload.area_derivacion = area;
  if(detalle) payload.detalle = detalle;
  if(seguimiento) payload.seguimiento = true;
  if(pendingPhoto.base64){ payload.foto_base64 = pendingPhoto.base64; payload.foto_mime = pendingPhoto.mime; }

  if(navigator.onLine){
    apiPost(payload).then(res=>{
      if(res.success){ showToast('Actualizado ✓'); loadData(); }
      else { showToast('No se pudo guardar en el servidor'); queueAdd(payload); }
    }).catch(()=>{ queueAdd(payload); showToast('Guardado localmente, se enviará al recuperar señal'); });
  } else {
    queueAdd(payload); showToast('Sin conexión: guardado localmente');
  }
}

function saveEditFields(folio){

  const categoria = document.getElementById('eCat').value;

  const origen = document.getElementById('eOrigen').value;

/* ================= ELIMINAR ================= */
function deleteItemUI(folio){
  if(!confirm('¿Eliminar este ítem y su historial? No se puede deshacer.')) return;
  STATE.items = STATE.items.filter(x=>x.Folio!==folio);
  STATE.bitacora = STATE.bitacora.filter(x=>x.Folio!==folio);
  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));
  const payload = { action:'delete', folio, ...userTag() };
  if(navigator.onLine){ apiPost(payload).then(res=>showToast(res.success?'Eliminado':'Error al eliminar')); }
  else { queueAdd(payload); showToast('Sin conexión: se eliminará al recuperar señal'); }
  closeModal(); renderAll();
}

/* ---- Estilo ejecutivo compartido entre los PDF ---- */
const PDF_NAVY = [26, 38, 56];      // encabezados de sección
const PDF_NAVY_TXT = [255,255,255];
const PDF_GRAY = [110, 120, 130];   // texto secundario
const PDF_LINE = [215, 220, 225];
function pdfHeaderBand(doc, title, marginX, pageW){
  doc.setFillColor(...PDF_NAVY);
  doc.rect(0, 0, pageW, 62, 'F');
  doc.setTextColor(...PDF_NAVY_TXT);
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text(title, marginX, 30);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text(COMUNIDAD, marginX, 46);
  doc.setTextColor(0);
}
function pdfMeta(doc, marginX, y, pageW, lines){
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...PDF_GRAY);
  const rightText = 'Generado: ' + new Date().toLocaleString('es-CL');
  doc.text(rightText, pageW-marginX, 78, {align:'right'});
  lines.forEach((l,idx)=>{ doc.text(l, marginX, 78+idx*13); });
  doc.setTextColor(0);
  return 78 + Math.max(lines.length,1)*13 + 6;
}
function pdfKpiRow(doc, marginX, y, pageW, kpis){
  const gap = 8;
  const boxW = (pageW - marginX*2 - gap*(kpis.length-1)) / kpis.length;
  kpis.forEach((k,idx)=>{
    const x = marginX + idx*(boxW+gap);
    doc.setDrawColor(...PDF_LINE); doc.setFillColor(247,248,249);
    doc.roundedRect(x, y, boxW, 40, 3, 3, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...(k.color||PDF_NAVY));
    doc.text(String(k.value), x+boxW/2, y+21, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_GRAY);
    doc.text(k.label, x+boxW/2, y+33, {align:'center'});
  });
  doc.setTextColor(0);
  return y + 40 + 16;
}
function pdfFooterPages(doc, marginX, pageW, pageH){
  const n = doc.internal.getNumberOfPages();
  for(let p=1;p<=n;p++){
    doc.setPage(p);
    doc.setDrawColor(...PDF_LINE); doc.line(marginX, pageH-30, pageW-marginX, pageH-30);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...PDF_GRAY);
    doc.text(COMUNIDAD, marginX, pageH-18);
    doc.text('Página ' + p + ' de ' + n, pageW-marginX, pageH-18, {align:'right'});
    doc.setTextColor(0);
  }
}

function buildPdfActivas(estadosSel, torre, area, grupo, piso, categoria, soloSeguimiento){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const marginX = 40;
  const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();

  let items = STATE.items.filter(i=>estadosSel.includes(i.Estado));
  if(torre) items = items.filter(i=>i.Torre===torre);
  if(piso) items = items.filter(i=>String(i.Piso)===String(piso));
  if(categoria) items = items.filter(i=>i.Categoria===categoria);
  if(area) items = items.filter(i=>i.Area_Derivacion===area);
  if(grupo) items = items.filter(i=>String(i.Grupo||'').toLowerCase().includes(grupo));
  if(soloSeguimiento) items = items.filter(i=>esSeguimiento(i));

  pdfHeaderBand(doc, 'Informe de Fallas Activas', marginX, pageW);
  const filtroLines = [];
  if(torre) filtroLines.push('Torre: ' + torre);
  if(piso) filtroLines.push('Piso: ' + piso);
  if(categoria) filtroLines.push('Tipo de falla: ' + categoria);
  if(area) filtroLines.push('Área: ' + area);
  if(grupo) filtroLines.push('Grupo: ' + grupo);
  if(soloSeguimiento) filtroLines.push('Solo con seguimiento pendiente');
  if(filtroLines.length===0) filtroLines.push('Sin filtros adicionales — todas las torres y áreas');
  let y = pdfMeta(doc, marginX, 78, pageW, filtroLines);

  const torresAfectadas = new Set(items.map(i=>i.Torre)).size;
  const urgentes = items.filter(i=>esUrgente(i)).length;
  const conSeguimiento = items.filter(i=>esSeguimiento(i)).length;
  y = pdfKpiRow(doc, marginX, y+4, pageW, [
    { label:'Total ítems', value: items.length },
    { label:'Urgentes', value: urgentes, color:[214,83,74] },
    { label:'Con seguimiento', value: conSeguimiento, color:[59,130,196] },
    { label:'Torres/áreas afectadas', value: torresAfectadas }
  ]);

  if(items.length===0){
    doc.setFontSize(11); doc.text('No hay ítems que coincidan con los filtros seleccionados.', marginX, y+10);
  } else {
    const groupKey = it => it.Area_Derivacion || 'Sin área asignada';
    const torreOrder = t => { const idx = TORRES_ALL.indexOf(t); return idx===-1?99:idx; };
    const sorted = items.slice().sort((a,b)=>
      groupKey(a).localeCompare(groupKey(b)) ||
      (torreOrder(a.Torre)-torreOrder(b.Torre)) ||
      ((b.Piso||0)-(a.Piso||0))
    );
    const rows = sorted.map(i=>{
      const dias = diasEntre(i.Fecha_Deteccion);
      const pisoLabel = i.Piso<=-1 ? ('Subt. '+i.Piso) : (i.Piso===0 ? '—' : String(i.Piso));
      return [
        (esUrgente(i)?'🚨 ':'') + i.Folio, groupKey(i), i.Torre, pisoLabel, i.Categoria,
        i.Detalle||'—', i.Estado, dias!==null?(dias+'d'):'—'
      ];
    });

    doc.autoTable({
      startY: y,
      margin: { left: marginX, right: marginX, bottom: 40 },
      head: [['Folio','Área','Torre','Piso','Tipo de falla','Detalle','Estado','Días']],
      body: rows,
      theme: 'striped',
      styles: { font:'helvetica', fontSize: 8, cellPadding: 5, overflow:'linebreak', valign:'middle' },
      headStyles: { fillColor: PDF_NAVY, textColor: 255, fontStyle:'bold', fontSize: 8.5 },
      alternateRowStyles: { fillColor: [246,247,248] },
      columnStyles: {
        0:{cellWidth:58}, 1:{cellWidth:66}, 2:{cellWidth:48}, 3:{cellWidth:34,halign:'center'},
        4:{cellWidth:70}, 5:{cellWidth:'auto'}, 6:{cellWidth:56}, 7:{cellWidth:30,halign:'center'}
      },
      didParseCell: function(data){
        if(data.section==='body' && data.column.index===6){
          const rgb = ESTADO_RGB[data.cell.raw] || [0,0,0];
          data.cell.styles.textColor = rgb;
          data.cell.styles.fontStyle = 'bold';
        }
      }
    });
    y = doc.lastAutoTable.finalY + 26;
  }

  if(y > pageH - 90){ doc.addPage(); y = 60; }
  doc.setDrawColor(...PDF_LINE); doc.line(marginX, y, pageW-marginX, y); y+=24;
  doc.setFontSize(9.5); doc.setFont('helvetica','normal');
  doc.text('Entregado por (Administración): _____________________________     Fecha: __________', marginX, y); y+=30;
  doc.text('Recibido por (Mantención): _____________________________     Fecha: __________', marginX, y);

  pdfFooterPages(doc, marginX, pageW, pageH);
  doc.save('Fallas_Activas_' + new Date().toISOString().slice(0,10) + '.pdf');
  showToast('PDF generado ✓');
}

function buildPdfGestion(desde, hasta, torre, piso, categoria, soloSeguimiento){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const marginX = 40; let y = 50;
  const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();
  function ensure(h){ if(y+h > pageH-60){ doc.addPage(); y=50; } }

  const desdeD = new Date(desde+'T00:00:00'), hastaD = new Date(hasta+'T23:59:59');
  let items = STATE.items.filter(i=>{
    if(i.Estado !== 'Resuelto' || !i.Fecha_Resolucion) return false;
    const fr = parseFH(i.Fecha_Resolucion);
    return fr >= desdeD && fr <= hastaD;
  });
  if(torre) items = items.filter(i=>i.Torre===torre);
  if(piso) items = items.filter(i=>String(i.Piso)===String(piso));
  if(categoria) items = items.filter(i=>i.Categoria===categoria);
  if(soloSeguimiento) items = items.filter(i=>esSeguimiento(i));

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Reporte de Gestión de Mantención', marginX, y); y+=20;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
  doc.text(COMUNIDAD, marginX, y); y+=14;
  doc.text('Período: ' + desde + ' a ' + hasta, marginX, y); y+=14;
  if(torre) { doc.text('Torre: ' + torre, marginX, y); y+=14; }
  if(piso) { doc.text('Piso: ' + piso, marginX, y); y+=14; }
  if(categoria) { doc.text('Tipo de falla: ' + categoria, marginX, y); y+=14; }
  if(soloSeguimiento) { doc.text('Solo con seguimiento pendiente', marginX, y); y+=14; }
  doc.text('Generado: ' + new Date().toLocaleString('es-CL'), marginX, y); y+=10;
  doc.setDrawColor(200); y+=8; doc.line(marginX, y, pageW-marginX, y); y+=20;
  doc.setTextColor(0);

  if(items.length===0){
    doc.setFontSize(11); doc.text('No hay fallas resueltas que coincidan con el período y los filtros seleccionados.', marginX, y);
    doc.save('Reporte_Gestion_'+desde+'_a_'+hasta+'.pdf'); showToast('PDF generado ✓'); return;
  }

  const groupKey = it => it.Area_Derivacion || 'Sin área asignada';
  const areas = [...new Set(items.map(groupKey))];
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('Resumen por área', marginX, y); y+=18;

  let totalDias = 0, totalCount = 0;
  const resumenRows = areas.map(a=>{
    const aItems = items.filter(i=>groupKey(i)===a);
    const dias = aItems.map(i=>diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion)).filter(d=>d!==null);
    const prom = dias.length ? (dias.reduce((s,x)=>s+x,0)/dias.length) : 0;
    totalDias += dias.reduce((s,x)=>s+x,0); totalCount += dias.length;
    return { area:a, count:aItems.length, prom: prom.toFixed(1) };
  }).sort((a,b)=>b.count-a.count);

  doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
  doc.text('Área', marginX, y); doc.text('Resueltos', marginX+260, y); doc.text('Prom. días', marginX+350, y); y+=6;
  doc.setDrawColor(220); doc.line(marginX, y, pageW-marginX, y); y+=12;
  doc.setFont('helvetica','normal');
  resumenRows.forEach(r=>{
    ensure(14);
    doc.text(r.area, marginX, y); doc.text(String(r.count), marginX+260, y); doc.text(r.prom+'d', marginX+350, y); y+=14;
  });
  y+=6; ensure(16);
  doc.setFont('helvetica','bold');
  doc.text('Promedio general: ' + (totalCount? (totalDias/totalCount).toFixed(1):'0') + ' días · Total resueltos: ' + items.length, marginX, y);
  y+=24;

  ensure(20); doc.setFontSize(12); doc.text('Detalle', marginX, y); y+=16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  items.sort((a,b)=>(a.Fecha_Resolucion||'').localeCompare(b.Fecha_Resolucion||'')).forEach(i=>{
    const dias = diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion);
    const text = '[' + i.Folio + '] ' + i.Torre + ' P' + i.Piso + ' · ' + i.Categoria + ' · ' + groupKey(i) + ' · ' + dias + 'd (' + i.Fecha_Deteccion + ' → ' + i.Fecha_Resolucion + ')';
    const lines = doc.splitTextToSize(text, pageW-marginX*2);
    ensure(lines.length*11+3);
    lines.forEach((l,idx)=>{ doc.text(idx===0?'• '+l:'   '+l, marginX, y); y+=11; });
  });

  doc.save('Reporte_Gestion_'+desde+'_a_'+hasta+'.pdf');
  showToast('PDF generado ✓');
}
</script>
</body>
</html>
