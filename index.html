<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist Mantención · Jardines de Vicuña Mackenna</title>
<style>
  :root{
    --bg:#10161D; --panel:#1B2430; --panel-alt:#232F3E; --line:#2C3947;
    --text:#E8EDF2; --text-dim:#8B98A8; --accent:#E8A33D; --accent-dim:#8a6423;
    --radius:10px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent; padding-bottom:calc(70px + var(--safe-b));
  }
  .mono{font-family:ui-monospace,"SF Mono","Roboto Mono","Courier New",monospace;}
  button{font-family:inherit;}
  .hidden{display:none !important;}
  img{max-width:100%;}

  .fullscreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card-setup{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; max-width:420px; width:100%;}
  .card-setup h1{font-size:1.15rem; margin:0 0 4px;}
  .card-setup p{color:var(--text-dim); font-size:.88rem; line-height:1.5;}
  .field{margin-top:14px;}
  .field label{display:block; font-size:.78rem; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--panel-alt); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:11px 12px; font-size:.95rem; outline:none;
  }
  .field textarea{font-family:inherit; min-height:84px; resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .hint{font-size:.72rem; color:var(--text-dim); margin-top:4px;}
  .btn{border:none; border-radius:9px; padding:12px 16px; font-size:.92rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .btn-primary{background:var(--accent); color:#1a1206; width:100%; margin-top:14px;}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--line);}
  .btn-danger{background:#D6534A; color:#fff;}
  .btn-sm{padding:9px 12px; font-size:.82rem; border-radius:7px;}
  .btn-row{display:flex; gap:8px; margin-top:12px;}
  .btn-row .btn{flex:1; margin-top:0;}
  .err-msg{color:#D6534A; font-size:.82rem; margin-top:10px;}

  header.app-header{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,#141B24,#10161D); border-bottom:1px solid var(--line); padding:12px 14px 0;}
  .h-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .h-title{font-size:.98rem; font-weight:700;}
  .h-sub{font-size:.72rem; color:var(--text-dim); margin-top:1px;}
  .h-actions{display:flex; gap:6px;}
  .icon-btn{background:var(--panel-alt); border:1px solid var(--line); color:var(--text); width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:1rem; cursor:pointer;}

  .summary-row{display:flex; gap:6px; margin:10px 0 8px; overflow-x:auto;}
  .pill{flex:0 0 auto; font-size:.72rem; padding:5px 10px; border-radius:99px; border:1px solid var(--line); color:var(--text-dim); white-space:nowrap;}
  .pill b{color:var(--text);}

  .tabs{display:flex; gap:6px; margin-top:6px; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; min-width:64px; text-align:center; padding:9px 10px; border-radius:8px 8px 0 0; font-size:.85rem; font-weight:700; color:var(--text-dim); border:1px solid var(--line); border-bottom:none; background:var(--panel); cursor:pointer; white-space:nowrap;}
  .tab.active{color:var(--bg); background:var(--accent); border-color:var(--accent);}

  .toolbar{display:flex; gap:8px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); align-items:center;}
  .toolbar input[type=text]{flex:1; background:var(--panel-alt); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 10px; font-size:.88rem; outline:none;}
  .toggle-pend{display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--text-dim); white-space:nowrap;}
  .switch{position:relative; width:38px; height:22px; background:var(--panel-alt); border:1px solid var(--line); border-radius:99px; cursor:pointer;}
  .switch.on{background:var(--accent-dim); border-color:var(--accent);}
  .switch .knob{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--text-dim); transition:left .15s;}
  .switch.on .knob{left:18px; background:var(--accent);}

  .floor-dock{display:flex; gap:5px; overflow-x:auto; padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--line); scrollbar-width:none;}
  .floor-dock::-webkit-scrollbar{display:none;}
  .floor-chip{flex:0 0 auto; width:34px; height:34px; border-radius:6px; background:#0D1218; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; color:var(--text-dim); cursor:pointer; position:relative; overflow:hidden;}
  .floor-chip .led{position:absolute; bottom:2px; left:4px; right:4px; height:3px; border-radius:2px; background:#5B6675;}

  main{padding:12px 14px 24px;}
  .floor-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; scroll-margin-top:150px;}
  .floor-head{display:flex; align-items:center; justify-content:space-between; padding:11px 13px; background:var(--panel-alt); border-bottom:1px solid var(--line);}
  .floor-num{font-family:ui-monospace,"SF Mono","Roboto Mono",monospace; font-weight:800; font-size:1.05rem;}
  .floor-tag{font-size:.68rem; color:var(--text-dim); margin-left:6px;}
  .floor-count{font-size:.72rem; color:var(--text-dim);}

  .item-row{display:flex; align-items:center; gap:10px; padding:10px 13px; border-bottom:1px solid var(--line); cursor:pointer;}
  .item-row:last-of-type{border-bottom:none;}
  .dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto;}
  .item-main{flex:1; min-width:0;}
  .item-cat{font-size:.86rem; font-weight:600; display:flex; align-items:center; gap:6px;}
  .folio-tag{font-size:.63rem; color:var(--text-dim); font-family:ui-monospace,monospace; font-weight:400;}
  .stale-badge{font-size:.68rem; color:#E8A33D; display:inline-block; margin-top:2px;}
  .item-detalle{font-size:.76rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .chev{color:var(--text-dim); font-size:.9rem;}

  .add-fault-btn{display:block; width:100%; text-align:center; padding:10px; font-size:.82rem; color:var(--accent); background:transparent; border:none; border-top:1px dashed var(--line); cursor:pointer;}

  .fab-wrap{position:fixed; right:14px; bottom:calc(16px + var(--safe-b)); display:flex; flex-direction:column; gap:10px; z-index:30;}
  .fab{width:52px; height:52px; border-radius:50%; background:var(--accent); color:#1a1206; border:none; box-shadow:0 6px 16px rgba(0,0,0,.4); font-size:1.25rem; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .fab.secondary{background:var(--panel-alt); color:var(--text); border:1px solid var(--line); width:44px; height:44px; font-size:1.05rem;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); top:calc(14px + env(safe-area-inset-top, 0px)); max-width:92vw; text-align:center; background:#0D1218; color:var(--text); padding:10px 16px; border-radius:99px; font-size:.82rem; border:1px solid var(--line); z-index:70; opacity:0; transition:opacity .2s;}
  .toast.show{opacity:1;}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px 16px 0 0; padding:18px 16px calc(18px + var(--safe-b)); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;}
  .modal h2{font-size:1rem; margin:0 0 4px;}
  .modal .sub{font-size:.76rem; color:var(--text-dim); margin-bottom:10px;}

  .badge{display:inline-block; font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:99px;}
  .kv{display:flex; justify-content:space-between; font-size:.8rem; padding:6px 0; border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text-dim);}

  .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
  .chip{padding:7px 11px; border-radius:99px; font-size:.78rem; border:1px solid var(--line); color:var(--text-dim); cursor:pointer;}
  .chip.selected{color:var(--accent); border-color:var(--accent); background:#3a2c111a;}

  .photo-row{display:flex; gap:8px; margin-top:8px;}
  .photo-thumb{width:70px; height:70px; border-radius:8px; object-fit:cover; border:1px solid var(--line); cursor:pointer;}
  .photo-preview{max-width:100%; border-radius:8px; margin-top:8px; display:block;}

  .bit-entry{padding:8px 0; border-bottom:1px solid var(--line); font-size:.78rem;}
  .bit-entry:last-child{border-bottom:none;}
  .bit-date{color:var(--text-dim); font-size:.68rem;}
  .bit-transition{font-weight:600; margin:2px 0;}

  .action-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .action-list .btn{width:100%; margin-top:0;}

  .banner{padding:9px 14px; font-size:.78rem; text-align:center;}
  .banner.warn{background:#3A1E1C; color:#D6534A;}
  .empty-note{color:var(--text-dim); font-size:.82rem; text-align:center; padding:30px 10px;}
  .section-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin:16px 0 8px;}

  .dash-tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:6px 0 4px;}
  .tile{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center;}
  .tile-num{font-size:1.4rem; font-weight:800; font-family:ui-monospace,"SF Mono",monospace;}
  .tile-label{font-size:.66rem; color:var(--text-dim); margin-top:2px; text-transform:uppercase; letter-spacing:.04em;}
  .bar-row{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:.78rem;}
  .bar-label{width:118px; flex:0 0 auto; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{flex:1; height:10px; background:var(--panel-alt); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px;}
  .bar-count{width:26px; flex:0 0 auto; text-align:right; color:var(--text-dim); font-family:ui-monospace,monospace;}
  .dash-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:10px;}

  /* ===== Pantalla de inicio ===== */
  .home-greet{font-size:1.15rem; font-weight:800; margin:2px 0 2px;}
  .home-sub{font-size:.78rem; color:var(--text-dim); margin-bottom:6px;}
  .alert-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .alert-card{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--ac,#5B6675); border-radius:12px; padding:13px 12px; cursor:pointer; min-height:92px; display:flex; flex-direction:column; justify-content:space-between;}
  .alert-card:active, .mod-card:active{transform:scale(.98);}
  .alert-card .a-num{font-size:1.9rem; font-weight:800; font-family:ui-monospace,"SF Mono",monospace; line-height:1; color:var(--ac,#E8EDF2);}
  .alert-card.zero .a-num{color:var(--text-dim);}
  .alert-card.zero{opacity:.75;}
  .alert-card .a-label{font-size:.78rem; font-weight:700; margin-top:6px;}
  .alert-card .a-hint{font-size:.66rem; color:var(--text-dim); margin-top:1px;}
  .mod-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .mod-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 12px; cursor:pointer; text-align:left; color:var(--text); display:flex; flex-direction:column; gap:4px; min-height:96px;}
  .mod-card .m-ico{font-size:1.6rem; line-height:1;}
  .mod-card .m-title{font-size:.92rem; font-weight:700; margin-top:4px;}
  .mod-card .m-meta{font-size:.7rem; color:var(--text-dim);}
  .mod-card .m-meta b{color:var(--accent);}
  .mod-card.wide{grid-column:span 2; flex-direction:row; align-items:center; gap:12px; min-height:0;}
  .mod-card.wide .m-ico{font-size:1.5rem;}
  .alert-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .alert-head .back{background:var(--panel-alt); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:8px 12px; font-size:.82rem; cursor:pointer;}
  .alert-head .a-title{font-size:1rem; font-weight:800;}
  .alert-head .a-count{font-size:.72rem; color:var(--text-dim);}

  /* ===== Asistente de reporte ===== */
  .wz-prog{display:flex; gap:6px; margin:4px 0 14px;}
  .wz-prog i{flex:1; height:4px; border-radius:2px; background:var(--line);}
  .wz-prog i.on{background:var(--accent);}
  .wz-q{font-size:1.05rem; font-weight:800; margin:2px 0 10px;}
  .wz-q2{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin:14px 0 6px;}
  .wz-hint{font-size:.76rem; color:var(--text-dim); margin:-4px 0 10px;}
  .wz-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .wz-grid.four{grid-template-columns:repeat(4,1fr);}
  .wz-btn{background:var(--panel-alt); border:1px solid var(--line); color:var(--text); border-radius:11px; padding:14px 8px; font-size:.88rem; font-weight:600; cursor:pointer; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:58px;}
  .wz-btn.sm{padding:11px 6px; font-size:.8rem; min-height:52px;}
  .wz-btn .ico{font-size:1.3rem; line-height:1;}
  .wz-btn.sel{border-color:var(--accent); background:#3a2c111a; color:var(--accent);}
  .wz-two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .wz-link{background:none; border:none; color:var(--accent); font-size:.82rem; margin-top:10px; padding:6px 0; cursor:pointer;}
  .wz-urg{display:flex; align-items:center; gap:10px; margin:12px 0 2px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--panel-alt); font-size:.9rem; font-weight:600; cursor:pointer;}
  .wz-urg input{width:20px; height:20px; accent-color:#D6534A;}
  .wz-summary{margin-top:14px; padding:10px 12px; border-radius:10px; background:var(--panel-alt); border:1px dashed var(--line); font-size:.8rem; line-height:1.6;}
  .wz-done{text-align:center; padding:8px 0 4px;}
  .wz-check{width:58px; height:58px; margin:0 auto; border-radius:50%; background:#2FA86B22; color:#2FA86B; display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:800;}
  .wz-folio{font-family:ui-monospace,"SF Mono",monospace; font-size:1.3rem; font-weight:800; color:var(--accent);}
</style>
</head>
<body>

<div id="loginScreen" class="fullscreen hidden">
  <div class="card-setup">
    <h1>🔒 Iniciar sesión</h1>
    <p>Ingresa tus datos y el código de acceso. Queda registrado quién entra, cuándo y desde dónde.</p>
    <div class="field"><label>Nombre</label><input type="text" id="loginNombre" name="mant_nombre_field" placeholder="Ej: Patricio" autocomplete="off" autocapitalize="words"></div>
    <div class="field"><label>Correo (recomendado)</label><input type="email" id="loginEmail" name="mant_email_field" placeholder="tucorreo@ejemplo.com" autocomplete="off"></div>
    <div class="field"><label>Código de acceso</label><input type="password" id="loginCodigo" name="mant_codigo_field" placeholder="Código" inputmode="text" autocomplete="new-password"></div>
    <div class="field" style="display:flex; align-items:center; gap:8px; margin-top:10px;">
      <input type="checkbox" id="loginRemember" style="width:auto;">
      <label style="margin:0; text-transform:none; font-size:.82rem; color:var(--text-dim);" for="loginRemember">Recordar mis datos en este dispositivo (solo si es tu celular personal)</label>
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="submitLogin()">Ingresar</button>
    <div class="err-msg hidden" id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="app-header">
    <div class="h-top">
      <div><div class="h-title">Checklist de Mantención</div><div class="h-sub">Jardines de Vicuña Mackenna</div></div>
      <div class="h-actions">
        <button class="icon-btn" id="btnGestion" onclick="openReportModal()" title="Reporte de gestión">📊</button>
        <button class="icon-btn" id="btnImprimir" onclick="openPdfActivasModal()" title="Imprimir fallas">🖨️</button>
        <button class="icon-btn" onclick="manualSync()" title="Sincronizar"><span id="syncIcon">⟳</span></button>
        <button class="icon-btn" onclick="confirmLogout()" title="Cerrar sesión">🚪</button>
      </div>
    </div>
    <div class="summary-row" id="summaryRow"></div>
    <div class="tabs" id="tabsRow"></div>
  </header>

  <div class="toolbar" id="toolbarBar">
    <input type="text" id="searchInput" placeholder="Buscar folio, falla o detalle..." oninput="renderList()">
    <div class="toggle-pend" onclick="togglePendOnly()">
      <div class="switch" id="pendSwitch"><div class="knob"></div></div>
      Solo activos
    </div>
  </div>

  <div class="floor-dock" id="floorDock"></div>
  <div id="offlineBanner" class="banner warn hidden">Sin conexión — mostrando datos guardados. Tus cambios se enviarán al recuperar señal. <span style="text-decoration:underline;cursor:pointer" onclick="manualSync()">Reintentar</span></div>
  <main id="mainList"></main>
</div>

<div id="toast" class="toast"></div>

<script>
/* ================= CONFIG / ESTADO ================= */
const CATS_FIJAS = ['LUCES','MANILLAS','PUERTAS','CARTEL S. EMERGENCIA'];
const TORRES = ['Torre A','Torre B','Torre C','Torre D'];
const TORRES_ALL = [...TORRES, 'Común'];
const CATEGORIA_FUGA = 'FILTRACIONES';
const CATEGORIA_FUGA_LEGACY = 'FUGAS/FILTRACIONES'; // compatibilidad con reportes ya creados antes del cambio de nombre
const ACTIVE_STATES = ['Nuevo','Pendiente','Derivado','En proceso'];
const COMUNIDAD = 'Jardines de Vicuña Mackenna';

const ESTADO_COLORS = {
  'Sin revisar':'#5B6675', 'Nuevo':'#2FB6A3', 'Pendiente':'#D6534A', 'Derivado':'#9B7FE0',
  'En proceso':'#E8A33D', 'Resuelto':'#3B82C4', 'OK':'#2FA86B', 'Descartado':'#8A7A68'
};

const TRANSICIONES = {
  'Sin revisar': [
    { label:'Marcar OK', to:'OK', code:'SINREVISAR_A_OK' },
    { label:'Reportar falla', to:'Nuevo', code:'REPORTAR', needsDetalle:true }
  ],
  'Nuevo': [
    { label:'Confirmar pendiente', to:'Pendiente', code:'NUEVO_A_PENDIENTE' },
    { label:'Descartar', to:'Descartado', code:'NUEVO_A_DESCARTADO', requiereMotivo:true }
  ],
  'Pendiente': [
    { label:'Derivar a un área', to:'Derivado', code:'PENDIENTE_A_DERIVADO', needsArea:true },
    { label:'Cerrar (sin falla)', to:'Descartado', code:'PENDIENTE_A_DESCARTADO', requiereMotivo:true }
  ],
  'Derivado': [
    { label:'Marcar en proceso', to:'En proceso', code:'DERIVADO_A_PROCESO' },
    { label:'Devolver a pendiente', to:'Pendiente', code:'DERIVADO_A_PENDIENTE' }
  ],
  'En proceso': [
    { label:'Marcar resuelto', to:'Resuelto', code:'PROCESO_A_RESUELTO', fotoRecomendada:true, requiereMotivo:true }
  ],
  'Resuelto': [ { label:'Reabrir', to:'Pendiente', code:'REABRIR' } ],
  'OK': [ { label:'Reabrir (reportar falla)', to:'Pendiente', code:'REABRIR' } ],
  'Descartado': [ { label:'Reabrir', to:'Pendiente', code:'REABRIR' } ]
};

const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyx_scztWVMGLkrFMka3D4-2Ya7JVkWyOZPLaOQY_1s8Q4PcuRBTgdkyJz4JpP5pMXl/exec';

let CFG = { apiUrl: DEFAULT_API_URL };
let CURRENT_USER = null; // { nombre, email, rol: 'Admin' | 'Volante' }
let STATE = {
  items:[], bitacora:[], categorias:[], derivaciones:[], motivos:[], ubicaciones:[],
  currentTorre:'Torre A', view:'checklist', pendOnly:false, search:'', online:true, syncing:false,
  dash:null, fugas:null, deptos:null, simple:null
};
let activeModalBg = null;
let pendingPhoto = { base64:null, mime:null };

function floorsList(){
  const arr=[]; for(let p=24;p>=1;p--) arr.push(p); for(let p=-1;p>=-3;p--) arr.push(p); return arr;
}
function catOrder(c){ const i = CATS_FIJAS.indexOf(c); return i===-1 ? 100 : i; }
function parseFH(str){ if(!str) return null; return new Date(String(str).replace(' ','T')); }
function diasEntre(a,b){ if(!a) return null; const d2=b?parseFH(b):new Date(); const d1=parseFH(a); if(!d1) return null; return Math.max(0, Math.round((d2-d1)/86400000)); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }
function userTag(){
  return {
    usuario: CURRENT_USER ? CURRENT_USER.nombre : '',
    email: CURRENT_USER ? CURRENT_USER.email : '',
    rol: CURRENT_USER ? CURRENT_USER.rol : '',
    autor: CURRENT_USER ? CURRENT_USER.nombre : '',
    userAgent: navigator.userAgent
  };
}

/* ================= ARRANQUE / LOGIN ================= */
window.addEventListener('load', init);
window.addEventListener('online', ()=>{ STATE.online=true; flushQueue(); });
window.addEventListener('offline', ()=>{ STATE.online=false; updateSyncIcon(); });

function init(){
  CFG = { apiUrl: DEFAULT_API_URL };
  localStorage.setItem('mant_cfg', JSON.stringify(CFG));

  const sessionUser = sessionStorage.getItem('mant_session_user');
  if(sessionUser){
    CURRENT_USER = JSON.parse(sessionUser);
    startApp();
    return;
  }

  const remembered = localStorage.getItem('mant_remember');
  if(remembered){
    const r = JSON.parse(remembered);
    doLogin(r.nombre, r.email, r.codigo, true, true);
    return;
  }

  showLoginScreen();
}

function showLoginScreen(prefill){
  document.getElementById('loginScreen').classList.remove('hidden');
  if(prefill){
    document.getElementById('loginNombre').value = prefill.nombre || '';
    document.getElementById('loginEmail').value = prefill.email || '';
  }
}

function getLocationString(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve('No disponible (sin soporte)'); return; }
    const timer = setTimeout(()=>resolve('No disponible (sin permiso o tiempo agotado)'), 6000);
    navigator.geolocation.getCurrentPosition(
      pos=>{ clearTimeout(timer); resolve(pos.coords.latitude.toFixed(5)+', '+pos.coords.longitude.toFixed(5)); },
      ()=>{ clearTimeout(timer); resolve('No disponible (permiso denegado)'); },
      { timeout:5000 }
    );
  });
}

function submitLogin(){
  const nombre = document.getElementById('loginNombre').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  const codigo = document.getElementById('loginCodigo').value.trim();
  const remember = document.getElementById('loginRemember').checked;
  if(!nombre){ showLoginError('Ingresa tu nombre'); return; }
  if(!codigo){ showLoginError('Ingresa el código de acceso'); return; }
  doLogin(nombre, email, codigo, remember, false);
}

function showLoginError(msg){
  const e = document.getElementById('loginErr');
  e.textContent = msg; e.classList.remove('hidden');
}

async function doLogin(nombre, email, codigo, remember, silent){
  const btn = document.getElementById('loginBtn');
  if(btn && !silent){ btn.textContent = 'Verificando...'; btn.disabled = true; }
  const ubicacion = await getLocationString();
  const payload = { action:'login', nombre, email, codigo, userAgent: navigator.userAgent, ubicacion };
  try {
    const res = await apiPost(payload);
    if(res.success){
      CURRENT_USER = { nombre, email, rol: res.rol };
      sessionStorage.setItem('mant_session_user', JSON.stringify(CURRENT_USER));
      if(remember){ localStorage.setItem('mant_remember', JSON.stringify({nombre, email, codigo})); }
      else { localStorage.removeItem('mant_remember'); }
      document.getElementById('loginScreen').classList.add('hidden');
      startApp();
    } else {
      showLoginScreen({nombre, email});
      showLoginError(res.error || 'Código de acceso incorrecto');
    }
  } catch(err){
    showLoginScreen({nombre, email});
    showLoginError('No se pudo verificar el acceso. Revisa tu conexión e intenta de nuevo.');
  } finally {
    if(btn){ btn.textContent = 'Ingresar'; btn.disabled = false; }
  }
}

function logout(){
  sessionStorage.removeItem('mant_session_user');
  localStorage.removeItem('mant_remember');
  location.reload();
}

function startApp(){
  document.getElementById('app').classList.remove('hidden');
  STATE.view = 'home';
  document.getElementById('btnGestion').style.display = (CURRENT_USER.rol === 'Admin') ? 'flex' : 'none';
  document.getElementById('btnImprimir').style.display = (CURRENT_USER.rol === 'Admin') ? 'flex' : 'none';
  renderTabs(); loadData(); setInterval(flushQueue, 25000);
  setInterval(loadData, 90000); // auto-refresh cada 90s para detectar registros nuevos
}

/* ================= CARGA / SYNC ================= */
function updateSyncIcon(){
  document.getElementById('syncIcon').textContent = STATE.syncing ? '⏳' : (STATE.online ? '⟳' : '⚠');
}
let previousFolios = null;
function checkNewRecords(items){
  const currentFolios = new Set(items.map(i=>i.Folio));
  if(previousFolios){
    let newCount = 0;
    currentFolios.forEach(f=>{ if(!previousFolios.has(f)) newCount++; });
    if(newCount > 0){
      showToast('🆕 ' + newCount + ' nuevo' + (newCount>1?'s registros':' registro') + ' desde tu última revisión');
    }
  }
  previousFolios = currentFolios;
}
function loadData(){
  STATE.syncing = true; updateSyncIcon();
  fetch(CFG.apiUrl + '?action=list')
    .then(r=>r.text().then(text=>{
      try { return JSON.parse(text); }
      catch(e){ const err = new Error('RESPUESTA_NO_JSON'); err.raw = text; throw err; }
    }))
    .then(res=>{
      if(res.success){
        STATE.items = res.data.checklist.map(normalizeItem);
        STATE.bitacora = res.data.bitacora;
        STATE.categorias = res.data.categorias;
        STATE.derivaciones = res.data.derivaciones;
        STATE.motivos = res.data.motivos;
        STATE.ubicaciones = res.data.ubicaciones || [];
        localStorage.setItem('mant_cache', JSON.stringify(res.data));
        STATE.online = true;
        document.getElementById('offlineBanner').classList.add('hidden');
        checkNewRecords(STATE.items);
        flushQueue();
      } else {
        showToast('Error del servidor: ' + (res.error||''));
        loadFromCache();
      }
      STATE.syncing = false; updateSyncIcon(); renderAll();
    })
    .catch((err)=>{
      STATE.online = false; STATE.syncing = false; updateSyncIcon();
      loadFromCache();
      const banner = document.getElementById('offlineBanner');
      if(err && err.message === 'RESPUESTA_NO_JSON'){
        banner.innerHTML = '⚠ La API respondió algo que no es válido (probablemente un bloqueador de contenido o un problema de permisos en Apps Script — revisa que la implementación esté como "Cualquier usuario"). <span style="text-decoration:underline;cursor:pointer" onclick="manualSync()">Reintentar</span>';
      } else {
        banner.innerHTML = 'Sin conexión — mostrando datos guardados. Tus cambios se enviarán al recuperar señal. <span style="text-decoration:underline;cursor:pointer" onclick="manualSync()">Reintentar</span>';
      }
      banner.classList.remove('hidden');
      renderAll();
    });
}
function loadFromCache(){
  const c = localStorage.getItem('mant_cache');
  if(c){
    const d = JSON.parse(c);
    STATE.items = d.checklist.map(normalizeItem);
    STATE.bitacora = d.bitacora; STATE.categorias = d.categorias;
    STATE.derivaciones = d.derivaciones; STATE.motivos = d.motivos;
    STATE.ubicaciones = d.ubicaciones || [];
  }
}
function normalizeItem(it){ it.Piso = typeof it.Piso === 'string' ? parseInt(it.Piso,10) : it.Piso; return it; }
function manualSync(){ loadData(); showToast('Sincronizando...'); }

function queueAdd(op){
  const q = JSON.parse(localStorage.getItem('mant_queue') || '[]');
  q.push(op); localStorage.setItem('mant_queue', JSON.stringify(q));
}
function flushQueue(){
  let q = JSON.parse(localStorage.getItem('mant_queue') || '[]');
  if(q.length === 0 || !navigator.onLine) return;
  const next = q.shift();
  localStorage.setItem('mant_queue', JSON.stringify(q));
  apiPost(next).then(()=>{ flushQueue(); }).catch(()=>{
    q.unshift(next); localStorage.setItem('mant_queue', JSON.stringify(q));
  });
}
function apiPost(payload){
  return fetch(CFG.apiUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) })
    .then(r=>r.json());
}

function renderFloorDock(){

function matchesFilters(i){
  if(STATE.pendOnly && !ACTIVE_STATES.includes(i.Estado)) return false;
  const s = STATE.search.trim().toLowerCase();
  if(s){
    const hay = (i.Folio+' '+i.Categoria+' '+i.Detalle+' '+(i.Notas||'')+' '+(i.Origen||'')+' '+(i.Grupo||'')).toLowerCase();
    if(!hay.includes(s)) return false;
  }
  return true;
}

function renderList(){
  STATE.search = document.getElementById('searchInput').value;
  const main = document.getElementById('mainList');
  const floors = floorsList();
  let html = ''; let anyVisible = false;

  floors.forEach(p=>{
    let items = STATE.items.filter(i=>i.Torre===STATE.currentTorre && i.Piso===p);
    items = items.slice().sort((a,b)=>catOrder(a.Categoria)-catOrder(b.Categoria));
    const visibleItems = items.filter(matchesFilters);
    if(STATE.pendOnly || STATE.search){ if(visibleItems.length===0) return; }
    anyVisible = true;
    const idSafe = STATE.currentTorre.replace(' ','_')+'-'+p;
    const activeCount = items.filter(i=>ACTIVE_STATES.includes(i.Estado)).length;
    html += `<div class="floor-card" id="floor-${idSafe}">
      <div class="floor-head">
        <div><span class="floor-num">${p}</span><span class="floor-tag">${p<=-1?'Subterráneo':''}</span></div>
        <div class="floor-count">${activeCount>0 ? activeCount+' activo'+(activeCount>1?'s':'') : 'OK'}</div>
      </div>`;
    const toShow = (STATE.pendOnly || STATE.search) ? visibleItems : items;
    toShow.forEach(i=>{ html += renderItemRow(i); });
    html += `<button class="add-fault-btn" onclick="openAddReportModal('${STATE.currentTorre}', ${p})">+ Agregar falla en este piso</button></div>`;
  });

  if(!anyVisible){ html = `<div class="empty-note">No hay ítems que coincidan con el filtro actual.</div>`; }
  main.innerHTML = html;
}

function renderItemRow(i){
  const est = i.Estado || 'Sin revisar';
  const color = ESTADO_COLORS[est] || '#5B6675';
  const staleBadge = isStale(i) ? ` <span class="stale-badge">⏰ Sin movimiento ${diasEntre(i.Fecha_Ultima_Actualizacion||i.Fecha_Deteccion)}d</span>` : '';
  const urgentPrefix = esUrgente(i) ? '🚨 ' : '';
  const seguimientoTag = esSeguimiento(i) ? ' <span class="stale-badge" style="color:#3B82C4">📌 Seguimiento</span>' : '';
  return `<div class="item-row" onclick="openItemModal('${i.Folio}')" style="${esUrgente(i)?'background:#D6534A14':''}">
      <div class="dot" style="background:${color}"></div>
      <div class="item-main">
        <div class="item-cat">${urgentPrefix}${i.Categoria} <span class="folio-tag">${i.Folio}</span></div>
        <div class="item-detalle">${i.Detalle ? i.Detalle : est}</div>
        ${staleBadge}${seguimientoTag}
      </div>
      <div class="chev">›</div>
    </div>`;
}

/* ================= PANEL / DASHBOARD ================= */
const ALL_ESTADOS = Object.keys(ESTADO_COLORS);

function ensureDashState(){
  if(!STATE.dash){
    STATE.dash = { torres:[...TORRES_ALL], estados:[...ALL_ESTADOS], categoria:'', area:'', grupo:'', piso:'', soloSeguimiento:false };
  }
}
function dashFilteredItems(){
  const d = STATE.dash;
  return STATE.items.filter(i=>
    d.torres.includes(i.Torre) &&
    d.estados.includes(i.Estado || 'Sin revisar') &&
    (!d.categoria || i.Categoria === d.categoria) &&
    (!d.area || i.Area_Derivacion === d.area) &&
    (!d.grupo || String(i.Grupo||'').toLowerCase().includes(d.grupo.toLowerCase())) &&
    (!d.piso || String(i.Piso) === String(d.piso)) &&
    (!d.soloSeguimiento || esSeguimiento(i))
  );
}
function countBy(items, keyFn){
  const map = {};
  items.forEach(i=>{ const k = keyFn(i) || 'Sin asignar'; map[k] = (map[k]||0)+1; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function barRow(label, count, max, color){
  const pct = max>0 ? Math.round(count/max*100) : 0;
  return `<div class="bar-row">
    <div class="bar-label">${label}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color||'var(--accent)'}"></div></div>
    <div class="bar-count">${count}</div>
  </div>`;
}

function toggleDashTorre(t, el){
  const d = STATE.dash;
  const idx = d.torres.indexOf(t);
  if(idx>=0){ if(d.torres.length>1){ d.torres.splice(idx,1); el.classList.remove('selected'); } }
  else { d.torres.push(t); el.classList.add('selected'); }
  renderDashMetrics();
}
function toggleDashEstado(e, el){
  const d = STATE.dash;
  const idx = d.estados.indexOf(e);
  if(idx>=0){ if(d.estados.length>1){ d.estados.splice(idx,1); el.classList.remove('selected'); } }
  else { d.estados.push(e); el.classList.add('selected'); }
  renderDashMetrics();
}
function setDashField(field, val){ STATE.dash[field] = val; renderDashMetrics(); }

function renderDashMetrics(){
  const wrap = document.getElementById('dashMetrics');
  if(!wrap) return;
  const items = dashFilteredItems();
  const activos = items.filter(i=>ACTIVE_STATES.includes(i.Estado)).length;
  const resueltos = items.filter(i=>i.Estado==='Resuelto');
  const diasArr = resueltos.map(i=>diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion)).filter(x=>x!==null);
  const promDias = diasArr.length ? (diasArr.reduce((s,x)=>s+x,0)/diasArr.length).toFixed(1) : '—';
  const conSeguimiento = items.filter(i=>esSeguimiento(i)).length;

  const byEstado = countBy(items, i=>i.Estado||'Sin revisar');
  const byTorre = countBy(items, i=>i.Torre);
  const byCategoria = countBy(items, i=>i.Categoria);
  const byArea = countBy(items.filter(i=>i.Area_Derivacion), i=>i.Area_Derivacion);

  const maxE = Math.max(1, ...byEstado.map(x=>x[1]));
  const maxT = Math.max(1, ...byTorre.map(x=>x[1]));
  const maxC = Math.max(1, ...byCategoria.map(x=>x[1]));
  const maxA = Math.max(1, ...byArea.map(x=>x[1]));

  wrap.innerHTML = `
    <div class="dash-tiles">
      <div class="tile"><div class="tile-num">${items.length}</div><div class="tile-label">Total ítems</div></div>
      <div class="tile"><div class="tile-num" style="color:#D6534A">${activos}</div><div class="tile-label">Activos</div></div>
      <div class="tile"><div class="tile-num" style="color:#3B82C4">${resueltos.length}</div><div class="tile-label">Resueltos</div></div>
      <div class="tile"><div class="tile-num" style="color:var(--accent)">${promDias}</div><div class="tile-label">Días prom. resolución</div></div>
      <div class="tile"><div class="tile-num" style="color:#3B82C4">${conSeguimiento}</div><div class="tile-label">📌 Con seguimiento</div></div>
    </div>
    <div class="section-label">Por estado</div>
    ${byEstado.map(([k,v])=>barRow(k,v,maxE,ESTADO_COLORS[k])).join('') || '<div class="empty-note">Sin datos</div>'}
    <div class="section-label">Por torre</div>
    ${byTorre.map(([k,v])=>barRow(k.replace('Torre ','T. '),v,maxT)).join('') || '<div class="empty-note">Sin datos</div>'}
    <div class="section-label">Por tipo de falla</div>
    ${byCategoria.map(([k,v])=>barRow(k,v,maxC)).join('') || '<div class="empty-note">Sin datos</div>'}
    <div class="section-label">Por área de derivación</div>
    ${byArea.length ? byArea.map(([k,v])=>barRow(k,v,maxA)).join('') : '<div class="empty-note">Sin fallas derivadas en este filtro.</div>'}
  `;
}

function buildPdfDashboard(){
  loadJsPdf(()=>{
    const d = STATE.dash;
    const items = dashFilteredItems();
    const byEstado = countBy(items, i=>i.Estado||'Sin revisar');
    const byTorre = countBy(items, i=>i.Torre);
    const byCategoria = countBy(items, i=>i.Categoria);
    const byArea = countBy(items.filter(i=>i.Area_Derivacion), i=>i.Area_Derivacion);
    const resueltos = items.filter(i=>i.Estado==='Resuelto');
    const diasArr = resueltos.map(i=>diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion)).filter(x=>x!==null);
    const promDias = diasArr.length ? (diasArr.reduce((s,x)=>s+x,0)/diasArr.length).toFixed(1) : '—';

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const marginX = 40; let y = 50;
    const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();
    function ensure(h){ if(y+h > pageH-60){ doc.addPage(); y=50; } }

    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text('Panel de Mantención — Resumen', marginX, y); y+=20;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
    doc.text(COMUNIDAD, marginX, y); y+=14;
    doc.text('Generado: ' + new Date().toLocaleString('es-CL'), marginX, y); y+=14;
    const filtrosTxt = 'Torres: ' + (d.torres.length===TORRES_ALL.length?'Todas':d.torres.join(', ')) +
      ' · Estados: ' + (d.estados.length===ALL_ESTADOS.length?'Todos':d.estados.join(', ')) +
      (d.categoria?(' · Falla: '+d.categoria):'') + (d.area?(' · Área: '+d.area):'') + (d.grupo?(' · Grupo: '+d.grupo):'') +
      (d.piso?(' · Piso: '+d.piso):'') + (d.soloSeguimiento?' · Solo con seguimiento pendiente':'');
    doc.splitTextToSize(filtrosTxt, pageW-marginX*2).forEach(l=>{ doc.text(l, marginX, y); y+=12; });
    doc.setDrawColor(200); y+=6; doc.line(marginX, y, pageW-marginX, y); y+=20;
    doc.setTextColor(0);

    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Total: ' + items.length + '   ·   Activos: ' + items.filter(i=>ACTIVE_STATES.includes(i.Estado)).length +
      '   ·   Resueltos: ' + resueltos.length + '   ·   Prom. días resolución: ' + promDias, marginX, y);
    y += 26;

    function table(titulo, rows){
      ensure(24);
      doc.setFont('helvetica','bold'); doc.setFontSize(12);
      doc.text(titulo, marginX, y); y+=16;
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      rows.forEach(([k,v])=>{
        ensure(13);
        doc.text(String(k), marginX+8, y);
        doc.text(String(v), marginX+320, y);
        y+=13;
      });
      y+=12;
    }
    table('Por estado', byEstado);
    table('Por torre', byTorre.map(([k,v])=>[k,v]));
    table('Por tipo de falla', byCategoria);
    table('Por área de derivación', byArea.length ? byArea : [['Sin fallas derivadas en este filtro','']]);

    doc.save('Panel_Mantencion_' + new Date().toISOString().slice(0,10) + '.pdf');
    showToast('PDF generado ✓');
  });
}

/* ================= PANTALLA DE INICIO ================= */
const ALERTAS = {
  urgentes:    { icon:'🚨', label:'Urgentes',         hint:'Requieren atención ya',          color:'#D6534A', test:i=>esUrgente(i) && !['Resuelto','OK','Descartado'].includes(i.Estado) },
  estancados:  { icon:'⏰', label:'Sin movimiento',   hint:'2 días o más sin gestión',       color:'#E8A33D', test:i=>isStale(i) },
  nuevos:      { icon:'🆕', label:'Nuevos sin gestión', hint:'Reportados, falta confirmar',  color:'#3B82C4', test:i=>i.Estado==='Nuevo' },
  seguimiento: { icon:'📌', label:'En seguimiento',   hint:'Marcados para vigilar',          color:'#9B7FE0', test:i=>esSeguimiento(i) }
};
function ensureHomeState(){ if(!STATE.home){ STATE.home = { alerta:null }; } }
function homeScopeItems(){
  const isAdmin = CURRENT_USER && CURRENT_USER.rol === 'Admin';
  if(isAdmin) return STATE.items;
  const seen = new Set(); const out = [];
  [...fugaItems(), ...deptoItems()].forEach(i=>{ if(!seen.has(i.Folio)){ seen.add(i.Folio); out.push(i); } });
  return out;
}
function saludo(){
  const h = new Date().getHours();
  const s = h < 12 ? 'Buenos días' : (h < 20 ? 'Buenas tardes' : 'Buenas noches');
  const nombre = CURRENT_USER && CURRENT_USER.nombre ? CURRENT_USER.nombre.split(' ')[0] : '';
  return nombre ? `${s}, ${nombre}` : s;
}
function activosDeTorre(t){ return STATE.items.filter(i=>i.Torre===t && ACTIVE_STATES.includes(i.Estado)).length; }

function renderHome(){
  ensureHomeState();
  const isAdmin = CURRENT_USER && CURRENT_USER.rol === 'Admin';
  const items = homeScopeItems();
  const activos = items.filter(i=>ACTIVE_STATES.includes(i.Estado)).length;
  const main = document.getElementById('mainList');

  const alertCards = Object.keys(ALERTAS).map(k=>{
    const a = ALERTAS[k]; const n = items.filter(a.test).length;
    return `<div class="alert-card ${n===0?'zero':''}" style="--ac:${a.color}" onclick="selectAlerta('${k}')">
      <div><div class="a-num">${n}</div><div class="a-label">${a.icon} ${a.label}</div></div>
      <div class="a-hint">${a.hint}</div>
    </div>`;
  }).join('');

  const fugasN = fugaItems().filter(i=>ACTIVE_STATES.includes(i.Estado)).length;
  const deptosN = deptoItems().filter(i=>ACTIVE_STATES.includes(i.Estado)).length;
  const modCard = (ico, title, meta, onclick, cls='') =>
    `<div class="mod-card ${cls}" onclick="${onclick}"><div class="m-ico">${ico}</div><div><div class="m-title">${title}</div><div class="m-meta">${meta}</div></div></div>`;
  const metaN = n => `<b>${n}</b> activa${n===1?'':'s'}`;

  let mods = '';
  if(isAdmin){
    mods += TORRES.map(t=>modCard('🏢', t, metaN(activosDeTorre(t)), `selectTorre('${t}')`)).join('');
  }
  mods += modCard('💧', 'Filtraciones', metaN(fugasN), 'selectFugas()');
  mods += modCard('🔧', 'Deptos y Comunes', metaN(deptosN), 'selectDeptos()');
  if(isAdmin){
    mods += modCard('📊', 'Panel', 'Mediciones y filtros', 'selectDashboard()');
    mods += modCard('🖨️', 'Informes', 'PDF y reportes', 'openInformesMenu()');
    mods += modCard('📱', 'Modo rápido', 'Revisar · Agregar · Editar · Derivar', 'selectSimple()', 'wide');
  }

  main.innerHTML = `
    <div class="home-greet">${saludo()}</div>
    <div class="home-sub">${activos} falla${activos===1?'':'s'} activa${activos===1?'':'s'} en total</div>
    <div class="section-label">Requiere atención</div>
    <div class="alert-grid">${alertCards}</div>
    <button class="btn btn-primary" style="margin-top:14px;padding:15px;font-size:1rem" onclick="openReportDeptoModal()">➕ Reportar una falla</button>
    <div class="section-label">Ir a</div>
    <div class="mod-grid">${mods}</div>
  `;
}

  ensureHomeState();
  const key = STATE.home.alerta;

    .sort((x,y)=>(esUrgente(y)-esUrgente(x)) || recencyStr(y).localeCompare(recencyStr(x)));

      <div class="item-main">
        <div class="item-cat">${esUrgente(i)?'🚨 ':''}${i.Categoria||''} <span class="folio-tag">${i.Folio}</span></div>
        <div class="item-detalle">${dondeTxt}${i.Detalle ? ' — '+i.Detalle : ''}</div>

/* ================= FUGAS Y FILTRACIONES ================= */
function ensureFugasState(){
  if(!STATE.fugas){ STATE.fugas = { torre:'', estados:[...ACTIVE_STATES], search:'' }; }
}
function fugaItems(){ return STATE.items.filter(i=>i.Categoria === CATEGORIA_FUGA || i.Categoria === CATEGORIA_FUGA_LEGACY); }
function fugaFilteredItems(){
  ensureFugasState();
  const f = STATE.fugas;
  return fugaItems().filter(i=>
    (!f.torre || i.Torre===f.torre) &&
    f.estados.includes(i.Estado||'Sin revisar') &&
    (!f.search || (i.Folio+' '+i.Detalle+' '+(i.Origen||'')+' '+(i.Grupo||'')).toLowerCase().includes(f.search.toLowerCase()))
  );
}
function toggleFugaEstado(e, el){
  const f = STATE.fugas;
  const idx = f.estados.indexOf(e);
  if(idx>=0){ if(f.estados.length>1){ f.estados.splice(idx,1); el.classList.remove('selected'); } }
  else { f.estados.push(e); el.classList.add('selected'); }
  renderFugasList();
}
function setFugaTorre(val){ STATE.fugas.torre = val; renderFugasList(); }
function setFugaSearch(val){ STATE.fugas.search = val; renderFugasList(); }

function renderFugas(){
  ensureFugasState();
  const f = STATE.fugas;
  const main = document.getElementById('mainList');
  main.innerHTML = `
    <div class="dash-card">
      <div class="section-label" style="margin-top:0">Torre / área</div>
      <select onchange="setFugaTorre(this.value)">
        <option value="">Todas</option>
        ${TORRES_ALL.map(t=>`<option value="${esc(t)}" ${f.torre===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <div class="section-label">Estados</div>
      <div class="chip-row">${ALL_ESTADOS.map(e=>`<div class="chip ${f.estados.includes(e)?'selected':''}" onclick="toggleFugaEstado('${e}',this)">${e}</div>`).join('')}</div>
      <div class="field"><label>Buscar</label><input type="text" placeholder="Folio, depto, detalle..." value="${esc(f.search)}" oninput="setFugaSearch(this.value)"></div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="openReportFugaModal()">+ Reportar filtración</button>
    <button class="btn btn-ghost" style="width:100%;margin-bottom:10px" onclick="generarPdfFiltraciones()">📄 Imprimir filtraciones (PDF)</button>
    <div id="fugasList"></div>
  `;
  renderFugasList();
}

function recencyStr(i){ return i.Fecha_Ultima_Actualizacion || i.Fecha_Deteccion || ''; }

function renderFugasList(){
  const wrap = document.getElementById('fugasList');
  if(!wrap) return;
  const items = fugaFilteredItems();
  if(items.length===0){ wrap.innerHTML = '<div class="empty-note">No hay filtraciones que coincidan con el filtro.</div>'; return; }

  const grupos = {};
  items.forEach(i=>{
    const key = i.Torre || 'Común';
    if(!grupos[key]) grupos[key] = [];
    grupos[key].push(i);
  });

  let html = '';
  TORRES_ALL.forEach(t=>{
    const grp = grupos[t];
    if(!grp || grp.length===0) return;
    html += `<div class="floor-card">
      <div class="floor-head"><div class="floor-num" style="font-size:.92rem">${t}</div><div class="floor-count">${grp.length} ítem(s)</div></div>`;
    grp.slice().sort((a,b)=>(esUrgente(b)-esUrgente(a)) || recencyStr(b).localeCompare(recencyStr(a))).forEach(i=>{ html += renderFugaRow(i); });
    html += `</div>`;
  });
  wrap.innerHTML = html;
}

function isStale(i){
  if(!ACTIVE_STATES.includes(i.Estado)) return false;
  const dias = diasEntre(i.Fecha_Ultima_Actualizacion || i.Fecha_Deteccion);
  return dias !== null && dias >= 2;
}

function renderFugaRow(i){
  const est = i.Estado || 'Sin revisar';
  const color = ESTADO_COLORS[est] || '#5B6675';
  const ubic = i.Origen || (i.Piso ? ('Piso '+i.Piso) : 'Sin ubicación');
  const staleBadge = isStale(i) ? ` <span class="stale-badge">⏰ Sin movimiento ${diasEntre(i.Fecha_Ultima_Actualizacion||i.Fecha_Deteccion)}d</span>` : '';
  const urgentPrefix = esUrgente(i) ? '🚨 ' : '';
  const seguimientoTag = esSeguimiento(i) ? ' <span class="stale-badge" style="color:#3B82C4">📌 Seguimiento</span>' : '';
  return `<div class="item-row" onclick="openItemModal('${i.Folio}')" style="${esUrgente(i)?'background:#D6534A14':''}">
      <div class="dot" style="background:${color}"></div>
      <div class="item-main">
        <div class="item-cat">${urgentPrefix}${ubic} <span class="folio-tag">${i.Folio}</span></div>
        <div class="item-detalle">${i.Detalle ? i.Detalle : est}</div>
        ${staleBadge}${seguimientoTag}
      </div>
      <div class="chev">›</div>
    </div>`;
}

/* ================= REPORTAR FALLA (asistente por pasos) ================= */
let W = null;
const UBIC_TIPOS = [
  {k:'depto',   ico:'🏠', t:'Departamento'},
  {k:'ascensor',ico:'🛗', t:'Ascensor'},
  {k:'acceso',  ico:'🚪', t:'Acceso torre'},
  {k:'comun',   ico:'🏊', t:'Área común'}
];
const CAT_ICONS = [[/filtr|fuga|gotera/i,'💧'],[/luz|luces|ilumin/i,'💡'],[/el[eé]ctric|enchuf/i,'⚡'],[/puert/i,'🚪'],[/pintur/i,'🎨'],[/sucied|limpi|aseo/i,'🧹'],[/manilla|cerradura/i,'🔧'],[/emerg|cartel/i,'🪧'],[/c[aá]mar/i,'📷'],[/ascens/i,'🛗'],[/piso|suelo|baldos/i,'🧱'],[/cielo|techo/i,'🏚️'],[/ventan|vidrio/i,'🪟'],[/timbre|citof/i,'🔔']];
function catIcon(c){ for(const [re,ic] of CAT_ICONS){ if(re.test(c)) return ic; } return '🔧'; }

function openReportWizard(opts){
  opts = opts || {};
  pendingPhoto = { base64:null, mime:null };
  W = {
    opts, step:0, ubic:'', torre:'', depto:'', piso:'', pisoTouched:false,
    zona:'', zonaOtra:false, zonaTxt:'', cat: opts.cat || '', catOtra:false, catTxt:'', catAll:false,
    detalle:'', urgente:false, grupo:'', origenExtra:'',
    fixedLoc: !!opts.torre, fixedCat: !!opts.cat, sending:false, done:null
  };
  if(opts.torre){ W.ubic = 'piso'; W.torre = opts.torre; W.piso = opts.piso; }
  wizRender();
}
function openReportDeptoModal(){ openReportWizard({}); }
function openReportFugaModal(){ openReportWizard({ cat: CATEGORIA_FUGA }); }
function openAddReportModal(torre, piso){ openReportWizard({ torre, piso }); }

function wizSteps(){
  const s = [];
  if(!W.fixedLoc) s.push('ubic');
  if(!W.fixedCat) s.push('cat');
  s.push('foto','detalle');
  return s;
}
function wizSave(){
  if(!W) return;
  const g = id => document.getElementById(id);
  if(g('wDepto')) W.depto = g('wDepto').value.trim();
  if(g('wPiso')) W.piso = g('wPiso').value;
  if(g('wZonaTxt')) W.zonaTxt = g('wZonaTxt').value.trim();
  if(g('wCatTxt')) W.catTxt = g('wCatTxt').value.trim();
  if(g('wDetalle')) W.detalle = g('wDetalle').value;
  if(g('wGrupo')) W.grupo = g('wGrupo').value.trim();
  if(g('wOrigen')) W.origenExtra = g('wOrigen').value.trim();
  if(g('wUrg')) W.urgente = g('wUrg').checked;
}
function wizPick(key, val){ wizSave(); W[key] = val; wizRender(); }
function wizPickZona(i){ wizSave(); W.zona = wizZonas()[i]; W.zonaOtra = false; wizRender(); }
function wizPickCat(i){ wizSave(); W.cat = (W.catAll ? wizCatsAll() : wizCatsTop())[i]; W.catOtra = false; wizRender(); }
function wizToggle(key){ wizSave(); W[key] = !W[key]; if(key==='zonaOtra' && W.zonaOtra) W.zona=''; if(key==='catOtra' && W.catOtra) W.cat=''; wizRender(); }
function wizDeptoInput(v){
  W.depto = v.trim();
  if(!W.pisoTouched){
    const digits = v.replace(/\D/g,'');
    const p = digits.length >= 3 ? digits.slice(0,-2) : '';
    const el = document.getElementById('wPiso'); if(el) el.value = p;
    W.piso = p;
  }
}
function wizPhotoDone(){
  if(!W || W.done) return;
  const nx = document.getElementById('wzNext'); if(nx) nx.textContent = 'Siguiente ›';
}

function wizCatsTop(){
  const cnt = {};
  STATE.items.forEach(i=>{
    if(!i.Categoria || i.Categoria===CATEGORIA_FUGA_LEGACY) return;
    if(i.Estado==='OK' || i.Estado==='Sin revisar') return;
    cnt[i.Categoria] = (cnt[i.Categoria]||0) + 1;
  });
  const all = wizCatsAll();
  let top = Object.keys(cnt).filter(c=>all.includes(c)).sort((a,b)=>cnt[b]-cnt[a]).slice(0,6);
  if(!top.includes(CATEGORIA_FUGA)){ if(top.length>=6) top[5] = CATEGORIA_FUGA; else top.push(CATEGORIA_FUGA); }
  return top;
}
function wizCatsAll(){
  const list = STATE.categorias.filter(c=>c && c!==CATEGORIA_FUGA_LEGACY);
  if(!list.includes(CATEGORIA_FUGA)) list.unshift(CATEGORIA_FUGA);
  return list;
}
function wizZonas(){
  const z = STATE.ubicaciones.filter(u=>u && !String(u).startsWith('Ascensor') && !String(u).startsWith('Acceso Principal'));
  return z.length ? z : ['Salón de adultos','Salón de juegos','Salón de niños','Baños','Gimnasio','Lavandería','Piscina','Quincho','Conserjería'];
}
function wizZonaIcon(z){
  const t = String(z).toLowerCase();
  if(/gimnas/.test(t)) return '🏋️'; if(/lavand/.test(t)) return '🧺'; if(/piscin/.test(t)) return '🏊';
  if(/quincho/.test(t)) return '🔥'; if(/conserj/.test(t)) return '🛎️'; if(/ba[ñn]o/.test(t)) return '🚻';
  if(/sal[oó]n|sala/.test(t)) return '🛋️'; if(/estacion/.test(t)) return '🅿️';
  return '📍';
}

function wizResolve(){
  let torre, piso, origen;
  if(W.ubic === 'piso'){ torre = W.torre; piso = W.piso; origen = W.origenExtra; }
  else if(W.ubic === 'depto'){ torre = W.torre; piso = parseInt(W.piso,10); origen = 'Depto ' + W.depto; }
  else if(W.ubic === 'ascensor'){ torre = W.torre; piso = 0; origen = 'Ascensor'; }
  else if(W.ubic === 'acceso'){ torre = W.torre; piso = 0; origen = 'Acceso Principal'; }
  else { torre = 'Común'; piso = 0; origen = W.zonaOtra ? W.zonaTxt : W.zona; }
  const cat = W.catOtra ? W.catTxt : W.cat;
  return { torre, piso, origen, cat };
}
function wizUbicLabel(){
  const r = wizResolve();
  if(W.ubic === 'piso') return `${r.torre} · Piso ${r.piso}` + (r.origen ? ' · '+r.origen : '');
  if(W.ubic === 'depto') return `${r.torre} · ${r.origen} (piso ${r.piso})`;
  if(W.ubic === 'comun') return `Común · ${r.origen}`;
  return `${r.torre} · ${r.origen}`;
}
function wizValidate(step){
  if(step === 'ubic'){
    if(!W.ubic) return 'Elige dónde está la falla';
    if(['depto','ascensor','acceso'].includes(W.ubic) && !W.torre) return 'Elige la torre';
    if(W.ubic === 'depto'){
      if(!W.depto) return 'Ingresa el número de depto';
      if(isNaN(parseInt(W.piso,10))) return 'Ingresa el piso';
    }
    if(W.ubic === 'comun' && !(W.zonaOtra ? W.zonaTxt : W.zona)) return 'Elige la zona';
  }
  if(step === 'cat'){
    if(!(W.catOtra ? W.catTxt : W.cat)) return 'Elige el tipo de falla';
  }
  if(step === 'detalle'){
    if(!W.detalle.trim() && !pendingPhoto.base64) return 'Agrega una foto o escribe un detalle';
  }
  return '';
}

function wizNext(){
  wizSave();
  const steps = wizSteps();
  const step = steps[W.step];
  const err = wizValidate(step);
  if(err){ showToast(err); return; }
  if(W.step >= steps.length - 1){ wizSubmit(); return; }
  W.step++; wizRender();
  const m = document.querySelector('.modal'); if(m) m.scrollTop = 0;
}
function wizBack(){
  wizSave();
  if(W.step > 0){ W.step--; wizRender(); }
}

function wizRender(){
  if(W.done){ return wizRenderDone(); }
  const steps = wizSteps();
  const step = steps[W.step];
  const n = steps.length;
  const ctx = [];
  if(W.fixedLoc) ctx.push(`${W.torre} · Piso ${W.piso}`);
  if(W.fixedCat) ctx.push(`${catIcon(W.cat)} ${W.cat}`);
  const prog = steps.map((_,i)=>`<i class="${i<=W.step?'on':''}"></i>`).join('');

  let body = '';
  if(step === 'ubic') body = wizStepUbic();
  else if(step === 'cat') body = wizStepCat();
  else if(step === 'foto') body = wizStepFoto();
  else body = wizStepDetalle();

  const isLast = W.step === n - 1;
  let nextLabel = isLast ? '✅ Reportar' : 'Siguiente ›';
  if(step === 'foto' && !pendingPhoto.base64) nextLabel = 'Omitir ›';
  const leftBtn = W.step === 0
    ? `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>`
    : `<button class="btn btn-ghost" onclick="wizBack()">‹ Atrás</button>`;

  showModal(`
    <h2>➕ Reportar falla</h2>
    <div class="sub">${ctx.length ? ctx.join(' · ') + ' — ' : ''}Paso ${W.step+1} de ${n}</div>
    <div class="wz-prog">${prog}</div>
    ${body}
    <div class="btn-row">
      ${leftBtn}
      <button class="btn btn-primary" id="wzNext" style="margin-top:0" onclick="wizNext()">${nextLabel}</button>
    </div>
  `);
}

function wizStepUbic(){
  const tipos = UBIC_TIPOS.map(u=>`<button class="wz-btn ${W.ubic===u.k?'sel':''}" onclick="wizPick('ubic','${u.k}')"><span class="ico">${u.ico}</span>${u.t}</button>`).join('');
  let extra = '';
  const torres = `<div class="wz-q2">Torre</div><div class="wz-grid four">${TORRES.map(t=>`<button class="wz-btn ${W.torre===t?'sel':''}" onclick="wizPick('torre','${t}')">${t.replace('Torre ','')}</button>`).join('')}</div>`;
  if(W.ubic === 'depto'){
    extra = torres + `
      <div class="wz-two">
        <div class="field"><label>N° depto</label><input type="text" id="wDepto" inputmode="numeric" placeholder="Ej: 1204" value="${esc(W.depto)}" oninput="wizDeptoInput(this.value)"></div>
        <div class="field"><label>Piso</label><input type="number" id="wPiso" placeholder="Ej: 12" value="${esc(W.piso)}" oninput="W.pisoTouched=true"></div>
      </div>`;
  } else if(W.ubic === 'ascensor' || W.ubic === 'acceso'){
    extra = torres;
  } else if(W.ubic === 'comun'){
    const zonas = wizZonas().map((z,zi)=>`<button class="wz-btn sm ${(!W.zonaOtra && W.zona===z)?'sel':''}" onclick="wizPickZona(${zi})"><span class="ico">${wizZonaIcon(z)}</span>${z}</button>`).join('');
    extra = `<div class="wz-q2">Zona</div><div class="wz-grid">${zonas}
      <button class="wz-btn sm ${W.zonaOtra?'sel':''}" onclick="wizToggle('zonaOtra')"><span class="ico">✏️</span>Otra…</button></div>
      ${W.zonaOtra ? `<div class="field"><input type="text" id="wZonaTxt" placeholder="Nombre de la zona" value="${esc(W.zonaTxt)}"></div>` : ''}`;
  }
  return `<div class="wz-q">¿Dónde está la falla?</div><div class="wz-grid">${tipos}</div>${extra}`;
}

function wizStepCat(){
  const list = W.catAll ? wizCatsAll() : wizCatsTop();
  const chips = list.map((c,ci)=>`<button class="wz-btn sm ${(!W.catOtra && W.cat===c)?'sel':''}" onclick="wizPickCat(${ci})"><span class="ico">${catIcon(c)}</span>${c}</button>`).join('');
  return `<div class="wz-q">¿Qué tipo de falla es?</div>
    <div class="wz-hint">${W.catAll ? 'Todos los tipos' : 'Más usadas'}</div>
    <div class="wz-grid">${chips}
      <button class="wz-btn sm ${W.catOtra?'sel':''}" onclick="wizToggle('catOtra')"><span class="ico">✏️</span>Otra…</button>
    </div>
    ${W.catOtra ? `<div class="field"><input type="text" id="wCatTxt" placeholder="Nombre del nuevo tipo de falla" value="${esc(W.catTxt)}"></div>` : ''}
    <button class="wz-link" onclick="wizToggle('catAll')">${W.catAll ? 'Ver menos ▴' : 'Ver todas ▾'}</button>`;
}

function wizStepFoto(){
  const has = !!pendingPhoto.base64;
  const src = has ? `data:${pendingPhoto.mime};base64,${pendingPhoto.base64}` : '';
  return `<div class="wz-q">Foto de la falla</div>
    <div class="wz-hint">Recomendada: ayuda a que mantención llegue directo al problema.</div>
    <input type="file" id="wCam" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoSelect(event)">
    <input type="file" id="wFile" accept="image/*" class="hidden" onchange="handlePhotoSelect(event)">
    <div class="wz-grid">
      <button class="wz-btn" onclick="document.getElementById('wCam').click()"><span class="ico">📷</span>Tomar foto</button>
      <button class="wz-btn" onclick="document.getElementById('wFile').click()"><span class="ico">🖼️</span>Elegir de archivos</button>
    </div>
    <img id="photoPreview" class="photo-preview ${has?'':'hidden'}" ${has?`src="${src}"`:''}>`;
}

function wizStepDetalle(){
  const r = wizResolve();
  return `<div class="wz-q">Detalle <span style="font-weight:400;color:var(--text-dim);font-size:.8rem">(opcional si hay foto)</span></div>
    <div class="field" style="margin-top:0"><textarea id="wDetalle" placeholder="Ej: Gotea sobre la ducha, se moja el piso">${W.detalle.replace(/</g,'&lt;')}</textarea></div>
    <label class="wz-urg"><input type="checkbox" id="wUrg" ${W.urgente?'checked':''}> 🚨 Marcar como urgente</label>
    ${W.ubic==='piso' ? `<div class="field"><label>Origen (depto / área, opcional)</label><input type="text" id="wOrigen" placeholder="Ej: Depto 1204" value="${esc(W.origenExtra)}"></div>` : ''}
    <div class="field"><label>Grupo (opcional)</label><input type="text" id="wGrupo" placeholder="Ej: Reclamo-Depto1204" value="${esc(W.grupo)}"></div>
    <div class="wz-summary">
      <div><b>Lugar:</b> ${wizUbicLabel()}</div>
      <div><b>Tipo:</b> ${catIcon(r.cat)} ${r.cat}</div>
      <div><b>Foto:</b> ${pendingPhoto.base64 ? 'sí ✓' : 'sin foto'}</div>
    </div>`;
}

function wizSubmit(){
  const r = wizResolve();
  const btn = document.getElementById('wzNext');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando…'; }

  if(W.catOtra && r.cat && !STATE.categorias.includes(r.cat)){
    STATE.categorias.push(r.cat);
    const pl = { action:'addConfig', tipo:'categoria', valor:r.cat, ...userTag() };
    if(navigator.onLine){ apiPost(pl); } else { queueAdd(pl); }
  }
  if(W.ubic === 'comun' && W.zonaOtra && r.origen && !STATE.ubicaciones.includes(r.origen)){
    STATE.ubicaciones.push(r.origen);
    const pl = { action:'addConfig', tipo:'ubicacion', valor:r.origen, ...userTag() };
    if(navigator.onLine){ apiPost(pl); } else { queueAdd(pl); }
  }

  const det = W.detalle.trim();
  const tempFolio = 'TEMP-' + Date.now();
  const ts = new Date().toISOString().slice(0,16).replace('T',' ');
  STATE.items.push({
    Folio: tempFolio, Torre: r.torre, Piso: r.piso, Categoria: r.cat, Origen: r.origen, Grupo: W.grupo,
    Estado:'Nuevo', Detalle: det, Area_Derivacion:'', Codigo_Ubicacion:'',
    Fecha_Deteccion: ts, Fecha_Ultima_Actualizacion: ts, Fecha_Resolucion:'',
    Foto_Deteccion_URL:'', Foto_Resolucion_URL:'',
    Actualizado_Por: CURRENT_USER.nombre||'', Notas:'', Urgente: W.urgente ? 'Sí' : ''
  });
  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));

  const payload = { action:'add', torre:r.torre, piso:r.piso, categoria:r.cat, detalle:det, origen:r.origen, grupo:W.grupo, urgente:W.urgente, ...userTag() };
  if(pendingPhoto.base64){ payload.foto_base64 = pendingPhoto.base64; payload.foto_mime = pendingPhoto.mime; }

  const label = wizUbicLabel();
  const finish = (folio, queued)=>{
    W.done = { folio, queued, label, cat:r.cat, urgente:W.urgente };
    wizRender(); renderAll();
  };
  if(navigator.onLine){
    apiPost(payload).then(res=>{
      if(res.success){ finish(res.folio, false); loadData(); }
      else { queueAdd(payload); finish(null, true); }
    }).catch(()=>{ queueAdd(payload); finish(null, true); });
  } else { queueAdd(payload); finish(null, true); }
}

function wizRenderDone(){
  const d = W.done;
  showModal(`
    <div class="wz-done">
      <div class="wz-check">${d.queued ? '🕓' : '✓'}</div>
      <h2 style="margin:6px 0 2px">${d.queued ? 'Guardada en este equipo' : 'Falla reportada'}</h2>
      ${d.folio ? `<div class="wz-folio">${d.folio}</div>` : ''}
      <div class="wz-hint" style="margin-top:6px">${d.urgente?'🚨 ':''}${d.cat} · ${d.label}</div>
      ${d.queued ? '<div class="wz-hint">Sin señal o sin respuesta del servidor: se enviará sola al recuperar conexión.</div>' : '<div class="wz-hint">Quedó en estado <b>Nuevo</b>.</div>'}
    </div>
    <div class="action-list">
      <button class="btn btn-primary" style="margin-top:0" onclick="wizAnother()">➕ Otra falla en el mismo lugar</button>
      <button class="btn btn-ghost" onclick="openReportWizard(W.opts)">📍 Reportar en otro lugar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
    </div>
  `);
}
function wizAnother(){
  pendingPhoto = { base64:null, mime:null };
  W.done = null; W.sending = false;
  W.detalle = ''; W.urgente = false; W.grupo = ''; W.origenExtra = '';
  if(!W.fixedCat){ W.cat = ''; W.catOtra = false; W.catTxt = ''; }
  W.step = W.fixedLoc ? 0 : 1;
  wizRender();
}

/* ================= PDF: SOLO FILTRACIONES ================= */
function generarPdfFiltraciones(){
  showToast('Generando PDF...');
  loadJsPdf(()=>buildPdfFiltraciones());
}
function buildPdfFiltraciones(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const marginX = 40; let y = 50;
  const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();
  function ensure(h){ if(y+h > pageH-60){ doc.addPage(); y=50; } }

  const items = fugaFilteredItems();

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Informe de Filtraciones', marginX, y); y+=20;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
  doc.text(COMUNIDAD, marginX, y); y+=14;
  doc.text('Generado: ' + new Date().toLocaleString('es-CL'), marginX, y); y+=16;
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(214,83,74);
  doc.text('Atención prioritaria — protocolo de respuesta distinto al resto de fallas.', marginX, y); y+=10;
  doc.setTextColor(0); doc.setFont('helvetica','normal');
  doc.setDrawColor(200); y+=8; doc.line(marginX, y, pageW-marginX, y); y+=18;

  if(items.length===0){ doc.setFontSize(11); doc.text('No hay filtraciones que coincidan con el filtro actual.', marginX, y); }

  const grupos = {};
  items.forEach(i=>{ const key = i.Torre || 'Común'; if(!grupos[key]) grupos[key]=[]; grupos[key].push(i); });

  let total = 0;
  TORRES_ALL.forEach(t=>{
    const grp = grupos[t];
    if(!grp || grp.length===0) return;
    ensure(18);
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(t + ' — ' + grp.length + ' ítem(s)', marginX, y); y+=16;
    grp.slice().sort((a,b)=>(a.Piso||0)-(b.Piso||0)).forEach(i=>{
      total++;
      const ubic = i.Origen || (i.Piso ? ('Piso '+i.Piso) : '');
      const dias = diasEntre(i.Fecha_Deteccion);
      const text = '[' + i.Folio + '] ' + ubic + ' (' + i.Estado + ')' +
        (i.Area_Derivacion ? (' · Derivado a: '+i.Area_Derivacion) : '') +
        ': ' + (i.Detalle||'—') + (dias!==null ? (' — '+dias+'d') : '');
      const lines = doc.splitTextToSize(text, pageW-marginX*2-20);
      ensure(lines.length*11+4);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text('• '+lines[0], marginX+10, y);
      for(let k=1;k<lines.length;k++){ y+=11; doc.text('   '+lines[k], marginX+10, y); }
      y+=12;
    });
    y+=6;
  });

  ensure(90); y = Math.max(y, pageH-140);
  doc.setDrawColor(200); doc.line(marginX, y, pageW-marginX, y); y+=24;
  doc.setFontSize(9.5); doc.setFont('helvetica','normal');
  doc.text('Total de filtraciones: ' + total, marginX, y); y+=30;
  doc.text('Entregado por (Administración): _____________________________     Fecha: __________', marginX, y); y+=34;
  doc.text('Recibido por (Mantención): _____________________________     Fecha: __________', marginX, y);

  doc.save('Filtraciones_' + new Date().toISOString().slice(0,10) + '.pdf');
  showToast('PDF generado ✓');
}

/* ================= DEPTOS Y COMUNES (genérico: cualquier tipo de falla, cualquier ubicación) ================= */
function ensureDeptosState(){
  if(!STATE.deptos){ STATE.deptos = { torre:'', categoria:'', estados:[...ACTIVE_STATES], search:'' }; }
}
function deptoItems(){
  return STATE.items.filter(i=>{
    const esFiltracion = i.Categoria===CATEGORIA_FUGA || i.Categoria===CATEGORIA_FUGA_LEGACY;
    if(esFiltracion) return false; // esas viven en la pestaña Filtraciones
    const origen = String(i.Origen||'').trim().toLowerCase();
    const esDepto = origen.startsWith('depto');
    const esAscensorOAcceso = origen==='ascensor' || origen==='acceso principal';
    const esComun = i.Torre === 'Común';
    return esDepto || esAscensorOAcceso || esComun;
  });
}
function deptoFilteredItems(){
  ensureDeptosState();
  const f = STATE.deptos;
  return deptoItems().filter(i=>
    (!f.torre || i.Torre===f.torre) &&
    (!f.categoria || i.Categoria===f.categoria) &&
    f.estados.includes(i.Estado||'Sin revisar') &&
    (!f.search || (i.Folio+' '+i.Categoria+' '+i.Detalle+' '+(i.Origen||'')+' '+(i.Grupo||'')).toLowerCase().includes(f.search.toLowerCase()))
  );
}
function toggleDeptoEstado(e, el){
  const f = STATE.deptos;
  const idx = f.estados.indexOf(e);
  if(idx>=0){ if(f.estados.length>1){ f.estados.splice(idx,1); el.classList.remove('selected'); } }
  else { f.estados.push(e); el.classList.add('selected'); }
  renderDeptosList();
}
function setDeptoTorre(val){ STATE.deptos.torre = val; renderDeptosList(); }
function setDeptoCategoria(val){ STATE.deptos.categoria = val; renderDeptosList(); }
function setDeptoSearch(val){ STATE.deptos.search = val; renderDeptosList(); }

function renderDeptos(){
  ensureDeptosState();
  const f = STATE.deptos;
  const main = document.getElementById('mainList');
  main.innerHTML = `
    <div class="dash-card">
      <div class="section-label" style="margin-top:0">Torre / área</div>
      <select onchange="setDeptoTorre(this.value)">
        <option value="">Todas</option>
        ${TORRES_ALL.map(t=>`<option value="${esc(t)}" ${f.torre===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <div class="section-label">Tipo de falla</div>
      <select onchange="setDeptoCategoria(this.value)">
        <option value="">Todas</option>
        ${STATE.categorias.map(c=>`<option value="${esc(c)}" ${f.categoria===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <div class="section-label">Estados</div>
      <div class="chip-row">${ALL_ESTADOS.map(e=>`<div class="chip ${f.estados.includes(e)?'selected':''}" onclick="toggleDeptoEstado('${e}',this)">${e}</div>`).join('')}</div>
      <div class="field"><label>Buscar</label><input type="text" placeholder="Folio, depto, detalle..." value="${esc(f.search)}" oninput="setDeptoSearch(this.value)"></div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="openReportDeptoModal()">+ Reportar falla (depto, ascensor, acceso o área común)</button>
    <button class="btn btn-ghost" style="width:100%;margin-bottom:10px" onclick="generarPdfDeptos()">📄 Imprimir (PDF)</button>
    <div id="deptosList"></div>
  `;
  renderDeptosList();
}

function renderDeptosList(){
  const wrap = document.getElementById('deptosList');
  if(!wrap) return;
  const items = deptoFilteredItems();
  if(items.length===0){ wrap.innerHTML = '<div class="empty-note">No hay fallas que coincidan con el filtro. Usa el botón de arriba para reportar una en un depto, ascensor, acceso o área común.</div>'; return; }

  const grupos = {};
  items.forEach(i=>{
    const key = i.Torre || 'Sin torre';
    if(!grupos[key]) grupos[key] = [];
    grupos[key].push(i);
  });

  let html = '';
  TORRES_ALL.forEach(t=>{
    const grp = grupos[t];
    if(!grp || grp.length===0) return;
    html += `<div class="floor-card">
      <div class="floor-head"><div class="floor-num" style="font-size:.92rem">${t}</div><div class="floor-count">${grp.length} ítem(s)</div></div>`;
    grp.slice().sort((a,b)=>(esUrgente(b)-esUrgente(a)) || recencyStr(b).localeCompare(recencyStr(a))).forEach(i=>{ html += renderDeptoRow(i); });
    html += `</div>`;
  });
  wrap.innerHTML = html;
}

function renderDeptoRow(i){
  const est = i.Estado || 'Sin revisar';
  const color = ESTADO_COLORS[est] || '#5B6675';
  const staleBadge = isStale(i) ? ` <span class="stale-badge">⏰ Sin movimiento ${diasEntre(i.Fecha_Ultima_Actualizacion||i.Fecha_Deteccion)}d</span>` : '';
  const urgentPrefix = esUrgente(i) ? '🚨 ' : '';
  const seguimientoTag = esSeguimiento(i) ? ' <span class="stale-badge" style="color:#3B82C4">📌 Seguimiento</span>' : '';
  return `<div class="item-row" onclick="openItemModal('${i.Folio}')" style="${esUrgente(i)?'background:#D6534A14':''}">
      <div class="dot" style="background:${color}"></div>
      <div class="item-main">
        <div class="item-cat">${urgentPrefix}${i.Categoria} · ${i.Origen||'—'} <span class="folio-tag">${i.Folio}</span></div>
        <div class="item-detalle">${i.Detalle ? i.Detalle : est}</div>
        ${staleBadge}${seguimientoTag}
      </div>
      <div class="chev">›</div>
    </div>`;
}

/* ================= PDF: SOLO FALLAS DE DEPTO ================= */
function generarPdfDeptos(){
  showToast('Generando PDF...');
  loadJsPdf(()=>buildPdfDeptos());
}
function buildPdfDeptos(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const marginX = 40; let y = 50;
  const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();
  function ensure(h){ if(y+h > pageH-60){ doc.addPage(); y=50; } }

  const items = deptoFilteredItems();

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Informe de Fallas — Deptos y Espacios Comunes', marginX, y); y+=20;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
  doc.text(COMUNIDAD, marginX, y); y+=14;
  doc.text('Generado: ' + new Date().toLocaleString('es-CL'), marginX, y); y+=10;
  doc.setDrawColor(200); y+=8; doc.line(marginX, y, pageW-marginX, y); y+=18;
  doc.setTextColor(0);

  if(items.length===0){ doc.setFontSize(11); doc.text('No hay fallas que coincidan con el filtro actual.', marginX, y); }

  const grupos = {};
  items.forEach(i=>{ const key = i.Torre || 'Sin torre'; if(!grupos[key]) grupos[key]=[]; grupos[key].push(i); });

  let total = 0;
  TORRES_ALL.forEach(t=>{
    const grp = grupos[t];
    if(!grp || grp.length===0) return;
    ensure(18);
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(t + ' — ' + grp.length + ' ítem(s)', marginX, y); y+=16;
    grp.slice().sort((a,b)=>(a.Piso||0)-(b.Piso||0)).forEach(i=>{
      total++;
      const dias = diasEntre(i.Fecha_Deteccion);
      const text = '[' + i.Folio + '] ' + (i.Origen||'') + ' · ' + i.Categoria + ' (' + i.Estado + ')' +
        (i.Area_Derivacion ? (' · Derivado a: '+i.Area_Derivacion) : '') +
        ': ' + (i.Detalle||'—') + (dias!==null ? (' — '+dias+'d') : '');
      const lines = doc.splitTextToSize(text, pageW-marginX*2-20);
      ensure(lines.length*11+4);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text('• '+lines[0], marginX+10, y);
      for(let k=1;k<lines.length;k++){ y+=11; doc.text('   '+lines[k], marginX+10, y); }
      y+=12;
    });
    y+=6;
  });

  ensure(90); y = Math.max(y, pageH-140);
  doc.setDrawColor(200); doc.line(marginX, y, pageW-marginX, y); y+=24;
  doc.setFontSize(9.5); doc.setFont('helvetica','normal');
  doc.text('Total de fallas: ' + total, marginX, y); y+=30;
  doc.text('Entregado por (Administración): _____________________________     Fecha: __________', marginX, y); y+=34;
  doc.text('Recibido por (Mantención): _____________________________     Fecha: __________', marginX, y);

  doc.save('Fallas_Deptos_Comunes_' + new Date().toISOString().slice(0,10) + '.pdf');
  showToast('PDF generado ✓');
}

/* ================= MODAL GENÉRICO ================= */
function showModal(innerHtml){
  if(!activeModalBg){
    activeModalBg = document.createElement('div');
    activeModalBg.className = 'modal-bg';
    activeModalBg.onclick = (e)=>{ if(e.target===activeModalBg) closeModal(); };
    document.body.appendChild(activeModalBg);
  }
  activeModalBg.innerHTML = `<div class="modal">${innerHtml}</div>`;
}
function closeModal(){
  if(activeModalBg){ activeModalBg.remove(); activeModalBg=null; }
  pendingPhoto = { base64:null, mime:null };
}

/* ================= DETALLE DE ÍTEM ================= */
function openItemModal(folio){
  const item = STATE.items.find(x=>x.Folio===folio);
  if(!item) return;
  showModal(itemDetailHtml(item));
}

function esUrgente(item){ return item.Urgente === 'Sí' || item.Urgente === true; }
function esSeguimiento(item){ return item.Seguimiento === 'Sí' || item.Seguimiento === true; }

function ultimoMotivo(item){
  const entries = STATE.bitacora.filter(b=>b.Folio===item.Folio).slice().sort((a,b)=>(b.Fecha_Hora||'').localeCompare(a.Fecha_Hora||''));
  return entries.length ? entries[0].Motivo : '';
}
function fueRevertidoAutomatico(item){ return ultimoMotivo(item) === 'Reversión automática'; }
function fueAutoMarcadoUrgente(item){ return ultimoMotivo(item) === 'Auto-marcado urgente'; }

function itemDetailHtml(item){
  const est = item.Estado || 'Sin revisar';
  const color = ESTADO_COLORS[est] || '#5B6675';
  const transiciones = TRANSICIONES[est] || [];
  const diasDetTxt = item.Fecha_Deteccion ? (diasEntre(item.Fecha_Deteccion) + ' días desde detección') : '';
  const diasResTxt = (item.Fecha_Deteccion && item.Fecha_Resolucion) ? ('Resuelto en ' + diasEntre(item.Fecha_Deteccion, item.Fecha_Resolucion) + ' días') : '';
  const urgente = esUrgente(item);
  const seguimiento = esSeguimiento(item);

  let photos = '';
  if(item.Foto_Deteccion_URL || item.Foto_Resolucion_URL){
    photos = '<div class="photo-row">';

    if(item.Foto_Resolucion_URL) photos += `<img class="photo-thumb" src="${item.Foto_Resolucion_URL}" onclick="window.open('${item.Foto_Resolucion_URL}','_blank')" title="Foto resolución">`;

  ).join('');

  const notas = STATE.bitacora.filter(b=>b.Folio===item.Folio && (b.Nota || b.Foto_URL)).slice().sort((a,b)=>(b.Fecha_Hora||'').localeCompare(a.Fecha_Hora||''));
  const notasHtml = notas.length ? notas.map(n=>`
      <div class="bit-entry">
        <div class="bit-date">${n.Fecha_Hora} · ${n.Autor||'—'}</div>
        ${n.Nota ? `<div>${n.Nota}</div>` : ''}
        ${n.Foto_URL ? `<img class="photo-thumb" style="margin-top:6px" src="${n.Foto_URL}" onclick="window.open('${n.Foto_URL}','_blank')">` : ''}
      </div>`).join('') : '<div class="empty-note" style="padding:10px 0">Sin notas o comentarios todavía.</div>';

  let urgenteBadge = '';
  if(urgente){

      ? `<span class="badge" style="background:#D6534A22;color:#D6534A;border:1px solid #D6534A;margin-left:6px">⚠ Sin atención (2h)</span>`
      : `<span class="badge" style="background:#D6534A22;color:#D6534A;border:1px solid #D6534A;margin-left:6px">🚨 Urgente</span>`;
  }

  return `
    <h2>${urgente?'🚨 ':''}${item.Categoria} <span class="folio-tag">${item.Folio}</span></h2>
    <div class="sub">${item.Torre} · ${item.Piso<=-1?'Subterráneo ':'Piso '}${item.Piso}</div>
    <span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}">${est}</span>
    ${urgenteBadge}
    ${seguimiento ? `<span class="badge" style="background:#3B82C422;color:#3B82C4;border:1px solid #3B82C4;margin-left:6px">📌 Seguimiento</span>` : ''}
    ${fueRevertidoAutomatico(item) ? `<span class="badge" style="background:#E8A33D22;color:#E8A33D;border:1px solid #E8A33D;margin-left:6px">🔁 Reabierto automático (3h sin gestión)</span>` : ''}
    <div style="margin-top:12px; font-size:.88rem; line-height:1.4;">${item.Detalle || '<span style="color:var(--text-dim)">Sin detalle registrado</span>'}</div>
    ${photos}
    <div class="kv"><div class="k">Origen</div><div>${item.Origen || '—'}</div></div>
    <div class="kv"><div class="k">Grupo</div><div>${item.Grupo || '—'}</div></div>
    <div class="kv"><div class="k">Área derivada</div><div>${item.Area_Derivacion || '—'}</div></div>
    <div class="kv"><div class="k">Detectado</div><div>${item.Fecha_Deteccion || '—'} ${diasDetTxt && est!=='Resuelto' ? '('+diasEntre(item.Fecha_Deteccion)+'d)' : ''}</div></div>
    ${diasResTxt ? `<div class="kv"><div class="k">Resolución</div><div>${diasResTxt}</div></div>` : ''}
    <div class="kv"><div class="k">Última actualización</div><div>${item.Fecha_Ultima_Actualizacion || '—'} · ${item.Actualizado_Por||'—'}</div></div>

    <div class="section-label">Notas y comentarios</div>
    ${notasHtml}
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="openAddPhotoForm('${item.Folio}')">📷 Agregar foto</button>
