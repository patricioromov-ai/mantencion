function buildPdfPlan(entries){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const marginX = 36;
  const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();
  const hexRgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];

  pdfHeaderBand(doc, 'Plan de Trabajo de Mantención', marginX, pageW);
  const pl = getPlazos();
  const lines = [
    (STATE.plan.torre ? 'Torre: '+STATE.plan.torre : 'Todas las torres y áreas') + ' · Agrupado por ' + (STATE.plan.group==='area' ? 'área responsable' : 'torre y piso'),
    'Plazos desde detección: Crítica ' + pl.critica + 'd · Alta ' + pl.alta + 'd · Media ' + pl.media + 'd · Baja ' + pl.baja + 'd'
  ];
  let y = pdfMeta(doc, marginX, 78, pageW, lines);
  const atrasadas = entries.filter(e=>e.atraso).length;
  y = pdfKpiRow(doc, marginX, y+4, pageW, [
    { label:'Fallas en plan', value: entries.length },
    { label:'Críticas (hoy)', value: entries.filter(e=>e.prio==='critica').length, color:hexRgb(PRIORIDADES.critica.color) },
    { label:'Altas (semana)', value: entries.filter(e=>e.prio==='alta').length, color:hexRgb(PRIORIDADES.alta.color) },
    { label:'Atrasadas', value: atrasadas, color:[193,84,75] },
    { label:'Nuevas', value: entries.filter(e=>e.nueva).length, color:[47,111,168] }
  ]);

  // Resumen de cantidades
  const cant = planCantidades(entries);
  const torresCols = TORRES_ALL.filter(t=>entries.some(e=>(e.i.Torre||'Común')===t));
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...PDF_NAVY);
  doc.text('Qué hay que atender', marginX, y); doc.setTextColor(0); y += 6;
  doc.autoTable({
    startY: y, margin:{ left:marginX, right:marginX, bottom:40 },
    head: [['Tipo de falla','Total', ...torresCols.map(t=>t.replace('Torre ','T. '))]],
    body: cant.map(([c,v])=>[c, v.total, ...torresCols.map(t=>v.porTorre[t]||'')]),
    theme:'grid', styles:{ font:'helvetica', fontSize:8, cellPadding:4, halign:'center' },
    headStyles:{ fillColor:PDF_NAVY, textColor:255, fontStyle:'bold' },
    columnStyles:{ 0:{halign:'left', cellWidth:150}, 1:{fontStyle:'bold'} }
  });
  y = doc.lastAutoTable.finalY + 18;

  // Plan por ventanas
  const body = [];
  Object.keys(PRIORIDADES).forEach(k=>{
    const P = PRIORIDADES[k];
    const grp = entries.filter(e=>e.prio===k);
    if(!grp.length) return;
    body.push([{ content: PRIO_VENTANA[k].toUpperCase() + '  ·  Prioridad ' + P.label + '  ·  ' + grp.length + ' falla' + (grp.length===1?'':'s') + '  ·  plazo ' + pl[k] + ' día' + (pl[k]===1?'':'s'),
      colSpan:8, styles:{ fillColor:hexRgb(P.color), textColor:255, fontStyle:'bold', fontSize:9 } }]);
    const groups = {};
    grp.forEach(e=>{ const key = planGroupKey(e); (groups[key] = groups[key]||[]).push(e); });
    const keys = Object.keys(groups).sort((a,b)=>{
      if(STATE.plan.group==='torre'){ const f=t=>{ const x=TORRES_ALL.indexOf(t); return x===-1?99:x; }; return f(a)-f(b); }
      return a.localeCompare(b);
    });
    keys.forEach(key=>{
      body.push([{ content: key + '  (' + groups[key].length + ')', colSpan:8, styles:{ fillColor:[232,236,240], textColor:PDF_NAVY, fontStyle:'bold', fontSize:8.5 } }]);
      groups[key].sort(planSort).forEach(e=>{
        const i = e.i;
        body.push([
          (esUrgente(i)?'URG ':'') + i.Folio + (e.nueva?' *':''),
          planLugar(i), i.Categoria, i.Detalle || '—', i.Area_Derivacion || '—', i.Estado || 'Sin revisar',
          fmtDM(e.obj) + (e.atraso ? ' (atr. '+e.atraso+'d)' : ''), ''
        ]);
      });
    });
  });
  doc.autoTable({
    startY: y, margin:{ left:marginX, right:marginX, bottom:40 },
    head: [['Folio','Lugar','Tipo','Detalle','Área','Estado','Vence','Hecho']],
    body, theme:'plain',
    styles:{ font:'helvetica', fontSize:7.5, cellPadding:4, overflow:'linebreak', valign:'middle', lineColor:PDF_LINE, lineWidth:0.3 },
    headStyles:{ fillColor:PDF_NAVY, textColor:255, fontStyle:'bold', fontSize:8 },
    columnStyles:{ 0:{cellWidth:54}, 1:{cellWidth:88}, 2:{cellWidth:68}, 3:{cellWidth:'auto'}, 4:{cellWidth:52}, 5:{cellWidth:48}, 6:{cellWidth:52}, 7:{cellWidth:36, halign:'center'} },
    didParseCell:(data)=>{
      if(data.section==='body' && data.column.index===5 && typeof data.cell.raw==='string'){
        data.cell.styles.textColor = ESTADO_RGB[data.cell.raw] || [0,0,0]; data.cell.styles.fontStyle='bold';
      }
      if(data.section==='body' && data.column.index===6 && typeof data.cell.raw==='string' && data.cell.raw.indexOf('atr.')>-1){
        data.cell.styles.textColor = [193,84,75]; data.cell.styles.fontStyle='bold';
      }
    },
    didDrawCell:(data)=>{
      if(data.section==='body' && data.column.index===7 && data.row.raw && data.row.raw.length===8 && typeof data.row.raw[0]==='string'){
        const s = 9, cx = data.cell.x + data.cell.width/2 - s/2, cy = data.cell.y + data.cell.height/2 - s/2;
        doc.setDrawColor(120); doc.rect(cx, cy, s, s);
      }
    }
  });
  y = doc.lastAutoTable.finalY + 22;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...PDF_GRAY);
  doc.text('* = falla nueva desde el último plan guardado.   URG = urgencia inmediata.', marginX, y); doc.setTextColor(0); y += 24;
  if(y > pageH - 90){ doc.addPage(); y = 60; }
  doc.setDrawColor(...PDF_LINE); doc.line(marginX, y, pageW-marginX, y); y += 24;
  doc.setFontSize(9.5);
  doc.text('Entregado por (Administración): _____________________________     Fecha: __________', marginX, y); y += 30;
  doc.text('Recibido por (Mantención): _____________________________     Fecha: __________', marginX, y);

  pdfFooterPages(doc, marginX, pageW, pageH);
  doc.save('Plan_de_Trabajo_' + new Date().toISOString().slice(0,10) + '.pdf');
  planMarcarVistoSilencioso(entries);
  showToast('PDF generado ✓ · plan guardado como referencia');
}
function planMarcarVistoSilencioso(entries){
  // Guarda como referencia TODO el plan vigente (sin filtro de torre), para comparar la próxima vez
  const prevTorre = STATE.plan.torre; STATE.plan.torre = '';
  const all = planEntries().map(e=>e.i.Folio);
  STATE.plan.torre = prevTorre;
  localStorage.setItem('mant_plan_last', JSON.stringify({ fecha:new Date().toISOString(), folios: all }));
}

/* ---- Excel del plan ---- */
function generarExcelPlan(){
  const entries = planEntries();
  if(!entries.length){ showToast('No hay fallas en el plan para exportar'); return; }
  showToast('Generando Excel...');
  loadXlsxLib(()=>buildExcelPlan(entries));
}
function buildExcelPlan(entries){
  const ordenPrio = Object.keys(PRIORIDADES);
  const sorted = entries.slice().sort((a,b)=> (ordenPrio.indexOf(a.prio)-ordenPrio.indexOf(b.prio)) || planSort(a,b));
  const rows = sorted.map(e=>{
    const i = e.i, n = nivelesDe(i);
    return {
      'Ventana': PRIO_VENTANA[e.prio], 'Prioridad': PRIORIDADES[e.prio].label, 'Folio': i.Folio,
      'Torre': i.Torre, 'Piso': i.Piso, 'Lugar': i.Origen||'', 'Tipo de falla': i.Categoria, 'Detalle': i.Detalle||'',
      'Gravedad': n.gravedad, 'Importancia': n.importancia, 'Urgencia': n.urgencia,
      'Área responsable': i.Area_Derivacion||'', 'Estado': i.Estado||'Sin revisar',
      'Fecha detección': i.Fecha_Deteccion||'', 'Fecha objetivo': e.obj.toISOString().slice(0,10),
      'Días de atraso': e.atraso || 0, 'Nueva desde último plan': e.nueva ? 'Sí' : '',
      'Seguimiento': esSeguimiento(i) ? 'Sí' : ''
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:10},{wch:10},{wch:9},{wch:6},{wch:18},{wch:16},{wch:40},{wch:10},{wch:11},{wch:11},{wch:18},{wch:12},{wch:16},{wch:12},{wch:8},{wch:10},{wch:10}];
  const torresCols = TORRES_ALL;
  const resumen = planCantidades(entries).map(([c,v])=>{
    const r = { 'Tipo de falla': c, 'Total': v.total };
    torresCols.forEach(t=>{ r[t] = v.porTorre[t] || 0; });
    return r;
  });
  const ws2 = XLSX.utils.json_to_sheet(resumen);
  ws2['!cols'] = [{wch:20},{wch:8},...torresCols.map(()=>({wch:9}))];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Plan');
  XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');
  XLSX.writeFile(wb, 'Plan_de_Trabajo_' + new Date().toISOString().slice(0,10) + '.xlsx');
  planMarcarVistoSilencioso(entries);
  showToast('Excel generado ✓ · plan guardado como referencia');
}

/* ================= TORRES: MAPA DE PISOS ================= */
function ensureTorreUi(){ if(!STATE.torreUi){ STATE.torreUi = { filtro:'todos', verTodas:false }; } }
function setTorreFiltro(f){ ensureTorreUi(); STATE.torreUi.filtro = f; renderTorre(); }
function toggleVerTodasTorre(){ ensureTorreUi(); STATE.torreUi.verTodas = !STATE.torreUi.verTodas; renderTorre(); }

const CERRADOS = ['OK','Resuelto','Descartado'];
function floorStats(torre, piso){
  const items = STATE.items.filter(i=>i.Torre===torre && i.Piso===piso);
  const fallas = items.filter(i=>prioridadDe(i)!==null);
  const sinRev = items.filter(i=>(i.Estado||'Sin revisar')==='Sin revisar' && !esUrgente(i)).length;
  const cerrados = items.filter(i=>CERRADOS.includes(i.Estado)).length;
  let peor = null;
  fallas.forEach(i=>{ const p = prioridadDe(i); if(peor===null || PRIORIDADES[p].ord < PRIORIDADES[peor].ord) peor = p; });
  let estado = 'vacio';
  if(items.length){
    if(fallas.length) estado = 'fallas';
    else if(sinRev === 0) estado = 'ok';
    else if(cerrados > 0) estado = 'parcial';
    else estado = 'sin';
  }
  return { items, fallas: fallas.length, peor, sinRev, cerrados, estado, total: items.length };
}
function torreStats(torre){
  const items = STATE.items.filter(i=>i.Torre===torre);
  const revisados = items.filter(i=>(i.Estado||'Sin revisar')!=='Sin revisar' || esUrgente(i)).length;
  const porPrio = {};
  Object.keys(PRIORIDADES).forEach(k=>{ porPrio[k] = items.filter(i=>prioridadDe(i)===k).length; });
  return { total: items.length, revisados, pct: items.length ? Math.round(revisados*100/items.length) : 0, porPrio, activas: items.filter(i=>prioridadDe(i)!==null).length };
}

function renderTorre(){
  ensureTorreUi();
  const t = STATE.currentTorre;

function applyOkLocal(item){

  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));

function okPayload(folio){ return { action:'transition', folio, estado_nuevo:'OK', motivo:'', nota:'', ...userTag() }; }
function quickOk(folio){
  const item = STATE.items.find(x=>x.Folio===folio); if(!item) return;
  applyOkLocal(item); saveCacheLocal();
  const payload = okPayload(folio);
  if(navigator.onLine){ apiPost(payload).then(res=>{ if(!res.success){ showToast('No se pudo guardar en el servidor'); queueAdd(payload); } }).catch(()=>queueAdd(payload)); }
  else { queueAdd(payload); showToast('Sin conexión: guardado localmente'); }

function quickFalla(folio){

function markFloorOk(torre, piso){
  const pend = STATE.items.filter(i=>i.Torre===torre && i.Piso===piso && (i.Estado||'Sin revisar')==='Sin revisar' && !esUrgente(i));
  if(!pend.length) return;
  if(!confirm(`¿Marcar como OK los ${pend.length} ítems sin revisar del ${piso<=-1?'subterráneo ':'piso '}${piso} de ${torre}?`)) return;
  pend.forEach(applyOkLocal); saveCacheLocal();
  const payloads = pend.map(i=>okPayload(i.Folio));
  if(navigator.onLine){
    payloads.reduce((p, pl)=> p.then(()=> apiPost(pl).then(r=>{ if(!r.success) queueAdd(pl); }).catch(()=>queueAdd(pl))), Promise.resolve())
      .then(()=>showToast('Piso marcado OK ✓'));
  } else { payloads.forEach(queueAdd); showToast('Sin conexión: se enviará al recuperar señal'); }
  refreshFloorSheet(); renderAll();
}

/* ================= SEMÁFORO DE GESTIÓN (por torre y áreas comunes) ================= */
const SEMAFORO = {
  rojo:     { ico:'🔴', label:'Rojo',     color:'#C1544B' },
  naranja:  { ico:'🟠', label:'Naranja',  color:'#CF6A1F' },
  amarillo: { ico:'🟡', label:'Amarillo', color:'#C99A10' },
  verde:    { ico:'🟢', label:'Verde',    color:'#3F7D6B' }
};
const SEMAFORO_UNIDADES = ['Torre A','Torre B','Torre C','Torre D','Común'];
function semaforoDe(items){
  const now = new Date();
  const act = items.filter(i=>prioridadDe(i)!==null);
  let crit = 0, alta = 0, atras = 0;
  act.forEach(i=>{
    const p = prioridadDe(i);
    if(p==='critica') crit++;
    if(p==='alta') alta++;
    if(now > fechaObjetivo(i, p)) atras++;
  });
  const hace30 = new Date(now.getTime() - 30*86400000);
  const resueltas30 = items.filter(i=>i.Estado==='Resuelto' && i.Fecha_Resolucion && parseFH(i.Fecha_Resolucion) >= hace30).length;
  let nivel = 'verde';
  if(crit > 0 || (atras >= 3 && act.length && atras/act.length >= 0.3)) nivel = 'rojo';
  else if(alta > 0 || atras > 0) nivel = 'naranja';
  else if(act.length > 0) nivel = 'amarillo';
  const partes = [];
  if(crit) partes.push(crit + ' crítica' + (crit===1?'':'s'));
  if(alta) partes.push(alta + ' alta' + (alta===1?'':'s'));
  if(atras) partes.push(atras + ' atrasada' + (atras===1?'':'s'));
  let motivo = partes.join(' · ');
  if(!motivo) motivo = act.length ? 'En gestión, a tiempo' : 'Al día, sin fallas activas';
  return { nivel, activas: act.length, crit, alta, atras, resueltas30, motivo };
}
function semaforoUnidad(u){ return semaforoDe(STATE.items.filter(i=>i.Torre===u)); }
function irAUnidad(u){
  if(u === 'Común'){ ensureDeptosState(); STATE.deptos.torre = 'Común'; selectDeptos(); }
  else { selectTorre(u); }
}
function semaforoGridHtml(){
  const cards = SEMAFORO_UNIDADES.map((u,idx)=>{
    const s = semaforoUnidad(u); const S = SEMAFORO[s.nivel];
    return `<div class="sem-card ${idx===4?'wide':''}" style="--sc:${S.color}" onclick="irAUnidad('${u}')">
      <div class="sem-dot">${S.ico}</div>
      <div class="sem-main">
        <div class="sem-name">${u==='Común' ? 'Áreas comunes' : u}</div>
        <div class="sem-state">${S.label} · ${s.activas} activa${s.activas===1?'':'s'}</div>
        <div class="sem-why">${s.motivo}</div>
      </div>
      <div class="sem-meta"><b>${s.resueltas30}</b><span>resueltas<br>30 días</span></div>
    </div>`;
  }).join('');
  return `<div class="sem-grid">${cards}</div>
    <details class="sem-help"><summary>¿Cómo se calcula el semáforo?</summary>
      <div>🔴 <b>Rojo:</b> hay fallas críticas, o muchas atrasadas (3 o más y al menos el 30%).<br>
      🟠 <b>Naranja:</b> hay fallas de prioridad alta o alguna atrasada.<br>
      🟡 <b>Amarillo:</b> hay fallas activas pero en gestión y a tiempo.<br>
      🟢 <b>Verde:</b> sin fallas activas.<br>
      “Atrasada” = pasó el plazo de su prioridad (ver ⚙ Plazos en el Plan de trabajo).</div></details>`;
}
function semaforoSectionHtml(){
  return `<div class="section-label">🚦 Semáforo de gestión <span class="sl-hint">· toca para entrar</span></div>${semaforoGridHtml()}`;
}

  }
};
function esActivaMod(i){ const e = i.Estado || 'Sin revisar'; return ACTIVE_STATES.includes(e) || (e==='Sin revisar' && esUrgente(i)); }
function esCerradaMod(i){ return CERRADOS_MOD.includes(i.Estado); }
function isAtrasada(i){ const p = prioridadDe(i); return !!p && new Date() > fechaObjetivo(i, p); }

// Ítems del módulo según torre (y tipo en Deptos), sin mirar el estado
function modScope(kind){
  const c = MOD_CFG[kind], f = c.st();
  return c.items().filter(i=> (!f.torre || i.Torre===f.torre) && (!c.cats || !f.categoria || i.Categoria===f.categoria));
}
function modFiltered(kind){
  const f = MOD_CFG[kind].st();
  const q = (f.search||'').toLowerCase().trim();
  return modScope(kind).filter(i=>{
    if(f.ver==='activas' && !esActivaMod(i)) return false;
    if(f.ver==='resueltas' && !esCerradaMod(i)) return false;
    if(f.ver==='todas' && !(esActivaMod(i) || esCerradaMod(i))) return false;
    if(f.filtro==='urg' && !esUrgente(i)) return false;
    if(f.filtro==='stale' && !isStale(i)) return false;
    if(f.filtro==='atras' && !isAtrasada(i)) return false;
    if(q && !(i.Folio+' '+(i.Categoria||'')+' '+(i.Detalle||'')+' '+(i.Origen||'')+' '+(i.Grupo||'')+' '+(i.Torre||'')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function modTilesHtml(kind){
  const f = MOD_CFG[kind].st();
  const act = modScope(kind).filter(esActivaMod);
  const tiles = [
    { k:'',      n:act.length,                      l:'Activas',        c:'var(--text)' },
    { k:'urg',   n:act.filter(esUrgente).length,    l:'🚨 Urgentes',    c:'#C1544B' },
    { k:'stale', n:act.filter(isStale).length,      l:'⏰ Sin mov.',    c:'#B7791F' },
    { k:'atras', n:act.filter(isAtrasada).length,   l:'⌛ Atrasadas',   c:'#CF6A1F' }
  ];
  return `<div class="fx-tiles">${tiles.map(t=>`<div class="fx-tile ${(f.filtro||'')===t.k?'on':''} ${t.n===0&&t.k?'zero':''}" style="--tc:${t.c}" onclick="modTile('${kind}','${t.k}')"><b>${t.n}</b><span>${t.l}</span></div>`).join('')}</div>`;
}
function modPillsHtml(kind){
  const c = MOD_CFG[kind], f = c.st();
  const base = c.items().filter(esActivaMod);
  const opts = [['','Todas']].concat(TORRES_ALL.map(t=>[t, t.replace('Torre ','')]));
  return `<div class="fx-pills">${opts.map(([v,l])=>{
    const n = v ? base.filter(i=>i.Torre===v).length : base.length;
    return `<button class="fx-pill ${f.torre===v?'on':''}" onclick="modTorre('${kind}','${v}')">${l}${n?`<i>${n}</i>`:''}</button>`;
  }).join('')}</div>`;
}
function modCardHtml(i, kind){
  const est = i.Estado || 'Sin revisar';
  const ec = ESTADO_COLORS[est] || '#8A8A80';
  const p = prioridadDe(i);
  const pc = p ? PRIORIDADES[p].color : ec;
  const cerrada = esCerradaMod(i);
  const dd = cerrada ? diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion) : diasEntre(i.Fecha_Deteccion);
  const urg = esUrgente(i) && !cerrada;
  const ico = catIcon(i.Categoria || '');
  const title = kind==='fugas'
    ? (i.Origen || (i.Piso ? ('Piso '+i.Piso) : 'Sin ubicación'))
    : ((i.Categoria||'Falla') + (i.Origen ? ' · '+i.Origen : ''));
  const sub = (kind==='fugas' && i.Categoria && i.Categoria!==CATEGORIA_FUGA) ? `<div class="fx-sub">${ico} ${i.Categoria}</div>` : '';
  const stale = isStale(i) ? `<span class="fx-flag warn">⏰ ${diasEntre(i.Fecha_Ultima_Actualizacion||i.Fecha_Deteccion)}d sin mov.</span>` : '';
  const atr = (!cerrada && isAtrasada(i)) ? `<span class="fx-flag late">⌛ atrasada</span>` : '';
  const seg = esSeguimiento(i) ? `<span class="fx-flag seg">📌</span>` : '';
  const area = i.Area_Derivacion ? `<span class="fx-flag">→ ${i.Area_Derivacion}</span>` : '';
  const img = i.Foto_Deteccion_URL ? `<img src="${esc(i.Foto_Deteccion_URL)}" loading="lazy" alt="" onerror="this.remove()">` : '';
  return `<div class="fx-card ${urg?'urg':''} ${cerrada?'done':''}" style="--pc:${pc}" onclick="openItemModal('${i.Folio}')">
    <div class="fx-thumb"><span>${ico}</span>${img}</div>
    <div class="fx-main">
      <div class="fx-l1"><span class="fx-torre ${torreCls(i.Torre||'Común')}">${(i.Torre||'Común').replace('Torre ','')}</span>${prioChip(i)}${urg?'<span class="fx-urg">🚨</span>':''}<span class="folio-tag">${i.Folio}</span></div>
      <div class="fx-title">${title}</div>
      ${sub}
      <div class="fx-detalle">${i.Detalle ? i.Detalle : '<i>Sin detalle</i>'}</div>
      <div class="fx-l3"><span class="fx-est" style="--ec:${ec}">${est}</span>${stale}${atr}${seg}${area}</div>
    </div>
    <div class="fx-days"><b>${dd===null?'—':dd}</b><span>días</span></div>
  </div>`;
}

function modDyn(kind){
  const c = MOD_CFG[kind], f = c.st();
  const top = document.getElementById('modTop');
  const list = document.getElementById('modList');
  if(!top || !list) return;
  const catSel = c.cats ? `<select class="fx-sel" onchange="modCategoria('${kind}',this.value)">
      <option value="">Todos los tipos de falla</option>
      ${STATE.categorias.filter(x=>!esFiltracionCat(x)).map(x=>`<option value="${esc(x)}" ${f.categoria===x?'selected':''}>${x}</option>`).join('')}
    </select>` : '';
  top.innerHTML = `
    ${modTilesHtml(kind)}
    ${modPillsHtml(kind)}
    <div class="fx-ver"><div class="seg">${VER_OPTS.map(([v,l])=>`<button class="${f.ver===v?'on':''}" onclick="modVer('${kind}','${v}')">${l}</button>`).join('')}</div></div>
    ${catSel}`;

  const items = modFiltered(kind);
  if(items.length===0){
    const limpio = f.ver==='activas' && !f.filtro && !f.search;
    list.innerHTML = limpio
      ? `<div class="fx-empty"><div class="e-ico">🎉</div><div class="e-t">Todo al día</div><div class="e-s">No hay fallas activas aquí. Si ves algo, toca “${c.addTxt.replace('＋ ','')}”.</div></div>`
      : `<div class="fx-empty"><div class="e-ico">🔎</div><div class="e-t">Nada con este filtro</div><div class="e-s">Prueba con otra torre, otra vista o borra la búsqueda.</div></div>`;
    return;
  }
  const grupos = {};
  items.forEach(i=>{ const k = i.Torre || 'Común'; (grupos[k] = grupos[k] || []).push(i); });
  let html = '', shown = 0;
  TORRES_ALL.forEach(t=>{
    const grp = grupos[t];
    if(!grp || !grp.length) return;
    grp.sort(f.ver==='resueltas'
      ? (a,b)=>(b.Fecha_Resolucion||'').localeCompare(a.Fecha_Resolucion||'')
      : cmpPrioridad);
    html += `<div class="fx-gh"><span><i class="td ${torreCls(t)}"></i>${t==='Común'?'Áreas comunes':t}</span><b>${grp.length}</b></div>`;
    for(const i of grp){
      if(shown >= (f.lim||40)) break;
      html += modCardHtml(i, kind); shown++;
    }
  });
  if(items.length > shown){
    html += `<button class="btn btn-ghost" style="width:100%;margin-top:6px" onclick="modMas('${kind}')">Mostrar más (${items.length-shown} restantes)</button>`;
  }
  list.innerHTML = html;
}
function modTile(kind, k){ const f = MOD_CFG[kind].st(); f.filtro = (k && f.filtro===k) ? '' : k; if(k) f.ver='activas'; f.lim=40; modDyn(kind); }
function modTorre(kind, v){ const f = MOD_CFG[kind].st(); f.torre = v; f.lim=40; modDyn(kind); }
function modVer(kind, v){ const f = MOD_CFG[kind].st(); f.ver = v; f.filtro=''; f.lim=40; modDyn(kind); }
function modCategoria(kind, v){ const f = MOD_CFG[kind].st(); f.categoria = v; f.lim=40; modDyn(kind); }
function modSearch(kind, v){ const f = MOD_CFG[kind].st(); f.search = v; f.lim=40; modDyn(kind); }

function isStale(i){
  if(!ACTIVE_STATES.includes(i.Estado)) return false;
  const dias = diasEntre(i.Fecha_Ultima_Actualizacion || i.Fecha_Deteccion);

/* ================= REPORTAR FALLA (asistente por pasos) ================= */
let W = null;
const UBIC_TIPOS = [
  {k:'depto',   ico:'🏠', t:'Departamento'},
  {k:'ascensor',ico:'🛗', t:'Ascensor'},
  {k:'acceso',  ico:'🚪', t:'Acceso torre'},
  {k:'comun',   ico:'🏊', t:'Área común'}
];
const ZONAS_TORRE = ['Pasillo','Shaft','Escalera de emergencia','Subterráneo','Bodega'];
const ZONAS_NIVEL = ['Subterráneo','Bodega']; // piden nivel -1/-2/-3
const ZONAS_EXTRA_COMUN = ['Estacionamiento','Jardines','Juegos infantiles','Quinchos','Basureros','Conserjería']; // zonas que pertenecen a una torre (y piso)
function esZonaTorre(z){ return ZONAS_TORRE.includes(z); }
const CAT_ICONS = [[/filtr|fuga|gotera/i,'💧'],[/monitor/i,'🖥️'],[/jard|pasto/i,'🌳'],[/juego/i,'🛝'],[/quincho/i,'🔥'],[/basurero/i,'🗑️'],[/bodega/i,'🧰'],[/luz|luces|ilumin/i,'💡'],[/el[eé]ctric|enchuf/i,'⚡'],[/puert/i,'🚪'],[/pintur/i,'🎨'],[/sucied|limpi|aseo/i,'🧹'],[/manilla|cerradura/i,'🔧'],[/emerg|cartel/i,'🪧'],[/c[aá]mar/i,'📷'],[/ascens/i,'🛗'],[/piso|suelo|baldos/i,'🧱'],[/cielo|techo/i,'🏚️'],[/ventan|vidrio/i,'🪟'],[/timbre|citof/i,'🔔']];
function catIcon(c){ for(const [re,ic] of CAT_ICONS){ if(re.test(c)) return ic; } return '🔧'; }

function openReportWizard(opts){
  opts = opts || {};
  pendingPhoto = { base64:null, mime:null };
  W = {
    opts, step:0, ubic:'', torre:'', depto:'', piso:'', pisoTouched:false,
    zona:'', zonaOtra:false, zonaTxt:'', bodega:'', cat: opts.cat || '', catOtra:false, catTxt:'', catAll:false,
    detalle:'', niv:null, nivTouched:{}, grupo:'', origenExtra:'',
    fixedLoc: !!opts.torre, fixedCat: !!opts.cat && !opts.catGroup, sending:false, done:null
  };
  if(opts.torre){ W.ubic = 'piso'; W.torre = opts.torre; W.piso = opts.piso; }
  wizRender();
}
function openReportDeptoModal(){ openReportWizard({}); }
function openReportFugaModal(){ openReportWizard({ cat: CATEGORIA_FUGA, catGroup:'filtracion' }); }
function openAddReportModal(torre, piso){ openReportWizard({ torre, piso }); }

function wizSteps(){
  const s = [];
  if(!W.fixedLoc) s.push('ubic');
  if(!W.fixedCat) s.push('cat');
  s.push('foto','detalle');
  return s;
}
function wizSave(){
  if(!W) return;
  const g = id => document.getElementById(id);
  if(g('wDepto')) W.depto = g('wDepto').value.trim();
  if(g('wPiso')) W.piso = g('wPiso').value;
  if(g('wZonaTxt')) W.zonaTxt = g('wZonaTxt').value.trim();
  if(g('wBodega')) W.bodega = g('wBodega').value.trim();
  if(g('wCatTxt')) W.catTxt = g('wCatTxt').value.trim();
  if(g('wDetalle')) W.detalle = g('wDetalle').value;
  if(g('wGrupo')) W.grupo = g('wGrupo').value.trim();
  if(g('wOrigen')) W.origenExtra = g('wOrigen').value.trim();
}
function wizPick(key, val){ wizSave(); W[key] = val; wizRender(); }
function wizPickZona(i){ wizSave(); W.zona = wizZonas()[i]; W.zonaOtra = false; W.piso = ''; W.pisoTouched = false; wizRender(); }
function wizPickNivel(v){ wizSave(); W.piso = (W.piso === String(v) && W.zona==='Estacionamiento') ? '' : String(v); wizRender(); }
function wizCatList(){
  if(W.opts && W.opts.catGroup === 'filtracion') return wizCatsAll().filter(esFiltracionCat).filter(c=>c!==CATEGORIA_FUGA_LEGACY);
  return W.catAll ? wizCatsAll() : wizCatsTop();
}
function wizPickCat(i){ wizSave(); W.cat = wizCatList()[i]; W.catOtra = false; wizRender(); }
function wizToggle(key){ wizSave(); W[key] = !W[key]; if(key==='zonaOtra' && W.zonaOtra) W.zona=''; if(key==='catOtra' && W.catOtra) W.cat=''; wizRender(); }
function wizDeptoInput(v){
  W.depto = v.trim();
  if(!W.pisoTouched){
    const digits = v.replace(/\D/g,'');
    const p = digits.length >= 3 ? digits.slice(0,-2) : '';
    const el = document.getElementById('wPiso'); if(el) el.value = p;
    W.piso = p;
  }
}
function wizPhotoDone(){
  if(!W || W.done) return;
  const nx = document.getElementById('wzNext'); if(nx) nx.textContent = 'Siguiente ›';
}

function wizCatsTop(){
  const cnt = {};
  STATE.items.forEach(i=>{
    if(!i.Categoria || i.Categoria===CATEGORIA_FUGA_LEGACY) return;
    if(i.Estado==='OK' || i.Estado==='Sin revisar') return;
    cnt[i.Categoria] = (cnt[i.Categoria]||0) + 1;
  });
  const all = wizCatsAll();
  let top = Object.keys(cnt).filter(c=>all.includes(c)).sort((a,b)=>cnt[b]-cnt[a]).slice(0,6);
  if(!top.includes(CATEGORIA_FUGA)){ if(top.length>=6) top[5] = CATEGORIA_FUGA; else top.push(CATEGORIA_FUGA); }
  return top;
}
function wizCatsAll(){
  const list = STATE.categorias.filter(c=>c && c!==CATEGORIA_FUGA_LEGACY);
  if(!list.includes(CATEGORIA_FUGA)) list.unshift(CATEGORIA_FUGA);
  return list;
}
function wizZonas(){
  const z = STATE.ubicaciones.filter(u=>u && !String(u).startsWith('Ascensor') && !String(u).startsWith('Acceso Principal'));
  const base = z.length ? z : ['Salón de adultos','Salón de juegos','Salón de niños','Baños','Gimnasio','Lavandería','Piscina','Quincho','Conserjería'];
  const norm = t => String(t).toLowerCase().replace(/s$/,'');
  const resto = base.filter(u=>!ZONAS_TORRE.some(zt=>norm(zt)===norm(u) || norm(u).startsWith('escalera')));
  const nn = t => norm(String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,''));
  const have = new Set(resto.map(nn));
  const extras = ZONAS_EXTRA_COMUN.filter(z=>!have.has(nn(z)));
  return [...ZONAS_TORRE, ...resto, ...extras];
}
function wizZonaIcon(z){
  const t = String(z).toLowerCase();
  if(/subterr/.test(t)) return '⬇️'; if(/bodega/.test(t)) return '🧰'; if(/jard/.test(t)) return '🌳'; if(/juego/.test(t) && !/sal/.test(t)) return '🛝'; if(/basurero/.test(t)) return '🗑️';
  if(/pasillo/.test(t)) return '🚶'; if(/shaft/.test(t)) return '🕳️'; if(/escalera/.test(t)) return '🪜';
  if(/gimnas/.test(t)) return '🏋️'; if(/lavand/.test(t)) return '🧺'; if(/piscin/.test(t)) return '🏊';
  if(/quincho/.test(t)) return '🔥'; if(/conserj/.test(t)) return '🛎️'; if(/ba[ñn]o/.test(t)) return '🚻';
  if(/sal[oó]n|sala/.test(t)) return '🛋️'; if(/estacion/.test(t)) return '🅿️';
  return '📍';
}

function wizResolve(){
  let torre, piso, origen;
  if(W.ubic === 'piso'){ torre = W.torre; piso = W.piso; origen = W.origenExtra; }
  else if(W.ubic === 'depto'){ torre = W.torre; piso = parseInt(W.piso,10); origen = 'Depto ' + W.depto; }
  else if(W.ubic === 'ascensor'){ torre = W.torre; piso = 0; origen = 'Ascensor'; }
  else if(W.ubic === 'acceso'){ torre = W.torre; piso = 0; origen = 'Acceso Principal'; }
  else if(!W.zonaOtra && esZonaTorre(W.zona)){
    torre = W.torre; piso = parseInt(W.piso,10); if(isNaN(piso)) piso = 0;
    origen = (W.zona === 'Bodega' && W.bodega) ? ('Bodega ' + W.bodega) : W.zona;
  }
  else {
    torre = 'Común'; piso = 0; origen = W.zonaOtra ? W.zonaTxt : W.zona;
    if(!W.zonaOtra && W.zona === 'Estacionamiento' && W.piso !== '' && !isNaN(parseInt(W.piso,10))) piso = parseInt(W.piso,10);
  }
  const cat = W.catOtra ? W.catTxt : W.cat;
  return { torre, piso, origen, cat };
}
function wizUbicLabel(){
  const r = wizResolve();
  if(W.ubic === 'piso') return `${r.torre} · Piso ${r.piso}` + (r.origen ? ' · '+r.origen : '');
  if(W.ubic === 'depto') return `${r.torre} · ${r.origen} (piso ${r.piso})`;
  if(W.ubic === 'comun' && r.torre !== 'Común') return `${r.torre} · ${r.origen}` + (r.piso ? (r.piso<0 ? ` · nivel ${r.piso}` : ` · piso ${r.piso}`) : '');
  if(W.ubic === 'comun' && r.piso) return `Común · ${r.origen} · nivel ${r.piso}`;
  if(W.ubic === 'comun') return `Común · ${r.origen}`;
  return `${r.torre} · ${r.origen}`;
}
function wizValidate(step){
  if(step === 'ubic'){
    if(!W.ubic) return 'Elige dónde está la falla';
    if(['depto','ascensor','acceso'].includes(W.ubic) && !W.torre) return 'Elige la torre';
    if(W.ubic === 'depto'){
      if(!W.depto) return 'Ingresa el número de depto';
      if(isNaN(parseInt(W.piso,10))) return 'Ingresa el piso';
    }
    if(W.ubic === 'comun' && !(W.zonaOtra ? W.zonaTxt : W.zona)) return 'Elige la zona';
    if(W.ubic === 'comun' && !W.zonaOtra && esZonaTorre(W.zona) && !W.torre) return 'Elige la torre';
    if(W.ubic === 'comun' && !W.zonaOtra && ZONAS_NIVEL.includes(W.zona) && !['-1','-2','-3'].includes(String(W.piso))) return 'Elige el nivel (-1, -2 o -3)';
  }
  if(step === 'cat'){
    if(!(W.catOtra ? W.catTxt : W.cat)) return 'Elige el tipo de falla';
  }
  if(step === 'detalle'){
    if(!W.detalle.trim() && !pendingPhoto.base64) return 'Agrega una foto o escribe un detalle';
  }
  return '';
}

function wizNext(){
  wizSave();
  const steps = wizSteps();
  const step = steps[W.step];
  const err = wizValidate(step);
  if(err){ showToast(err); return; }
  if(W.step >= steps.length - 1){ wizSubmit(); return; }
  W.step++; wizRender();
  const m = document.querySelector('.modal'); if(m) m.scrollTop = 0;
}
function wizBack(){
  wizSave();
  if(W.step > 0){ W.step--; wizRender(); }
}

function wizRender(){
  if(W.done){ return wizRenderDone(); }
  const steps = wizSteps();
  const step = steps[W.step];
  const n = steps.length;
  const ctx = [];
  if(W.fixedLoc) ctx.push(`${W.torre} · Piso ${W.piso}`);
  if(W.fixedCat) ctx.push(`${catIcon(W.cat)} ${W.cat}`);
  if(W.opts && W.opts.catGroup) ctx.push('💧 Filtración');
  const prog = steps.map((_,i)=>`<i class="${i<=W.step?'on':''}"></i>`).join('');

  let body = '';
  if(step === 'ubic') body = wizStepUbic();
  else if(step === 'cat') body = wizStepCat();
  else if(step === 'foto') body = wizStepFoto();
  else body = wizStepDetalle();

  const isLast = W.step === n - 1;
  let nextLabel = isLast ? '✅ Reportar' : 'Siguiente ›';
  if(step === 'foto' && !pendingPhoto.base64) nextLabel = 'Omitir ›';
  const leftBtn = W.step === 0
    ? `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>`
    : `<button class="btn btn-ghost" onclick="wizBack()">‹ Atrás</button>`;

  showModal(`
    <h2>➕ Reportar falla</h2>
    <div class="sub">${ctx.length ? ctx.join(' · ') + ' — ' : ''}Paso ${W.step+1} de ${n}</div>
    <div class="wz-prog">${prog}</div>
    ${body}
    <div class="btn-row">
      ${leftBtn}
      <button class="btn btn-primary" id="wzNext" style="margin-top:0" onclick="wizNext()">${nextLabel}</button>
    </div>
  `);
}

function wizStepUbic(){
  const tipos = UBIC_TIPOS.map(u=>`<button class="wz-btn ${W.ubic===u.k?'sel':''}" onclick="wizPick('ubic','${u.k}')"><span class="ico">${u.ico}</span>${u.t}</button>`).join('');
  let extra = '';
  const torres = `<div class="wz-q2">Torre</div><div class="wz-grid four">${TORRES.map(t=>`<button class="wz-btn ${W.torre===t?'sel':''}" onclick="wizPick('torre','${t}')">${t.replace('Torre ','')}</button>`).join('')}</div>`;
  if(W.ubic === 'depto'){
    extra = torres + `
      <div class="wz-two">
        <div class="field"><label>N° depto</label><input type="text" id="wDepto" inputmode="numeric" placeholder="Ej: 1204" value="${esc(W.depto)}" oninput="wizDeptoInput(this.value)"></div>
        <div class="field"><label>Piso</label><input type="number" id="wPiso" placeholder="Ej: 12" value="${esc(W.piso)}" oninput="W.pisoTouched=true"></div>
      </div>`;
  } else if(W.ubic === 'ascensor' || W.ubic === 'acceso'){
    extra = torres;
  } else if(W.ubic === 'comun'){
    const zonas = wizZonas().map((z,zi)=>`<button class="wz-btn sm ${(!W.zonaOtra && W.zona===z)?'sel':''}" onclick="wizPickZona(${zi})"><span class="ico">${wizZonaIcon(z)}</span>${z}</button>`).join('');
    extra = `<div class="wz-q2">Zona</div><div class="wz-grid">${zonas}
      <button class="wz-btn sm ${W.zonaOtra?'sel':''}" onclick="wizToggle('zonaOtra')"><span class="ico">✏️</span>Otra…</button></div>
      ${W.zonaOtra ? `<div class="field"><input type="text" id="wZonaTxt" placeholder="Nombre de la zona" value="${esc(W.zonaTxt)}"></div>` : ''}
      ${(!W.zonaOtra && esZonaTorre(W.zona)) ? torres + (ZONAS_NIVEL.includes(W.zona) ? wizNivelChips(false) + (W.zona==='Bodega' ? `<div class="field"><label>N° de bodega (opcional)</label><input type="text" id="wBodega" placeholder="Ej: 124" value="${esc(W.bodega)}"></div>` : '') : `<div class="field"><label>Piso (opcional)</label><input type="number" id="wPiso" placeholder="Ej: 12" value="${esc(W.piso)}" oninput="W.pisoTouched=true"></div>`) : ''}
      ${(!W.zonaOtra && W.zona==='Estacionamiento') ? wizNivelChips(true) : ''}`;
  }
  return `<div class="wz-q">¿Dónde está la falla?</div><div class="wz-grid">${tipos}</div>${extra}`;
}

function wizNivelChips(opcional){
  return `<div class="wz-q2">Nivel ${opcional?'(opcional)':''}</div><div class="wz-grid three">${[-1,-2,-3].map(v=>`<button class="wz-btn ${String(W.piso)===String(v)?'sel':''}" onclick="wizPickNivel(${v})">${v}</button>`).join('')}</div>`;
}
function wizStepCat(){
  const grupo = W.opts && W.opts.catGroup === 'filtracion';
  const list = wizCatList();
  const chips = list.map((c,ci)=>`<button class="wz-btn sm ${(!W.catOtra && W.cat===c)?'sel':''}" onclick="wizPickCat(${ci})"><span class="ico">${catIcon(c)}</span>${c}</button>`).join('');
  return `<div class="wz-q">¿Qué tipo de falla es?</div>
    <div class="wz-hint">${grupo ? 'Elige el tipo de filtración' : (W.catAll ? 'Todos los tipos' : 'Más usadas')}</div>
    <div class="wz-grid">${chips}
      ${grupo ? '' : `<button class="wz-btn sm ${W.catOtra?'sel':''}" onclick="wizToggle('catOtra')"><span class="ico">✏️</span>Otra…</button>`}
    </div>
    ${W.catOtra ? `<div class="field"><input type="text" id="wCatTxt" placeholder="Nombre del nuevo tipo de falla" value="${esc(W.catTxt)}"></div>` : ''}
    ${grupo ? '' : `<button class="wz-link" onclick="wizToggle('catAll')">${W.catAll ? 'Ver menos ▴' : 'Ver todas ▾'}</button>`}`;
}

function wizStepFoto(){
  const has = !!pendingPhoto.base64;
  const src = has ? `data:${pendingPhoto.mime};base64,${pendingPhoto.base64}` : '';
  return `<div class="wz-q">Foto de la falla</div>
    <div class="wz-hint">Recomendada: ayuda a que mantención llegue directo al problema.</div>
    <input type="file" id="wCam" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoSelect(event)">
    <input type="file" id="wFile" accept="image/*" class="hidden" onchange="handlePhotoSelect(event)">
    <div class="wz-grid">
      <button class="wz-btn" onclick="document.getElementById('wCam').click()"><span class="ico">📷</span>Tomar foto</button>
      <button class="wz-btn" onclick="document.getElementById('wFile').click()"><span class="ico">🖼️</span>Elegir de archivos</button>
    </div>

}

function wizStepDetalle(){
  const r = wizResolve();
  return `<div class="wz-q">Detalle <span style="font-weight:400;color:var(--text-dim);font-size:.8rem">(opcional si hay foto)</span></div>
    <div class="field" style="margin-top:0"><textarea id="wDetalle" placeholder="Ej: Gotea sobre la ducha, se moja el piso">${W.detalle.replace(/</g,'&lt;')}</textarea></div>
    ${wizNivBlock()}
    ${W.ubic==='piso' ? `<div class="field"><label>Origen (depto / área, opcional)</label><input type="text" id="wOrigen" placeholder="Ej: Depto 1204" value="${esc(W.origenExtra)}"></div>` : ''}
    <div class="field"><label>Grupo (opcional)</label><input type="text" id="wGrupo" placeholder="Ej: Reclamo-Depto1204" value="${esc(W.grupo)}"></div>
    <div class="wz-summary">
      <div><b>Lugar:</b> ${wizUbicLabel()}</div>
      <div><b>Tipo:</b> ${catIcon(r.cat)} ${r.cat}</div>
      <div><b>Foto:</b> ${pendingPhoto.base64 ? 'sí ✓' : 'sin foto'}</div>
      <div><b>Prioridad:</b> ${PRIORIDADES[calcPrioridad(W.niv)].ico} ${PRIORIDADES[calcPrioridad(W.niv)].label}</div>
    </div>`;
}

function wizNivBlock(){
  const r = wizResolve();
  const sug = sugerirNiveles(r.cat, r.origen, r.torre);
  if(!W.niv) W.niv = { ...sug };
  ['gravedad','importancia','urgencia'].forEach(k=>{ if(!W.nivTouched[k]) W.niv[k] = sug[k]; });
  const P = PRIORIDADES[calcPrioridad(W.niv)];
  return `<div class="wz-q2" style="margin-top:12px">Prioridad</div>
    <div class="prio-box" style="--pc:${P.color}"><div class="prio-big">${P.ico} ${P.label}</div>
      <div class="prio-sub">Sugerida según tipo de falla y lugar. Ajústala si hace falta.</div></div>
    ${['gravedad','importancia','urgencia'].map(c=>`<div class="niv-row"><div class="niv-k">${NIV_LABEL[c]} <span>${NIV_HELP[c]}</span></div>${segHtml(c, W.niv[c], (cc,v)=>`wizNivel('${cc}','${v}')`, false)}</div>`).join('')}`;
}
function wizNivel(k, v){ wizSave(); W.niv[k] = v; W.nivTouched[k] = true; wizRender(); }

function wizSubmit(){
  const r = wizResolve();
  const btn = document.getElementById('wzNext');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando…'; }

  if(W.catOtra && r.cat && !STATE.categorias.includes(r.cat)){
    STATE.categorias.push(r.cat);
    const pl = { action:'addConfig', tipo:'categoria', valor:r.cat, ...userTag() };
    if(navigator.onLine){ apiPost(pl); } else { queueAdd(pl); }
  }
  if(W.ubic === 'comun' && W.zonaOtra && r.origen && !STATE.ubicaciones.includes(r.origen)){
    STATE.ubicaciones.push(r.origen);
    const pl = { action:'addConfig', tipo:'ubicacion', valor:r.origen, ...userTag() };
    if(navigator.onLine){ apiPost(pl); } else { queueAdd(pl); }
  }

  const det = W.detalle.trim();
  const urg = W.niv.urgencia === 'Inmediata';
  const tempFolio = 'TEMP-' + Date.now();
  const ts = new Date().toISOString().slice(0,16).replace('T',' ');
  STATE.items.push({
    Folio: tempFolio, Torre: r.torre, Piso: r.piso, Categoria: r.cat, Origen: r.origen, Grupo: W.grupo,
    Estado:'Nuevo', Detalle: det, Area_Derivacion:'', Codigo_Ubicacion:'',
    Fecha_Deteccion: ts, Fecha_Ultima_Actualizacion: ts, Fecha_Resolucion:'',
    Foto_Deteccion_URL:'', Foto_Resolucion_URL:'',
    Actualizado_Por: CURRENT_USER.nombre||'', Notas:'', Urgente: urg ? 'Sí' : '',
    Gravedad: W.niv.gravedad, Importancia: W.niv.importancia, Urgencia: W.niv.urgencia
  });
  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));

  const payload = { action:'add', torre:r.torre, piso:r.piso, categoria:r.cat, detalle:det, origen:r.origen, grupo:W.grupo, urgente:urg, gravedad:W.niv.gravedad, importancia:W.niv.importancia, urgencia:W.niv.urgencia, ...userTag() };
  if(pendingPhoto.base64){ payload.foto_base64 = pendingPhoto.base64; payload.foto_mime = pendingPhoto.mime; }

  const label = wizUbicLabel();
  const finish = (folio, queued)=>{
    W.done = { folio, queued, label, cat:r.cat, urgente:urg, prio:calcPrioridad(W.niv) };
    wizRender(); renderAll();
  };
  if(navigator.onLine){
    apiPost(payload).then(res=>{
      if(res.success){ finish(res.folio, false); loadData(); }
      else { queueAdd(payload); finish(null, true); }
    }).catch(()=>{ queueAdd(payload); finish(null, true); });
  } else { queueAdd(payload); finish(null, true); }
}

function wizRenderDone(){
  const d = W.done;
  showModal(`
    <div class="wz-done">
      <div class="wz-check">${d.queued ? '🕓' : '✓'}</div>
      <h2 style="margin:6px 0 2px">${d.queued ? 'Guardada en este equipo' : 'Falla reportada'}</h2>
      ${d.folio ? `<div class="wz-folio">${d.folio}</div>` : ''}
      <div class="wz-hint" style="margin-top:6px">${d.urgente?'🚨 ':''}${d.cat} · ${d.label}</div>
      <div style="margin-top:4px"><span class="prio-chip" style="--pc:${PRIORIDADES[d.prio].color}">${PRIORIDADES[d.prio].ico} Prioridad ${PRIORIDADES[d.prio].label}</span></div>
      ${d.queued ? '<div class="wz-hint">Sin señal o sin respuesta del servidor: se enviará sola al recuperar conexión.</div>' : '<div class="wz-hint">Quedó en estado <b>Nuevo</b>.</div>'}
    </div>
    <div class="action-list">
      <button class="btn btn-primary" style="margin-top:0" onclick="wizAnother()">➕ Otra falla en el mismo lugar</button>
      <button class="btn btn-ghost" onclick="openReportWizard(W.opts)">📍 Reportar en otro lugar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
    </div>
  `);
}
function wizAnother(){
  pendingPhoto = { base64:null, mime:null };
  W.done = null; W.sending = false;
  W.detalle = ''; W.niv = null; W.nivTouched = {}; W.grupo = ''; W.origenExtra = '';
  if(!W.fixedCat){ W.cat = ''; W.catOtra = false; W.catTxt = ''; }
  W.step = W.fixedLoc ? 0 : 1;
  wizRender();
}

/* ================= DEPTOS Y COMUNES (genérico: cualquier tipo de falla, cualquier ubicación) ================= */
function deptoItems(){
  return STATE.items.filter(i=>{
    const esFiltracion = esFiltracionCat(i.Categoria);
    if(esFiltracion) return false; // esas viven en la pestaña Filtraciones
    const origen = String(i.Origen||'').trim().toLowerCase();
    const esDepto = origen.startsWith('depto');
    const esAscensorOAcceso = origen==='ascensor' || origen==='acceso principal';
    const esComun = i.Torre === 'Común';
    const esZonaDeTorre = ZONAS_TORRE.some(z=>origen.startsWith(z.toLowerCase()));
    return esDepto || esAscensorOAcceso || esComun || esZonaDeTorre;
  });
}

/* ================= MODAL GENÉRICO ================= */
function showModal(innerHtml){
  if(!activeModalBg){
    activeModalBg = document.createElement('div');
    activeModalBg.className = 'modal-bg';
    activeModalBg.onclick = (e)=>{ if(e.target===activeModalBg) closeModal(); };
    document.body.appendChild(activeModalBg);
  }
  activeModalBg.innerHTML = `<div class="modal">${innerHtml}</div>`;
}
function closeModal(){
  if(activeModalBg){ activeModalBg.remove(); activeModalBg=null; }
  pendingPhoto = { base64:null, mime:null };
}

/* ================= DETALLE DE ÍTEM ================= */
function openItemModal(folio){
  const item = STATE.items.find(x=>x.Folio===folio);
  if(!item) return;
  showModal(itemDetailHtml(item));
}

function esUrgente(item){ return item.Urgente === 'Sí' || item.Urgente === true; }
function esSeguimiento(item){ return item.Seguimiento === 'Sí' || item.Seguimiento === true; }

function ultimoMotivo(item){
  const entries = STATE.bitacora.filter(b=>b.Folio===item.Folio).slice().sort((a,b)=>(b.Fecha_Hora||'').localeCompare(a.Fecha_Hora||''));
  return entries.length ? entries[0].Motivo : '';
}
function fueRevertidoAutomatico(item){ return ultimoMotivo(item) === 'Reversión automática'; }
function fueAutoMarcadoUrgente(item){ return ultimoMotivo(item) === 'Auto-marcado urgente'; }

function itemDetailHtml(item){
  const est = item.Estado || 'Sin revisar';
  const color = ESTADO_COLORS[est] || '#8A8A80';
  const transiciones = TRANSICIONES[est] || [];
  const diasDetTxt = item.Fecha_Deteccion ? (diasEntre(item.Fecha_Deteccion) + ' días desde detección') : '';
  const diasResTxt = (item.Fecha_Deteccion && item.Fecha_Resolucion) ? ('Resuelto en ' + diasEntre(item.Fecha_Deteccion, item.Fecha_Resolucion) + ' días') : '';
  const urgente = esUrgente(item);
  const seguimiento = esSeguimiento(item);

  let photos = '';
  if(item.Foto_Deteccion_URL || item.Foto_Resolucion_URL){
    photos = '<div class="photo-row">';
    if(item.Foto_Deteccion_URL) photos += `<img class="photo-thumb" src="${item.Foto_Deteccion_URL}" onclick="window.open('${item.Foto_Deteccion_URL}','_blank')" title="Foto detección">`;
    if(item.Foto_Resolucion_URL) photos += `<img class="photo-thumb" src="${item.Foto_Resolucion_URL}" onclick="window.open('${item.Foto_Resolucion_URL}','_blank')" title="Foto resolución">`;
    photos += '</div>';
  }

  const actions = transiciones.map(t=>
    `<button class="btn btn-primary btn-sm" style="background:${ESTADO_COLORS[t.to]}" onclick="showTransitionForm('${item.Folio}','${esc(t.label)}','${t.to}','${t.code}',${t.needsArea?1:0},${t.needsDetalle?1:0},${t.requiereMotivo?1:0})">${t.label}</button>`
  ).join('');

  const notas = STATE.bitacora.filter(b=>b.Folio===item.Folio && (b.Nota || b.Foto_URL)).slice().sort((a,b)=>(b.Fecha_Hora||'').localeCompare(a.Fecha_Hora||''));
  const notasHtml = notas.length ? notas.map(n=>`
      <div class="bit-entry">
        <div class="bit-date">${n.Fecha_Hora} · ${n.Autor||'—'}</div>
        ${n.Nota ? `<div>${n.Nota}</div>` : ''}
        ${n.Foto_URL ? `<img class="photo-thumb" style="margin-top:6px" src="${n.Foto_URL}" onclick="window.open('${n.Foto_URL}','_blank')">` : ''}
      </div>`).join('') : '<div class="empty-note" style="padding:10px 0">Sin notas o comentarios todavía.</div>';

  let urgenteBadge = '';
  if(urgente){
    urgenteBadge = fueAutoMarcadoUrgente(item)
      ? `<span class="badge" style="background:#C1544B22;color:#C1544B;border:1px solid #C1544B;margin-left:6px">⚠ Sin atención (2h)</span>`
      : `<span class="badge" style="background:#C1544B22;color:#C1544B;border:1px solid #C1544B;margin-left:6px">🚨 Urgente</span>`;
  }

  return `
    <h2>${urgente?'🚨 ':''}${item.Categoria} <span class="folio-tag">${item.Folio}</span></h2>
    <div class="sub">${item.Torre} · ${item.Piso<=-1?'Subterráneo ':'Piso '}${item.Piso}</div>
    <span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}">${est}</span>
    ${urgenteBadge}
    ${seguimiento ? `<span class="badge" style="background:#2F6FA822;color:#2F6FA8;border:1px solid #2F6FA8;margin-left:6px">📌 Seguimiento</span>` : ''}
    ${fueRevertidoAutomatico(item) ? `<span class="badge" style="background:#B7791F22;color:#B7791F;border:1px solid #B7791F;margin-left:6px">🔁 Reabierto automático (3h sin gestión)</span>` : ''}
    <div style="margin-top:12px; font-size:.88rem; line-height:1.4;">${item.Detalle || '<span style="color:var(--text-dim)">Sin detalle registrado</span>'}</div>
    ${photos}
    <div class="kv"><div class="k">Origen</div><div>${item.Origen || '—'}</div></div>
    <div class="kv"><div class="k">Grupo</div><div>${item.Grupo || '—'}</div></div>
    <div class="kv"><div class="k">Área derivada</div><div>${item.Area_Derivacion || '—'}</div></div>
    <div class="kv"><div class="k">Detectado</div><div>${item.Fecha_Deteccion || '—'} ${diasDetTxt && est!=='Resuelto' ? '('+diasEntre(item.Fecha_Deteccion)+'d)' : ''}</div></div>
    ${diasResTxt ? `<div class="kv"><div class="k">Resolución</div><div>${diasResTxt}</div></div>` : ''}
    <div class="kv"><div class="k">Última actualización</div><div>${item.Fecha_Ultima_Actualizacion || '—'} · ${item.Actualizado_Por||'—'}</div></div>

    ${nivelesBlockHtml(item)}

    <div class="section-label">Notas y comentarios</div>
    ${notasHtml}
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="openAddPhotoForm('${item.Folio}')">📷 Agregar foto</button>

    <div class="action-list">${actions}</div>

    <div class="btn-row" style="margin-top:10px">
      <button class="btn ${urgente?'btn-danger':'btn-ghost'} btn-sm" onclick="toggleUrgente('${item.Folio}')">${urgente ? '✓ Quitar urgencia' : '🚨 Urgente'}</button>
      <button class="btn ${seguimiento?'btn-danger':'btn-ghost'} btn-sm" onclick="toggleSeguimiento('${item.Folio}')">${seguimiento ? '✓ Seguimiento hecho' : '📌 Seguimiento'}</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost btn-sm" onclick="showEditFieldsForm('${item.Folio}')">Editar datos</button>
      <button class="btn btn-ghost btn-sm" onclick="showBitacora('${item.Folio}')">Ver historial completo</button>
    </div>
    <button class="btn btn-danger btn-sm" style="width:100%;margin-top:8px" onclick="deleteItemUI('${item.Folio}')">Eliminar ítem</button>
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="closeModal()">Cerrar</button>
  `;
}

function toggleUrgente(folio){
  const item = STATE.items.find(x=>x.Folio===folio);
  if(!item) return;
  const nuevo = !esUrgente(item);
  item.Urgente = nuevo ? 'Sí' : '';
  if(nuevo) item.Urgencia = 'Inmediata'; else if(item.Urgencia === 'Inmediata') item.Urgencia = '';
  item.Fecha_Ultima_Actualizacion = new Date().toISOString().slice(0,16).replace('T',' ');
  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));

  const payload = { action:'updateFields', folio, urgente: nuevo, soloUrgente:true, ...userTag() };
  if(navigator.onLine){
    apiPost(payload).then(res=>{ showToast(res.success ? (nuevo?'Marcado como urgente':'Urgencia quitada') : 'No se pudo guardar en el servidor'); });
  } else {
    queueAdd(payload); showToast('Sin conexión: guardado localmente');
  }
  openItemModal(folio);
  renderAll();
}

function toggleSeguimiento(folio){
  const item = STATE.items.find(x=>x.Folio===folio);
  if(!item) return;
  const nuevo = !esSeguimiento(item);
  item.Seguimiento = nuevo ? 'Sí' : '';
  item.Fecha_Ultima_Actualizacion = new Date().toISOString().slice(0,16).replace('T',' ');
  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));

  const payload = { action:'updateFields', folio, seguimiento: nuevo, soloSeguimiento:true, ...userTag() };
  if(navigator.onLine){
    apiPost(payload).then(res=>{ showToast(res.success ? (nuevo?'Marcado para seguimiento':'Seguimiento quitado') : 'No se pudo guardar en el servidor'); });
  } else {
    queueAdd(payload); showToast('Sin conexión: guardado localmente');
  }
  openItemModal(folio);
  renderAll();
}

/* ================= AGREGAR FOTO POSTERIOR ================= */
function openAddPhotoForm(folio){
  pendingPhoto = { base64:null, mime:null };
  showModal(`
    <h2>📷 Agregar foto</h2>
    <div class="sub">${folio}</div>

function handlePhotoSelect(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 1280;
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      pendingPhoto.base64 = dataUrl.split(',')[1];
      pendingPhoto.mime = 'image/jpeg';
      const prev = document.getElementById('photoPreview');
      if(prev){ prev.src = dataUrl; prev.classList.remove('hidden'); }
      if(typeof wizPhotoDone==='function') wizPhotoDone();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function confirmTransition(folio, to, code, needsArea, needsDetalle, requiereMotivo){
  const item = STATE.items.find(x=>x.Folio===folio);
  let motivo = selectedMotivo === '__otro__' ? (document.getElementById('tMotivoCustom').value.trim()) : selectedMotivo;
  const nota = document.getElementById('tNota').value.trim();
  const detalle = needsDetalle ? document.getElementById('tDetalle').value.trim() : undefined;
  const area = needsArea ? document.getElementById('tArea').value : undefined;

  if(needsDetalle && !detalle){ showToast('Escribe el detalle de la falla'); return; }
  if(needsArea && !area){ showToast('Selecciona un área de derivación'); return; }
  if(requiereMotivo && !motivo){ showToast('Debes indicar un motivo para cerrar este reporte'); return; }
  const seguimientoEl = document.getElementById('tSeguimiento');
  const seguimiento = seguimientoEl ? seguimientoEl.checked : false;

  const ts = new Date().toISOString().slice(0,16).replace('T',' ');
  item.Estado = to;
  if(detalle) item.Detalle = detalle;
  if(area !== undefined) item.Area_Derivacion = area;
  if(seguimiento) item.Seguimiento = 'Sí';
  item.Fecha_Ultima_Actualizacion = ts;
  item.Actualizado_Por = CURRENT_USER.nombre || item.Actualizado_Por;
  if(to === 'Resuelto') item.Fecha_Resolucion = ts;
  if(to === 'Pendiente' || to === 'Nuevo') item.Fecha_Resolucion = '';
  localStorage.setItem('mant_cache', JSON.stringify({checklist:STATE.items, bitacora:STATE.bitacora, categorias:STATE.categorias, derivaciones:STATE.derivaciones, motivos:STATE.motivos, ubicaciones:STATE.ubicaciones}));

  // Feedback inmediato: reabre el detalle del ítem ya en su nuevo estado,
  // para poder seguir encadenando la siguiente acción sin volver a la lista.
  renderAll();
  openItemModal(folio);

  const payload = { action:'transition', folio, estado_nuevo:to, motivo, nota, ...userTag() };
  if(area !== undefined) payload.area_derivacion = area;
  if(detalle) payload.detalle = detalle;
  if(seguimiento) payload.seguimiento = true;
  if(pendingPhoto.base64){ payload.foto_base64 = pendingPhoto.base64; payload.foto_mime = pendingPhoto.mime; }

  if(navigator.onLine){
    apiPost(payload).then(res=>{
      if(res.success){ showToast('Actualizado ✓'); loadData(); }
      else { showToast('No se pudo guardar en el servidor'); queueAdd(payload); }
    }).catch(()=>{ queueAdd(payload); showToast('Guardado localmente, se enviará al recuperar señal'); });
  } else {
    queueAdd(payload); showToast('Sin conexión: guardado localmente');
  }
}

/* ---- Estilo ejecutivo compartido entre los PDF ---- */
const PDF_NAVY = [31, 42, 68];      // encabezados de sección
const PDF_NAVY_TXT = [255,255,255];
const PDF_GRAY = [110, 120, 130];   // texto secundario
const PDF_LINE = [215, 220, 225];
function pdfHeaderBand(doc, title, marginX, pageW){
  doc.setFillColor(...PDF_NAVY);
  doc.rect(0, 0, pageW, 62, 'F');
  doc.setTextColor(...PDF_NAVY_TXT);
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text(title, marginX, 30);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text(COMUNIDAD, marginX, 46);
  doc.setTextColor(0);
}
function pdfMeta(doc, marginX, y, pageW, lines){
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...PDF_GRAY);
  const rightText = 'Generado: ' + new Date().toLocaleString('es-CL');
  doc.text(rightText, pageW-marginX, 78, {align:'right'});
  lines.forEach((l,idx)=>{ doc.text(l, marginX, 78+idx*13); });
  doc.setTextColor(0);
  return 78 + Math.max(lines.length,1)*13 + 6;
}
function pdfKpiRow(doc, marginX, y, pageW, kpis){
  const gap = 8;
  const boxW = (pageW - marginX*2 - gap*(kpis.length-1)) / kpis.length;
  kpis.forEach((k,idx)=>{
    const x = marginX + idx*(boxW+gap);
    doc.setDrawColor(...PDF_LINE); doc.setFillColor(247,248,249);
    doc.roundedRect(x, y, boxW, 40, 3, 3, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...(k.color||PDF_NAVY));
    doc.text(String(k.value), x+boxW/2, y+21, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_GRAY);
    doc.text(k.label, x+boxW/2, y+33, {align:'center'});
  });
  doc.setTextColor(0);
  return y + 40 + 16;
}
function pdfFooterPages(doc, marginX, pageW, pageH){
  const n = doc.internal.getNumberOfPages();
  for(let p=1;p<=n;p++){
    doc.setPage(p);
    doc.setDrawColor(...PDF_LINE); doc.line(marginX, pageH-30, pageW-marginX, pageH-30);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...PDF_GRAY);
    doc.text(COMUNIDAD, marginX, pageH-18);
    doc.text('Página ' + p + ' de ' + n, pageW-marginX, pageH-18, {align:'right'});
    doc.setTextColor(0);
  }
}

function infBase(tipo){
  if(tipo==='filtraciones') return fugaItems();
  if(tipo==='deptos') return deptoItems();
  return STATE.items;
}
function infDefaults(tipo){
  const hoy = new Date().toISOString().slice(0,10);
  const hace30 = new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  return {
    tipo, torres:[...TORRES_ALL],
    estados: tipo==='resumen' ? ALL_ESTADOS.filter(e=>e!=='Sin revisar') : [...ACTIVE_STATES],
    categoria:'', area:'', grupo:'', piso:'', prios:[], solo:'', desde:hace30, hasta:hoy
  };
}
function ensureInfState(){ if(!STATE.inf) STATE.inf = infDefaults('activas'); }
function goInformes(){ STATE.view='informes'; renderTabs(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function selectInformes(tipo){
  if(!(CURRENT_USER && CURRENT_USER.rol==='Admin')) return;
  if(tipo==='plan'){ selectPlan(); return; }
  ensureInfState();
  if(tipo && tipo!==STATE.inf.tipo) STATE.inf = infDefaults(tipo);

function infSetTipo(t){

function informeDesdeModulo(kind){
  const c = MOD_CFG[kind], f = c.st();
  STATE.inf = infDefaults(c.inf);
  if(f.torre) STATE.inf.torres = [f.torre];
  if(c.cats && f.categoria) STATE.inf.categoria = f.categoria;
  STATE.inf.estados = f.ver==='resueltas' ? [...CERRADOS_MOD] : (f.ver==='todas' ? [...ACTIVE_STATES, ...CERRADOS_MOD] : [...ACTIVE_STATES]);
  if(f.filtro==='urg') STATE.inf.solo = 'urg';

  Object.assign(STATE.inf, { torres:[...d.torres], estados:[...d.estados], categoria:d.categoria, area:d.area, grupo:d.grupo, piso:d.piso, solo:d.soloSeguimiento?'seg':'' });
  goInformes();

function infItems(){
  const f = STATE.inf;
  let from = null, to = null;
  if(f.tipo==='gestion'){ from = new Date(f.desde+'T00:00:00'); to = new Date(f.hasta+'T23:59:59'); }
  const g = (f.grupo||'').toLowerCase();
  return infBase(f.tipo).filter(i=>{
    if(!f.torres.includes(i.Torre || 'Común')) return false;
    if(f.tipo==='gestion'){
      if(i.Estado!=='Resuelto' || !i.Fecha_Resolucion) return false;
      const fr = parseFH(i.Fecha_Resolucion);
      if(!fr || fr < from || fr > to) return false;
    } else if(!f.estados.includes(i.Estado || 'Sin revisar')) return false;
    if(f.categoria && i.Categoria!==f.categoria) return false;
    if(f.area && i.Area_Derivacion!==f.area) return false;
    if(g && !String(i.Grupo||'').toLowerCase().includes(g)) return false;
    if(f.piso!=='' && f.piso!==undefined && String(i.Piso)!==String(f.piso)) return false;
    if(f.prios.length){ const p = prioridadDe(i); if(!p || !f.prios.includes(p)) return false; }
    if(f.solo==='urg' && !esUrgente(i)) return false;
    if(f.solo==='seg' && !esSeguimiento(i)) return false;
    if(f.solo==='stale' && !isStale(i)) return false;
    return true;
  });
}
function infFiltroLineas(){
  const f = STATE.inf, out = [];
  out.push('Torres: ' + (f.torres.length===TORRES_ALL.length ? 'todas' : f.torres.join(', ')));
  if(f.tipo==='gestion') out.push('Período: ' + f.desde + ' a ' + f.hasta + ' (fallas resueltas)');
  else out.push('Estados: ' + (f.estados.length===ALL_ESTADOS.length ? 'todos' : f.estados.join(', ')));
  const extra = [];
  if(f.categoria) extra.push('Tipo: ' + f.categoria);
  if(f.area) extra.push('Área: ' + f.area);
  if(f.grupo) extra.push('Grupo: ' + f.grupo);
  if(f.piso!=='' && f.piso!==undefined) extra.push('Piso: ' + f.piso);
  if(f.prios.length) extra.push('Prioridad: ' + f.prios.map(k=>PRIORIDADES[k].label).join(', '));
  if(f.solo==='urg') extra.push('Solo urgentes');
  if(f.solo==='seg') extra.push('Solo con seguimiento');
  if(f.solo==='stale') extra.push('Solo sin movimiento (2 días o más)');
  if(extra.length) out.push(extra.join(' · '));
  return out;
}

  else { arr.push(val); el.classList.add('selected'); }

}
function infTogglePrio(k, el){
  const arr = STATE.inf.prios, idx = arr.indexOf(k);
  if(idx>=0){ arr.splice(idx,1); el.classList.remove('selected'); } else { arr.push(k); el.classList.add('selected'); }

}
function infSet(key, val, noRender){

function infReset(){

/* ---- Utilidades de informes ---- */
function infCantidades(items){
  const map = {};
  items.forEach(i=>{
    const c = i.Categoria || 'OTROS', t = i.Torre || 'Común';
    if(!map[c]) map[c] = { total:0, por:{} };
    map[c].total++; map[c].por[t] = (map[c].por[t]||0) + 1;
  });
  return Object.entries(map).sort((a,b)=>b[1].total-a[1].total);
}
function lugarCorto(i){
  const p = i.Piso;
  const hayPiso = !(p===0 || p===undefined || p==='' || isNaN(p));
  if(hayPiso) return p<=-1 ? 'Subt. '+p : 'P'+p;
  return i.Origen || 'Sin piso';
}
function lugarLargo(i, conTorre){
  const p = i.Piso;
  const pisoTxt = (p===0 || p===undefined || p==='' || isNaN(p)) ? '' : (p<=-1 ? 'Subt. '+p : 'P'+p);
  return [conTorre ? i.Torre : '', pisoTxt, i.Origen].filter(Boolean).join(' · ');
}
// "P3 (2), P7, P12 (3)" ordenado de piso alto a bajo
function pisosResumen(list){
  const m = {};
  list.forEach(i=>{ const k = lugarCorto(i); if(!m[k]) m[k] = { n:0, ord: (typeof i.Piso==='number' && !isNaN(i.Piso)) ? i.Piso : -99 }; m[k].n++; });
  return Object.entries(m).sort((a,b)=>b[1].ord-a[1].ord || a[0].localeCompare(b[0]))
    .map(([k,v])=>k + (v.n>1 ? ' ('+v.n+')' : '')).join(', ');
}
function prioTxt(i){ const p = prioridadDe(i); return p ? PRIORIDADES[p].label : '—'; }
function infSlug(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,''); }
function infGroupKey(i, mode){
  if(mode==='area') return i.Area_Derivacion || 'Sin área asignada';
  if(mode==='tipo') return i.Categoria || 'OTROS';
  return i.Torre || 'Común';
}
function infGroupSort(keys, mode){
  if(mode==='torre') return keys.sort((a,b)=>{ const f = t=>{ const x = TORRES_ALL.indexOf(t); return x===-1?99:x; }; return f(a)-f(b); });
  return keys.sort((a,b)=> (a==='Sin área asignada') - (b==='Sin área asignada') || a.localeCompare(b));
}

/* ================= PDF EJECUTIVO UNIFICADO ================= */
function buildPdfInforme(items){
  const f = STATE.inf, T = INF_TIPOS[f.tipo];
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const marginX = 36;
  const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();
  const hexRgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const torresVis = TORRES_ALL.filter(t=>items.some(i=>(i.Torre||'Común')===t));

  pdfHeaderBand(doc, T.titulo, marginX, pageW);
  let y = pdfMeta(doc, marginX, 78, pageW, infFiltroLineas());

  // ---- KPIs
  const act = items.filter(i=>prioridadDe(i)!==null);
  if(f.tipo==='gestion'){
    const dias = items.map(i=>diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion)).filter(x=>x!==null);
    const prom = dias.length ? (dias.reduce((s,x)=>s+x,0)/dias.length).toFixed(1) : '—';
    y = pdfKpiRow(doc, marginX, y+4, pageW, [
      { label:'Fallas resueltas', value: items.length, color:[63,125,107] },
      { label:'Días promedio', value: prom },
      { label:'Áreas', value: new Set(items.map(i=>i.Area_Derivacion||'Sin área')).size },
      { label:'Torres / áreas', value: torresVis.length }
    ]);
  } else {
    y = pdfKpiRow(doc, marginX, y+4, pageW, [
      { label:'Total ítems', value: items.length },
      { label:'Urgentes', value: items.filter(i=>esUrgente(i) && !esCerradaMod(i)).length, color:[193,84,75] },
      { label:'Críticas + altas', value: act.filter(i=>['critica','alta'].includes(prioridadDe(i))).length, color:hexRgb(PRIORIDADES.alta.color) },
      { label:'Atrasadas', value: act.filter(isAtrasada).length, color:[207,106,31] },
      { label:'Con seguimiento', value: items.filter(esSeguimiento).length, color:[47,111,168] }
    ]);
  }

  const secTitle = (txt) => {
    if(y > pageH - 110){ doc.addPage(); y = 50; }
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...PDF_NAVY);
    doc.text(txt, marginX, y); doc.setTextColor(0); y += 6;
  };
  const headStyles = { fillColor:PDF_NAVY, textColor:255, fontStyle:'bold', fontSize:8 };
  const baseStyles = { font:'helvetica', fontSize:8, cellPadding:4, overflow:'linebreak', valign:'middle', lineColor:PDF_LINE, lineWidth:0.3 };
  const estadoColor = (data, col) => {
    if(data.section==='body' && data.column.index===col && typeof data.cell.raw==='string'){
      data.cell.styles.textColor = ESTADO_RGB[data.cell.raw] || [0,0,0]; data.cell.styles.fontStyle = 'bold';
    }
  };
  const countTable = (titulo, entries, total) => {
    if(!entries.length) return;
    secTitle(titulo);
    doc.autoTable({
      startY: y, margin:{ left:marginX, right:marginX, bottom:40 }, tableWidth: 300,
      head:[['','Cantidad','%']],
      body: entries.map(([k,v])=>[k, v, total ? Math.round(v/total*100)+'%' : '']),
      theme:'grid', styles:{ ...baseStyles, halign:'center' }, headStyles,
      columnStyles:{ 0:{halign:'left', cellWidth:170} }
    });
    y = doc.lastAutoTable.finalY + 16;
  };

  // ---- Semáforo (resumen)
  if(f.tipo==='resumen'){
    secTitle('Semáforo de gestión por torre y áreas comunes');
    doc.autoTable({
      startY: y, margin:{ left:marginX, right:marginX, bottom:40 },
      head:[['Unidad','Nivel','Activas','Críticas','Altas','Atrasadas','Resueltas 30 días']],
      body: SEMAFORO_UNIDADES.map(u=>{ const s = semaforoUnidad(u); return [u==='Común'?'Áreas comunes':u, SEMAFORO[s.nivel].label, s.activas, s.crit, s.alta, s.atras, s.resueltas30]; }),
      theme:'grid', styles:{ ...baseStyles, halign:'center' }, headStyles, columnStyles:{ 0:{halign:'left', cellWidth:110} },
      didParseCell:(data)=>{
        if(data.section==='body' && data.column.index===1){
          const k = String(data.cell.raw).toLowerCase();
          const col = (SEMAFORO[k] && SEMAFORO[k].color) ? hexRgb(SEMAFORO[k].color) : null;
          if(col){ data.cell.styles.fillColor = col; data.cell.styles.textColor = 255; data.cell.styles.fontStyle = 'bold'; }
        }
      }
    });
    y = doc.lastAutoTable.finalY + 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_GRAY);
    doc.text('El semáforo considera todas las fallas activas de cada unidad, sin los filtros del informe.', marginX, y + 8);
    doc.setTextColor(0); y += 24;
  }

  // ---- Cantidad por tipo de falla y torre (todos menos gestión)
  if(f.tipo!=='gestion'){
    secTitle('Cantidad por tipo de falla y torre');
    const cant = infCantidades(items);
    const body = cant.map(([c,v])=>[c, v.total, ...torresVis.map(t=>v.por[t]||'')]);
    body.push([{ content:'TOTAL', styles:{ fontStyle:'bold' } }, { content:items.length, styles:{ fontStyle:'bold' } }, ...torresVis.map(t=>({ content: items.filter(i=>(i.Torre||'Común')===t).length, styles:{ fontStyle:'bold' } }))]);
    doc.autoTable({
      startY: y, margin:{ left:marginX, right:marginX, bottom:40 },
      head:[['Tipo de falla','Total', ...torresVis.map(t=>t==='Común'?'Comunes':t.replace('Torre ','T. '))]],
      body, theme:'grid', styles:{ ...baseStyles, halign:'center' }, headStyles,
      columnStyles:{ 0:{halign:'left', cellWidth:170}, 1:{fontStyle:'bold'} }
    });
    y = doc.lastAutoTable.finalY + 18;
  }

  // ---- POR TIPO DE FALLA: dónde está cada una
  if(f.tipo==='tipo'){
    secTitle('Detalle por tipo de falla: en qué torre y piso está');
    const body = [];
    infCantidades(items).forEach(([cat, v])=>{
      body.push([{ content: cat + '  —  ' + v.total + (v.total===1?' falla':' fallas'), colSpan:4, styles:{ fillColor:PDF_NAVY, textColor:255, fontStyle:'bold', fontSize:8.5 } }]);
      torresVis.forEach(t=>{
        const lst = items.filter(i=>(i.Categoria||'OTROS')===cat && (i.Torre||'Común')===t);
        if(!lst.length) return;
        lst.sort((a,b)=>(b.Piso||0)-(a.Piso||0));
        body.push([t==='Común'?'Comunes':t, lst.length, pisosResumen(lst), lst.map(i=>(esUrgente(i)?'URG ':'')+i.Folio).join(', ')]);
      });
    });
    doc.autoTable({
      startY: y, margin:{ left:marginX, right:marginX, bottom:40 },
      head:[['Torre','Cant.','Pisos / lugares','Folios']],
      body, theme:'plain', styles:{ ...baseStyles, fontSize:7.5 }, headStyles,
      columnStyles:{ 0:{cellWidth:62, fontStyle:'bold'}, 1:{cellWidth:32, halign:'center'}, 2:{cellWidth:'auto'}, 3:{cellWidth:150, textColor:PDF_GRAY} }
    });
    y = doc.lastAutoTable.finalY + 20;
  }

  // ---- GESTIÓN: resumen por área
  if(f.tipo==='gestion'){
    secTitle('Resumen por área responsable');
    const areas = [...new Set(items.map(i=>i.Area_Derivacion || 'Sin área asignada'))];
    let tD = 0, tN = 0;
    const rows = areas.map(a=>{
      const lst = items.filter(i=>(i.Area_Derivacion||'Sin área asignada')===a);
      const d = lst.map(i=>diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion)).filter(x=>x!==null);
      tD += d.reduce((s,x)=>s+x,0); tN += d.length;
      return [a, lst.length, d.length ? (d.reduce((s,x)=>s+x,0)/d.length).toFixed(1) : '—', d.length ? Math.max(...d) : '—'];
    }).sort((a,b)=>b[1]-a[1]);
    rows.push([{ content:'GENERAL', styles:{ fontStyle:'bold' } }, { content:items.length, styles:{ fontStyle:'bold' } }, { content: tN ? (tD/tN).toFixed(1) : '—', styles:{ fontStyle:'bold' } }, '']);
    doc.autoTable({
      startY: y, margin:{ left:marginX, right:marginX, bottom:40 }, tableWidth: 360,
      head:[['Área','Resueltas','Prom. días','Más lenta (días)']],
      body: rows, theme:'grid', styles:{ ...baseStyles, halign:'center' }, headStyles, columnStyles:{ 0:{halign:'left', cellWidth:150} }
    });
    y = doc.lastAutoTable.finalY + 18;
  }

  // ---- RESUMEN: tablas de conteo + lo más urgente
  if(f.tipo==='resumen'){
    countTable('Por prioridad (fallas activas)', Object.keys(PRIORIDADES).map(k=>[PRIORIDADES[k].label, act.filter(i=>prioridadDe(i)===k).length]).filter(e=>e[1]>0), act.length);
    countTable('Por estado', countBy(items, i=>i.Estado||'Sin revisar'), items.length);
    countTable('Por área responsable', countBy(items.filter(i=>i.Area_Derivacion), i=>i.Area_Derivacion), items.filter(i=>i.Area_Derivacion).length);
    const urgTop = act.filter(i=>['critica','alta'].includes(prioridadDe(i))).sort(cmpPrioridad).slice(0,15);
    if(urgTop.length){
      secTitle('Lo más urgente (críticas y altas, máx. 15)');
      doc.autoTable({
        startY: y, margin:{ left:marginX, right:marginX, bottom:40 },
        head:[['Folio','Lugar','Tipo','Detalle','Prioridad','Días']],
        body: urgTop.map(i=>[(esUrgente(i)?'URG ':'')+i.Folio, lugarLargo(i,true), i.Categoria, i.Detalle||'—', prioTxt(i), diasEntre(i.Fecha_Deteccion) ?? '—']),
        theme:'plain', styles:{ ...baseStyles, fontSize:7.5 }, headStyles,
        columnStyles:{ 0:{cellWidth:56}, 1:{cellWidth:96}, 2:{cellWidth:72}, 3:{cellWidth:'auto'}, 4:{cellWidth:48}, 5:{cellWidth:30, halign:'center'} }
      });
      y = doc.lastAutoTable.finalY + 18;
    }
  }

  // ---- LISTADO agrupado (activas, filtraciones, deptos, gestión)
  if(['activas','filtraciones','deptos','gestion'].includes(f.tipo)){
    const mode = T.group;
    secTitle('Detalle' + (mode==='area' ? ' por área responsable' : ' por torre'));
    const groups = {};
    items.forEach(i=>{ const k = infGroupKey(i, mode); (groups[k] = groups[k] || []).push(i); });
    const keys = infGroupSort(Object.keys(groups), mode);
    const ncol = f.tipo==='gestion' ? 7 : 7;
    const body = [];
    keys.forEach(k=>{
      const lst = groups[k];
      lst.sort(f.tipo==='gestion'
        ? (a,b)=>(a.Fecha_Resolucion||'').localeCompare(b.Fecha_Resolucion||'')
        : (a,b)=>cmpPrioridad(a,b) || ((b.Piso||0)-(a.Piso||0)));
      body.push([{ content: (k==='Común'?'Áreas comunes':k) + '  (' + lst.length + ')', colSpan:ncol, styles:{ fillColor:[232,236,240], textColor:PDF_NAVY, fontStyle:'bold', fontSize:8.5 } }]);
      lst.forEach(i=>{
        if(f.tipo==='gestion'){
          body.push([i.Folio, lugarLargo(i, mode!=='torre'), i.Categoria, i.Detalle||'—', (i.Fecha_Deteccion||'').slice(0,10), (i.Fecha_Resolucion||'').slice(0,10), diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion) ?? '—']);
        } else {
          const cerrada = esCerradaMod(i);
          body.push([(esUrgente(i)&&!cerrada?'URG ':'')+i.Folio, lugarLargo(i, mode!=='torre'), i.Categoria, i.Detalle||'—', prioTxt(i), i.Estado||'Sin revisar', (cerrada ? diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion) : diasEntre(i.Fecha_Deteccion)) ?? '—']);
        }
      });
    });
    doc.autoTable({
      startY: y, margin:{ left:marginX, right:marginX, bottom:40 },
      head: [f.tipo==='gestion'
        ? ['Folio','Lugar','Tipo','Detalle','Detectada','Resuelta','Días']
        : ['Folio','Lugar','Tipo','Detalle','Prioridad','Estado','Días']],
      body, theme:'plain', styles:{ ...baseStyles, fontSize:7.5 }, headStyles,
      columnStyles: f.tipo==='gestion'
        ? { 0:{cellWidth:54}, 1:{cellWidth:92}, 2:{cellWidth:72}, 3:{cellWidth:'auto'}, 4:{cellWidth:50}, 5:{cellWidth:50}, 6:{cellWidth:28, halign:'center'} }
        : { 0:{cellWidth:56}, 1:{cellWidth:92}, 2:{cellWidth:72}, 3:{cellWidth:'auto'}, 4:{cellWidth:46}, 5:{cellWidth:50}, 6:{cellWidth:28, halign:'center'} },
      didParseCell:(data)=>{
        if(f.tipo!=='gestion') estadoColor(data, 5);
        if(data.section==='body' && data.column.index===0 && typeof data.cell.raw==='string' && data.cell.raw.indexOf('URG')===0){ data.cell.styles.textColor = [193,84,75]; data.cell.styles.fontStyle = 'bold'; }
      }
    });
    y = doc.lastAutoTable.finalY + 14;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_GRAY);
    doc.text('URG = urgencia inmediata.   Días = desde la detección hasta hoy (o hasta la resolución en fallas cerradas).', marginX, y); doc.setTextColor(0); y += 16;
  }

  // ---- Firmas
  if(y > pageH - 100){ doc.addPage(); y = 60; }
  y += 8;
  doc.setDrawColor(...PDF_LINE); doc.line(marginX, y, pageW-marginX, y); y += 26;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text('Entregado por (Administración): _____________________________     Fecha: __________', marginX, y); y += 30;
  doc.text('Recibido por (Mantención): _____________________________     Fecha: __________', marginX, y);

  pdfFooterPages(doc, marginX, pageW, pageH);
  doc.save('Informe_' + infSlug(T.nombre) + '_' + new Date().toISOString().slice(0,10) + '.pdf');
  showToast('PDF generado ✓');
}

/* ================= EXCEL UNIFICADO ================= */
function buildExcelInforme(items){
  const f = STATE.inf, T = INF_TIPOS[f.tipo];
  const sorted = items.slice().sort(f.tipo==='gestion'
    ? (a,b)=>(a.Fecha_Resolucion||'').localeCompare(b.Fecha_Resolucion||'')
    : (a,b)=>cmpPrioridad(a,b) || ((b.Piso||0)-(a.Piso||0)));
  const rows = sorted.map(i=>{
    const n = nivelesDe(i), p = prioridadDe(i), cerrada = esCerradaMod(i);
    return {
      'Folio': i.Folio, 'Torre': i.Torre||'Común', 'Piso': i.Piso, 'Lugar': i.Origen||'', 'Tipo de falla': i.Categoria||'',
      'Detalle': i.Detalle||'', 'Prioridad': p ? PRIORIDADES[p].label : '', 'Gravedad': n.gravedad, 'Importancia': n.importancia, 'Urgencia': n.urgencia,
      'Urgente': esUrgente(i) ? 'Sí' : '', 'Seguimiento': esSeguimiento(i) ? 'Sí' : '', 'Estado': i.Estado||'Sin revisar',
      'Área responsable': i.Area_Derivacion||'', 'Grupo': i.Grupo||'',
      'Fecha detección': i.Fecha_Deteccion||'', 'Última actualización': i.Fecha_Ultima_Actualizacion||'', 'Fecha resolución': i.Fecha_Resolucion||'',
      'Días': (cerrada ? diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion) : diasEntre(i.Fecha_Deteccion)) ?? '',
      'Atrasada': (!cerrada && isAtrasada(i)) ? 'Sí' : '',
      'Actualizado por': i.Actualizado_Por||'', 'Notas': i.Notas||'',
      'Foto detección': i.Foto_Deteccion_URL||'', 'Foto resolución': i.Foto_Resolucion_URL||''
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:10},{wch:9},{wch:6},{wch:18},{wch:18},{wch:42},{wch:10},{wch:10},{wch:11},{wch:11},{wch:8},{wch:11},{wch:12},{wch:18},{wch:16},{wch:16},{wch:17},{wch:16},{wch:7},{wch:9},{wch:14},{wch:30},{wch:22},{wch:22}];

  const torresVis = TORRES_ALL.filter(t=>items.some(i=>(i.Torre||'Común')===t));
  const resumen = infCantidades(items).map(([c,v])=>{
    const r = { 'Tipo de falla': c, 'Total': v.total };
    torresVis.forEach(t=>{ r[t] = v.por[t] || 0; });
    return r;
  });
  const tot = { 'Tipo de falla': 'TOTAL', 'Total': items.length };
  torresVis.forEach(t=>{ tot[t] = items.filter(i=>(i.Torre||'Común')===t).length; });
  resumen.push(tot);
  const ws2 = XLSX.utils.json_to_sheet(resumen);
  ws2['!cols'] = [{wch:24},{wch:8},...torresVis.map(()=>({wch:10}))];

  const info = [['Informe', T.titulo], ['Comunidad', COMUNIDAD], ['Generado', new Date().toLocaleString('es-CL')], ['Ítems incluidos', items.length], ['', ''], ['Filtros aplicados', '']]
    .concat(infFiltroLineas().map(l=>['', l]));
  const ws3 = XLSX.utils.aoa_to_sheet(info);
  ws3['!cols'] = [{wch:20},{wch:70}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Detalle');
  XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');
  if(f.tipo==='gestion'){
    const areas = [...new Set(items.map(i=>i.Area_Derivacion || 'Sin área asignada'))];
    const ra = areas.map(a=>{
      const lst = items.filter(i=>(i.Area_Derivacion||'Sin área asignada')===a);
      const d = lst.map(i=>diasEntre(i.Fecha_Deteccion, i.Fecha_Resolucion)).filter(x=>x!==null);
      return { 'Área': a, 'Resueltas': lst.length, 'Prom. días': d.length ? +(d.reduce((s,x)=>s+x,0)/d.length).toFixed(1) : '', 'Más lenta (días)': d.length ? Math.max(...d) : '' };
    }).sort((a,b)=>b['Resueltas']-a['Resueltas']);
    const ws4 = XLSX.utils.json_to_sheet(ra); ws4['!cols'] = [{wch:24},{wch:10},{wch:11},{wch:16}];
    XLSX.utils.book_append_sheet(wb, ws4, 'Por área');
  }
  XLSX.utils.book_append_sheet(wb, ws3, 'Info');
  XLSX.writeFile(wb, 'Informe_' + infSlug(T.nombre) + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
  showToast('Excel generado ✓');
}

function guiaVista(){ try{ return !!localStorage.getItem('mant_guia_vista'); }catch(e){ return true; } }
function openGuia(){ GUIA_I = 0; try{ localStorage.setItem('mant_guia_vista','1'); }catch(e){} guiaRender(); }
function guiaRender(){
  const p = guiaPasos(), s = p[GUIA_I], last = GUIA_I === p.length-1;
  showModal(`
    <div class="wz-prog">${p.map((_,k)=>`<i class="${k<=GUIA_I?'on':''}"></i>`).join('')}</div>
    <div class="gd-ico">${s.ico}</div>
    <div class="gd-t">${s.t}</div>
    <div class="gd-x">${s.x}</div>
    <div class="btn-row" style="margin-top:18px">
      ${GUIA_I>0 ? '<button class="btn btn-ghost" onclick="guiaIr(-1)">← Atrás</button>' : ''}
      <button class="btn btn-primary" style="margin-top:0" onclick="${last ? 'closeModal()' : 'guiaIr(1)'}">${last ? '¡Entendido!' : 'Siguiente →'}</button>
    </div>
    ${last ? '' : '<button class="wz-link" style="display:block;margin:6px auto 0" onclick="closeModal()">Saltar guía</button>'}`);
}
function guiaIr(d){ GUIA_I = Math.max(0, Math.min(guiaPasos().length-1, GUIA_I + d)); guiaRender(); }
